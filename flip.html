<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
<title>最后一张 翻转版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
/* Layout: one-screen card table. The game itself owns the theme: the light side is a bright table, the dark side a violet night table. */
:root {
  color-scheme: light;
  --red: #e0303f; --yellow: #f5b70a; --green: #1f9d57; --blue: #2370d6;
  --pink: #ec3f8f; --teal: #10b0ae; --orange: #f26b1d; --purple: #7d43c8;
  --paper: #ffffff; --ink: #111111;
  --table: #d9e6ee; --table-hi: #f2f7fa; --rail: #b9ccd8;
  --fg: #14202b; --muted: #4f6474; --glow: #2370d6; --seatbg: #ffffff80; --line: #14202b22;
  --num: "Bungee", "Arial Black", system-ui, sans-serif;
  --ui: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
:root.dark {
  color-scheme: dark;
  --table: #1a1126; --table-hi: #2e1c44; --rail: #0c0712;
  --fg: #f3ecfa; --muted: #ad9bc4; --glow: #ff4fa3; --seatbg: #ffffff0f; --line: #ffffff22;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--rail); color: var(--fg); font-family: var(--ui);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overflow: hidden;
  transition: background .5s;
}
.app {
  height: 100%; max-width: 600px; margin: 0 auto; box-sizing: border-box;
  display: grid; grid-template-rows: auto 1fr auto auto auto; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  background: radial-gradient(120% 70% at 50% 45%, var(--table-hi), var(--table) 60%, var(--rail));
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.top h1 { margin: 0; font: 400 1.05rem var(--num); display: flex; align-items: center; gap: 8px; }
.side-tag { font: 600 .72rem var(--ui); padding: 3px 8px; border-radius: 999px; background: var(--glow); color: #fff; letter-spacing: .08em; }
.ghostbtn { font: 600 .85rem var(--ui); color: var(--fg); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.seats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.seat {
  position: relative; background: var(--seatbg); border-radius: 12px; padding: 8px 6px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  box-shadow: inset 0 0 0 1.5px var(--line); transition: box-shadow .2s;
}
.seat.active { box-shadow: inset 0 0 0 2.5px var(--glow); }
.seat .who { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem; }
.av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: #111; }
.seat .count { font: 400 .78rem var(--num); color: var(--muted); }
.seat .count.one { color: var(--glow); }
.minis { display: flex; height: 30px; max-width: 100%; }
.mini {
  flex: 0 0 auto; width: 20px; height: 30px; border-radius: 4px; margin-left: -11px; box-sizing: border-box;
  border: 1.5px solid var(--paper); background: var(--cc); box-shadow: -1px 0 3px #0006;
  font: 400 9px/26px var(--num); text-align: center; color: var(--paper); overflow: hidden;
}
.mini:first-child { margin-left: 0; }
.mini.f-D { border-color: #000; }
.mini.c-w { background: conic-gradient(var(--q1) 0 25%, var(--q2) 0 50%, var(--q3) 0 75%, var(--q4) 0); }
.peek { font-size: .68rem; color: var(--muted); }
.bubble {
  position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); z-index: 3; white-space: nowrap;
  background: var(--glow); color: #fff; font: 400 .75rem var(--num); padding: 4px 8px; border-radius: 8px;
  animation: bub 1.4s ease-out forwards;
}
@keyframes bub { 0% { transform: translate(-50%, 6px) scale(.6); opacity: 0; } 15% { transform: translate(-50%, 0) scale(1.08); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

.center { display: flex; align-items: center; justify-content: center; gap: 28px; min-height: 0; position: relative; perspective: 800px; }
.center.flipping .pile { animation: turn .6s ease-in-out; }
@keyframes turn { 50% { transform: rotateY(90deg); } }
.pile { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); }
.deckbtn { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 12px; }
.deckbtn.can { animation: nudge 1.6s ease-in-out infinite; }
.deckbtn.can .card { box-shadow: 0 0 0 3px var(--glow), 0 8px 18px #0006; }
@keyframes nudge { 50% { transform: translateY(-4px); } }
.ring { padding: 6px; border-radius: 16px; transition: background .3s; }
.dir { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: .78rem; color: var(--muted); white-space: nowrap; }
.banner {
  position: absolute; inset: auto 0 auto 0; top: 42%; text-align: center; z-index: 6; pointer-events: none;
  font: 400 2rem var(--num); color: var(--glow); text-shadow: 0 2px 0 #0004; animation: banner 1.3s ease-out forwards;
}
@keyframes banner { 0% { transform: scale(.4); opacity: 0; } 20% { transform: scale(1.1); opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }

/* cards: light faces have a white oval, dark faces a black one */
.card {
  --w: 70px;
  width: var(--w); aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 10px; border: 3px solid var(--paper);
  position: relative; overflow: hidden; container-type: inline-size; box-shadow: 0 4px 10px #0005;
  background: var(--cc); color: var(--paper); font-family: var(--num);
}
.c-r { --cc: var(--red); } .c-y { --cc: var(--yellow); } .c-g { --cc: var(--green); } .c-b { --cc: var(--blue); }
.c-p { --cc: var(--pink); } .c-t { --cc: var(--teal); } .c-o { --cc: var(--orange); } .c-v { --cc: var(--purple); }
.c-w { --cc: #161616; }
.f-L { --q1: var(--red); --q2: var(--blue); --q3: var(--yellow); --q4: var(--green); }
.f-D { --q1: var(--pink); --q2: var(--teal); --q3: var(--orange); --q4: var(--purple); }
.card.f-D { border-color: #0b0b0b; }
.card .oval {
  position: absolute; left: 50%; top: 50%; width: 82%; height: 64%; border-radius: 50%; background: var(--paper);
  transform: translate(-50%, -50%) rotate(-28deg); display: grid; place-items: center;
}
.card.f-D .oval { background: #0b0b0b; }
.card .oval b { transform: rotate(28deg); font-weight: 400; font-size: 38cqw; color: var(--cc); line-height: 1; }
.card.sm .oval b { font-size: 26cqw; }
.card.c-w .oval { background: conic-gradient(var(--q1) 0 25%, var(--q2) 0 50%, var(--q3) 0 75%, var(--q4) 0); }
.card.c-w .oval b { color: var(--paper); text-shadow: 0 1px 0 #000, 0 0 6px #000a; font-size: 32cqw; }
.card.c-w.sm .oval b { font-size: 24cqw; }
.card.all::after {
  content: "全体"; position: absolute; left: 0; right: 0; bottom: 13%; text-align: center;
  font: 700 15cqw var(--ui); color: var(--paper); text-shadow: 0 1px 2px #000c;
}
.card .corner { position: absolute; font-size: 18cqw; line-height: 1; text-shadow: 1px 1px 0 #0006; }
.card .tl { top: 5%; left: 7%; } .card .br { bottom: 5%; right: 7%; transform: rotate(180deg); }
.card.landed { animation: land .28s ease-out; }
@keyframes land { from { transform: translateY(-30px) scale(1.25) rotate(var(--r0, 0deg)); opacity: 0; } }

.msg { text-align: center; font-size: .92rem; min-height: 2.6em; line-height: 1.35; display: grid; place-items: center; text-wrap: balance; }
.msg.mine { color: var(--glow); font-weight: 700; }
.hand { position: relative; width: 100%; }
.hand .card { position: absolute; bottom: 0; cursor: pointer; transition: transform .15s, left .2s, filter .2s; }
.hand.myturn .card.ok { transform: translateY(-14px); box-shadow: 0 0 0 2.5px var(--glow), 0 8px 16px #0007; }
.hand.myturn .card.no { filter: brightness(.6) saturate(.7); }
.hand .card.shake { animation: shake .3s; }
@keyframes shake { 25% { margin-left: -6px; } 75% { margin-left: 6px; } }

.controls { display: flex; gap: 10px; justify-content: center; padding-bottom: 4px; }
.btn { font: 400 .95rem var(--num); border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer; background: var(--fg); color: var(--table); }
.btn.call { background: var(--glow); color: #fff; }
.btn.call.done { background: transparent; color: var(--glow); box-shadow: inset 0 0 0 2px var(--glow); }
.btn:disabled { opacity: .3; cursor: default; }
.btn:focus-visible, .ghostbtn:focus-visible, .deckbtn:focus-visible, .swatch:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }

.modal { position: fixed; inset: 0; z-index: 20; background: #05030acc; display: grid; place-items: center; padding: 16px; animation: fade .2s; }
.modal .box { background: var(--table-hi); color: var(--fg); border-radius: 18px; padding: 22px; max-width: 380px; width: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; gap: 14px; max-height: 88vh; overflow-y: auto; }
.modal h2 { margin: 0; font: 400 1.4rem var(--num); }
.modal h3 { margin: 4px 0 0; font-size: .95rem; text-align: left; }
.modal li { color: var(--muted); line-height: 1.5; font-size: .9rem; text-align: left; }
.modal ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swatch { border: 0; border-radius: 12px; height: 64px; cursor: pointer; font: 600 1.05rem var(--ui); color: #fff; text-shadow: 0 1px 2px #0008; }
.results { display: flex; flex-direction: column; gap: 6px; }
.results div { display: flex; justify-content: space-between; font-size: .95rem; }
.results div span:last-child { font-family: var(--num); color: var(--muted); }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <div>
    <div class="top">
      <h1>最后一张 <span class="side-tag" id="sideTag">亮面</span></h1>
      <div style="display:flex;gap:6px">
        <button class="ghostbtn" id="rulesBtn">规则</button>
        <button class="ghostbtn" id="newBtn">新一局</button>
      </div>
    </div>
    <div class="seats" id="seats"></div>
  </div>
  <div class="center" id="center">
    <div class="dir" id="dir"></div>
    <div class="pile">
      <button class="deckbtn" id="deck" aria-label="抽一张牌"></button>
      <span id="deckCount"></span>
    </div>
    <div class="pile">
      <div class="ring" id="ring"></div>
      <span id="colorName"></span>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="hand" id="hand"></div>
  <div class="controls">
    <button class="btn call" id="callBtn">喊 最后一张!</button>
    <button class="btn" id="passBtn" hidden>过</button>
  </div>
</div>

<script>
(() => {
  const SIDE_COLORS = { L: ['r', 'y', 'g', 'b'], D: ['p', 't', 'o', 'v'] };
  const CN = { r: '红', y: '黄', g: '绿', b: '蓝', p: '粉', t: '青', o: '橙', v: '紫' };
  const CSSC = { r: 'var(--red)', y: 'var(--yellow)', g: 'var(--green)', b: 'var(--blue)', p: 'var(--pink)', t: 'var(--teal)', o: 'var(--orange)', v: 'var(--purple)' };
  const NAMES = ['你', '阿明', '小美', '老王'];
  const AVC = ['', '#7fd1ff', '#ffa3c4', '#b8e986'];
  const SYM = { '+1': '+1', '+5': '+5', skip: '⊘', skipall: '⊘⊘', rev: '⇄', flip: '⇅', wild: '★', w2: '+2', wdc: '+?' };
  const VN = { '+1': '+1', '+5': '+5', skip: '跳过', skipall: '全体跳过', rev: '反转', flip: '翻面', wild: '变色', w2: '变色+2', wdc: '变色抽到底' };
  const $ = (id) => document.getElementById(id);
  let S, timer = null, lastTop = null, lastSide = 'L';

  const mod = (n) => ((n % 4) + 4) % 4;
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const other = () => S.side === 'L' ? 'D' : 'L';
  const F = (card) => card[S.side];
  const top = () => S.discard[S.discard.length - 1];
  const nextP = () => mod(S.turn + S.dir);
  const playable = (card) => { const f = F(card), t = F(top()); return f.c === 'w' || !S.color || f.c === S.color || f.v === t.v; };
  const label = (f, col) => f.c === 'w' ? `${VN[f.v]}牌，选了${CN[col]}色` : CN[f.c] + (VN[f.v] || ' ' + f.v);

  function faces(side) {
    const out = [];
    const acts = side === 'L' ? ['+1', 'rev', 'skip', 'flip'] : ['+5', 'rev', 'skipall', 'flip'];
    for (const c of SIDE_COLORS[side]) for (let k = 0; k < 2; k++) {
      for (let n = 1; n <= 9; n++) out.push({ c, v: String(n) });
      for (const v of acts) out.push({ c, v });
    }
    for (let k = 0; k < 4; k++) { out.push({ c: 'w', v: 'wild' }); out.push({ c: 'w', v: side === 'L' ? 'w2' : 'wdc' }); }
    return shuffle(out);
  }
  function buildDeck() {
    const L = faces('L'), D = faces('D');
    return shuffle(L.map((f, i) => ({ id: i, L: f, D: D[i] })));
  }

  function newGame() {
    clearTimeout(timer);
    S = { gid: Math.random(), deck: buildDeck(), discard: [], hands: [[], [], [], []], turn: 0, dir: 1, side: 'L',
          color: null, drawn: null, phase: 'play', called: false, winner: null, msg: '', bubble: null, banner: null };
    for (let i = 0; i < 7; i++) for (let p = 0; p < 4; p++) S.hands[p].push(S.deck.pop());
    let t;
    while (true) { t = S.deck.pop(); if (/^\d$/.test(t.L.v)) break; S.deck.unshift(t); }
    S.discard.push(t); S.color = t.L.c;
    lastSide = 'L';
    sortHand();
    S.msg = '你先出。对手手上那排小牌是他们的另一面，翻面后就会变成那样。';
    closeModal();
    render();
  }

  function sortHand() {
    const order = {}; [...SIDE_COLORS.L, ...SIDE_COLORS.D, 'w'].forEach((c, i) => order[c] = i);
    const vo = (v) => /^\d$/.test(v) ? +v : 10 + Object.keys(SYM).indexOf(v);
    S.hands[0].sort((a, b) => order[F(a).c] - order[F(b).c] || vo(F(a).v) - vo(F(b).v));
  }

  function draw(p, n) {
    const got = [];
    for (let i = 0; i < n; i++) {
      if (!S.deck.length) {
        const t = S.discard.pop();
        S.deck = shuffle(S.discard); S.discard = [t];
        if (!S.deck.length) break;
      }
      const c = S.deck.pop(); S.hands[p].push(c); got.push(c);
    }
    return got;
  }
  function drawUntil(p, col) {
    let n = 0;
    while (n < 60) {
      const [c] = draw(p, 1);
      if (!c) break;
      n++;
      if (F(c).c === col) break;
    }
    return n;
  }

  function flash(p, text) { S.bubble = { p, text, until: Date.now() + 1400 }; setTimeout(render, 1450); }

  function doFlip() {
    S.side = other();
    S.discard.reverse();
    S.deck.reverse();
    const f = F(top());
    S.color = f.c === 'w' ? null : f.c;
    S.banner = { text: S.side === 'D' ? '翻到暗面！' : '翻回亮面！', until: Date.now() + 1300 };
    setTimeout(render, 1350);
    sortHand();
    return `全桌翻面，现在是${S.side === 'D' ? '暗面' : '亮面'}，顶牌变成 ${f.c === 'w' ? '变色牌（任意颜色都能出）' : label(f)}`;
  }

  function playCard(p, idx, col) {
    const card = S.hands[p].splice(idx, 1)[0];
    S.discard.push(card);
    const f = F(card);
    S.color = f.c === 'w' ? col : f.c;
    S.drawn = null;
    let m = `${NAMES[p]}打出 ${label(f, S.color)}`;
    if (S.hands[p].length === 1) {
      if (p === 0 && !S.called) { draw(0, 2); m += '。你没喊“最后一张”，罚抽 2 张'; }
      else if (p !== 0) flash(p, '最后一张!');
    }
    S.called = false;
    if (S.hands[p].length === 0) {
      S.phase = 'over'; S.winner = p; S.msg = p === 0 ? '你赢了！' : `${NAMES[p]}出完了牌。`;
      render(); showResult(); return;
    }
    let step = 1;
    const t = nextP();
    switch (f.v) {
      case 'skip': step = 2; m += `，${NAMES[t]}被跳过`; break;
      case 'skipall': step = 0; m += `，其他人全被跳过，${NAMES[p]}再出一次`; break;
      case 'rev': S.dir *= -1; m += '，方向反转'; break;
      case '+1': draw(t, 1); step = 2; m += `，${NAMES[t]}抽 1 张并停一轮`; break;
      case '+5': draw(t, 5); step = 2; m += `，${NAMES[t]}抽 5 张并停一轮`; break;
      case 'w2': draw(t, 2); step = 2; m += `，${NAMES[t]}抽 2 张并停一轮`; break;
      case 'wdc': { const n = drawUntil(t, col); step = 2; m += `，${NAMES[t]}一直抽到${CN[col]}色，共抽 ${n} 张`; break; }
      case 'flip': m = `${NAMES[p]}打出 翻面牌。` + doFlip(); break;
    }
    S.turn = mod(S.turn + S.dir * step);
    if (p === 0) sortHand();
    S.msg = m + (S.turn === 0 ? '。轮到你了' : '');
    render();
  }

  function pickColor(p) {
    const cols = SIDE_COLORS[S.side], cnt = {};
    cols.forEach(c => cnt[c] = 0);
    S.hands[p].forEach(c => { const f = F(c); if (f.c !== 'w') cnt[f.c]++; });
    return cols.reduce((a, b) => cnt[b] > cnt[a] ? b : a, cols[Math.floor(Math.random() * 4)]);
  }

  function botTurn() {
    const p = S.turn, hand = S.hands[p], gid = S.gid;
    const opts = hand.map((c, i) => [c, i]).filter(([c]) => playable(c));
    if (opts.length) {
      const threat = S.hands[nextP()].length <= 2;
      const score = ([c]) => {
        const f = F(c);
        if (f.c === 'w') return (threat && f.v !== 'wild') ? 9 : -4 - (f.v !== 'wild' ? 1 : 0);
        if (['+1', '+5', 'skip'].includes(f.v)) return threat ? 8 : (f.v === '+5' ? 4 : 1.5);
        if (f.v === 'skipall') return 3;
        if (f.v === 'flip') return 1 + Math.random() * 2;
        if (f.v === 'rev') return 1;
        return 2 + (f.c === S.color ? 1 : 0) + Math.random();
      };
      opts.sort((a, b) => score(b) - score(a));
      const [c, i] = opts[0];
      playCard(p, i, F(c).c === 'w' ? pickColor(p) : null);
      return;
    }
    const [c] = draw(p, 1);
    S.msg = `${NAMES[p]}没有能出的牌，抽了一张`;
    render();
    timer = setTimeout(() => {
      if (S.gid !== gid) return;
      if (c && playable(c)) playCard(p, S.hands[p].indexOf(c), F(c).c === 'w' ? pickColor(p) : null);
      else { S.turn = nextP(); S.msg = `${NAMES[p]}过` + (S.turn === 0 ? '。轮到你了' : ''); render(); }
    }, 650);
  }

  function schedule() {
    clearTimeout(timer);
    if (S.phase === 'play' && S.turn !== 0) {
      const gid = S.gid;
      timer = setTimeout(() => { if (S.gid === gid && S.phase === 'play' && S.turn !== 0) botTurn(); }, 1000);
    }
  }

  // ---------- your actions ----------
  function tapCard(id, el) {
    if (S.phase !== 'play' || S.turn !== 0) return;
    const idx = S.hands[0].findIndex(c => c.id === id);
    const card = S.hands[0][idx];
    if ((S.drawn !== null && id !== S.drawn) || !playable(card)) {
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); return;
    }
    if (F(card).c === 'w') { chooseColor(id); return; }
    playCard(0, idx);
  }
  function tapDeck() {
    if (S.phase !== 'play' || S.turn !== 0 || S.drawn !== null) return;
    const [c] = draw(0, 1);
    sortHand();
    if (c && playable(c)) { S.drawn = c.id; S.msg = '抽到一张能出的牌。点它打出，或者点“过”'; }
    else { S.called = false; S.turn = nextP(); S.msg = '抽到的牌出不了，轮到下家'; }
    render();
  }
  function pass() {
    if (S.drawn === null) return;
    S.drawn = null; S.called = false; S.turn = nextP(); S.msg = '你选择了过';
    render();
  }
  const canCall = () => S.phase === 'play' && S.turn === 0 && S.hands[0].length === 2 && !S.called &&
    S.hands[0].some(c => playable(c) && (S.drawn === null || c.id === S.drawn));
  function call() {
    if (!canCall()) return;
    S.called = true; flash(0, '最后一张!'); S.msg = '喊好了，现在打出一张牌';
    render();
  }

  // ---------- modals ----------
  function openModal(html) {
    closeModal();
    const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
    m.innerHTML = `<div class="box">${html}</div>`;
    document.body.appendChild(m);
    return m;
  }
  function closeModal() { const m = $('modal'); if (m) m.remove(); }

  function chooseColor(id) {
    const card = S.hands[0].find(c => c.id === id);
    const hint = F(card).v === 'wdc' ? '<p style="margin:0;color:var(--muted)">下家会一直抽牌，直到抽到这个颜色</p>' : '';
    const m = openModal(`<h2>选一个颜色</h2>${hint}<div class="swatches">${SIDE_COLORS[S.side].map(c =>
      `<button class="swatch" data-c="${c}" style="background:${CSSC[c]}">${CN[c]}色</button>`).join('')}</div>
      <button class="ghostbtn" id="cancelPick">先不出这张</button>`);
    m.querySelectorAll('.swatch').forEach(b => b.onclick = () => {
      closeModal();
      const idx = S.hands[0].findIndex(c => c.id === id);
      if (idx >= 0 && S.turn === 0 && S.phase === 'play') playCard(0, idx, b.dataset.c);
    });
    $('cancelPick').onclick = closeModal;
  }
  function showResult() {
    const rows = [0, 1, 2, 3].map(p => [NAMES[p], S.hands[p].length]).sort((a, b) => a[1] - b[1])
      .map(([n, k]) => `<div><span>${n}</span><span>${k === 0 ? '出完' : '剩 ' + k + ' 张'}</span></div>`).join('');
    openModal(`<h2>${S.winner === 0 ? '你赢了！' : NAMES[S.winner] + ' 赢了'}</h2>
      <div class="results">${rows}</div><button class="btn call" id="againBtn">再来一局</button>`);
    $('againBtn').onclick = newGame;
  }
  function showRules() {
    openModal(`<h2>怎么玩</h2><ul>
      <li>每张牌有<b>亮面</b>和<b>暗面</b>。游戏从亮面开始。</li>
      <li>出的牌要和顶牌<b>同色</b>或<b>同数字/同符号</b>，变色牌随时能出。没有能出的就抽一张。</li>
      <li>你看不到自己牌的另一面，但能看到对手牌的另一面（座位里那排小牌）。</li>
      <li>手里剩 2 张、出倒数第二张前，先点“喊 最后一张!”，忘了罚抽 2 张。最先出完的人赢。</li></ul>
      <h3>亮面功能牌</h3><ul>
      <li>+1：下家抽 1 张并停一轮</li><li>⊘ 跳过：跳过下家</li><li>⇄ 反转：出牌方向反过来</li>
      <li>⇅ 翻面：全桌所有牌翻到另一面</li><li>★ 变色：自选颜色</li><li>变色 +2：自选颜色，下家抽 2 张并停一轮</li></ul>
      <h3>暗面功能牌</h3><ul>
      <li>+5：下家抽 5 张并停一轮</li><li>⊘⊘ 全体跳过：其他人都跳过，你再出一次</li><li>⇄ 反转、⇅ 翻面：同亮面</li>
      <li>+? 变色抽到底：自选颜色，下家一直抽到这个颜色为止，并停一轮</li></ul>
      <button class="btn" id="okRules">知道了</button>`);
    $('okRules').onclick = closeModal;
  }

  // ---------- render ----------
  function cardHTML(f, side, id, extra = '') {
    const s = f.v === 'skipall' ? '⊘' : (SYM[f.v] || f.v);
    const sm = f.v === 'skipall' ? 'all' : (s.length > 2 ? 'sm' : '');
    return `<div class="card f-${side} c-${f.c} ${sm} ${extra}" data-id="${id}"><span class="corner tl">${s}</span>` +
      `<span class="oval"><b>${s}</b></span><span class="corner br">${s}</span></div>`;
  }

  function render() {
    document.documentElement.classList.toggle('dark', S.side === 'D');
    $('sideTag').textContent = S.side === 'D' ? '暗面' : '亮面';
    const bub = S.bubble && Date.now() < S.bubble.until ? S.bubble : null;
    const os = other();
    $('seats').innerHTML = [1, 2, 3].map(p => {
      const n = S.hands[p].length;
      const minis = S.hands[p].slice(0, 9).map(c => { const f = c[os]; const s = f.c === 'w' ? '' : (SYM[f.v] || f.v);
        return `<i class="mini f-${os} c-${f.c}">${s.length > 2 ? '⊘' : s}</i>`; }).join('');
      return `<div class="seat ${S.turn === p && S.phase === 'play' ? 'active' : ''}">
        <div class="who"><span class="av" style="background:${AVC[p]}">${NAMES[p][1]}</span>${NAMES[p]}</div>
        <div class="minis">${minis}</div>
        <div class="count ${n === 1 ? 'one' : ''}">${n} 张${n > 9 ? '（显示 9）' : ''}</div>
        ${bub && bub.p === p ? `<div class="bubble">${bub.text}</div>` : ''}</div>`;
    }).join('');

    const myTurn = S.phase === 'play' && S.turn === 0;
    const deckTop = S.deck[S.deck.length - 1];
    $('deck').innerHTML = deckTop ? cardHTML(deckTop[os], os, -1) : '';
    const dc = $('deck').firstChild; if (dc) dc.style.setProperty('--w', '72px');
    $('deck').classList.toggle('can', myTurn && S.drawn === null && !S.hands[0].some(playable));
    $('deckCount').textContent = `牌堆 ${S.deck.length}（背面）`;

    const t = top(), tf = F(t);
    const rot = (t.id * 37) % 17 - 8;
    const changed = t.id !== lastTop || S.side !== lastSide;
    $('ring').style.background = S.color ? CSSC[S.color] : 'conic-gradient(var(--q1) 0 25%, var(--q2) 0 50%, var(--q3) 0 75%, var(--q4) 0)';
    $('ring').className = 'ring f-' + S.side;
    $('ring').innerHTML = cardHTML(tf, S.side, t.id, changed ? 'landed' : '');
    const tc = $('ring').firstChild;
    tc.style.setProperty('--w', '78px'); tc.style.transform = `rotate(${rot}deg)`; tc.style.setProperty('--r0', rot + 'deg');
    if (S.side !== lastSide) { const c = $('center'); c.classList.remove('flipping'); void c.offsetWidth; c.classList.add('flipping'); }
    lastTop = t.id; lastSide = S.side;
    $('colorName').textContent = S.color ? `当前颜色：${CN[S.color]}` : '任意颜色';
    $('dir').textContent = S.dir === 1 ? '出牌方向 ↻ 顺时针' : '出牌方向 ↺ 逆时针';
    const old = $('center').querySelector('.banner'); if (old) old.remove();
    if (S.banner && Date.now() < S.banner.until) {
      const b = document.createElement('div'); b.className = 'banner'; b.textContent = S.banner.text;
      $('center').appendChild(b); S.banner = null;
    }

    const msg = $('msg'); msg.textContent = S.msg; msg.classList.toggle('mine', myTurn);
    renderHand(myTurn, bub);

    const cb = $('callBtn');
    cb.disabled = !canCall() && !(S.called && myTurn);
    cb.classList.toggle('done', S.called);
    cb.textContent = S.called ? '已喊 ✓' : '喊 最后一张!';
    $('passBtn').hidden = !(myTurn && S.drawn !== null);
    schedule();
  }

  function renderHand(myTurn, bub) {
    const el = $('hand'), hand = S.hands[0], n = hand.length;
    const W = el.clientWidth || 360;
    const cw = Math.round(Math.min(84, Math.max(58, W * 0.17)));
    const step = n > 1 ? Math.min(cw + 6, (W - cw) / (n - 1)) : 0;
    const left0 = (W - (cw + step * (n - 1))) / 2;
    el.style.height = Math.round(cw * 1.5 + 18) + 'px';
    el.classList.toggle('myturn', myTurn);
    el.innerHTML = hand.map(c => {
      const ok = playable(c) && (S.drawn === null || c.id === S.drawn);
      return cardHTML(F(c), S.side, c.id, ok ? 'ok' : 'no');
    }).join('') + (bub && bub.p === 0 ? `<div class="bubble" style="bottom:auto;top:-28px">${bub.text}</div>` : '');
    el.querySelectorAll('.card').forEach((cEl, i) => {
      cEl.style.setProperty('--w', cw + 'px');
      cEl.style.left = (left0 + i * step) + 'px';
      cEl.style.zIndex = i;
      cEl.onclick = () => tapCard(+cEl.dataset.id, cEl);
    });
  }

  $('deck').onclick = tapDeck;
  $('passBtn').onclick = pass;
  $('callBtn').onclick = call;
  $('newBtn').onclick = newGame;
  $('rulesBtn').onclick = showRules;
  window.addEventListener('resize', () => S && renderHand(S.phase === 'play' && S.turn === 0, null));

  window.claude?.hot?.snapshot?.(() => ({ S }));
  function start(data) {
    if (data && data.S) { S = data.S; S.gid = Math.random(); lastSide = S.side; render(); if (S.phase === 'over') showResult(); }
    else newGame();
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</html>

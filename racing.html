<title>U6 開車趣</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap">
<style>
/* Layout: full-screen game canvases; HUD pinned top, pedals pinned bottom. One look in every theme: the scene sets the mood. */
:root {
  --ink: #ffffff;
  --deep: #0f1a2e;
  --glass: rgba(12, 20, 38, 0.55);
  --line: rgba(255, 255, 255, 0.32);
  --sun: #ffcf6b;
  --coral: #ff7f6b;
  --mint: #7fe0c8;
  --f-num: "Quicksand", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--deep); color: var(--ink); font-family: var(--f-body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
canvas.game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#city { visibility: hidden; }
body[data-mode="city"] #city { visibility: visible; }
body[data-mode="city"] #scenic { visibility: hidden; }
body:not([data-mode="city"]) .c-only { display: none !important; }
body:not([data-mode="scenic"]) .s-only { display: none !important; }
body[data-mode="menu"] .hud, body[data-mode="menu"] .pads { display: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px;
  pointer-events: none; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
}
.stat { display: grid; gap: 4px; justify-items: start; }
.stat.right { justify-items: end; text-align: right; }
.stat.mid { justify-items: center; text-align: center; }
.label { font-size: 11px; letter-spacing: 0.12em; opacity: 0.9; }
.val { font-family: var(--f-num); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.val small { font-size: 12px; margin-left: 3px; opacity: 0.85; }
.val.speed { font-size: 40px; }
.hp { width: 104px; height: 8px; border-radius: 5px; background: rgba(255, 255, 255, 0.25); overflow: hidden; }
.hp i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--mint), #b8f5a0); transform-origin: left; transition: transform 0.2s; }
.hp.low i { background: var(--coral); animation: pulse 0.45s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: 0.45; } }
.chip {
  font-size: 12px; letter-spacing: 0.06em; text-shadow: none; color: var(--ink);
  background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
}
.smallbtn { pointer-events: auto; font: 600 12px var(--f-body); padding: 5px 11px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gearchip { font-family: var(--f-num); font-weight: 700; font-size: 14px; padding: 2px 10px; }
.gearchip.r { background: rgba(255, 127, 107, 0.85); border-color: transparent; }
.lightchip { display: inline-flex; align-items: center; gap: 6px; }
.lightchip i { width: 11px; height: 11px; border-radius: 50%; background: #555; box-shadow: 0 0 8px currentColor; }
#minimap { width: 104px; height: 104px; border-radius: 12px; border: 1px solid var(--line); background: rgba(12, 20, 38, 0.6); }

.toast {
  position: fixed; left: 0; right: 0; top: 26%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; font-weight: 800; font-size: clamp(22px, 6.5vw, 44px); letter-spacing: 0.06em;
  color: var(--ink); text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  pointer-events: none; opacity: 0; transition: opacity 0.35s;
}
.toast.show { opacity: 1; }
.toast.dmg { color: var(--coral); }

.pads {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  pointer-events: none;
}
.group { display: flex; gap: 12px; align-items: flex-end; }
.pad {
  pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent;
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--glass); color: var(--ink); border: 2px solid var(--line);
  font: 700 15px var(--f-body); letter-spacing: 0.08em;
  display: grid; place-items: center;
}
.pad svg { width: 28px; height: 28px; fill: currentColor; }
.pad.brake { width: 80px; height: 64px; border-radius: 16px; border-color: rgba(255, 127, 107, 0.75); }
.pad.gas { width: 66px; height: 104px; border-radius: 18px; border-color: rgba(127, 224, 200, 0.85);
  background-image: repeating-linear-gradient(0deg, transparent 0 12px, rgba(255,255,255,0.12) 12px 15px); }
.pad.gear { width: 54px; height: 54px; font: 700 18px var(--f-num); letter-spacing: 0; }
.pad.gear.r { background: rgba(255, 127, 107, 0.7); }
.pad.on { background-color: rgba(255, 255, 255, 0.3); transform: scale(0.95); }
.pad:focus-visible, .btn:focus-visible, .smallbtn:focus-visible, .trk:focus-visible, .mode:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
@media (pointer: fine) { .pads { display: none; } }

.screen {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto;
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, rgba(15, 26, 46, 0.25), rgba(15, 26, 46, 0.8));
}
.card { max-width: 430px; width: 100%; display: grid; gap: 14px; justify-items: center; text-align: center; }
.tag { margin: 0; font-family: var(--f-num); font-weight: 700; letter-spacing: 0.32em; font-size: 12px; color: var(--mint); }
.logo {
  margin: 0; font-size: clamp(42px, 12vw, 72px); line-height: 1; font-weight: 900; letter-spacing: 0.06em;
  background: linear-gradient(180deg, #fff6d8 10%, var(--sun) 45%, var(--coral) 95%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 18px rgba(255, 127, 107, 0.45)); text-wrap: balance;
}
.how { margin: 0; font-size: 14px; line-height: 1.75; opacity: 0.92; max-width: 34em; }
.how b { color: var(--sun); }
.modes { display: grid; gap: 10px; width: 100%; }
.mode {
  width: 100%; display: grid; gap: 4px; text-align: left; cursor: pointer; color: var(--ink);
  background: rgba(12, 20, 38, 0.7); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
  font: 500 13px var(--f-body);
}
.mode b { font-size: 20px; letter-spacing: 0.08em; color: var(--sun); }
.mode span { opacity: 0.85; line-height: 1.6; }
.mode:active { transform: scale(0.98); }
.btn {
  font: 800 18px var(--f-body); letter-spacing: 0.16em; color: var(--deep);
  background: linear-gradient(180deg, #ffe39b, var(--sun) 50%, var(--coral));
  border: 0; border-radius: 14px; padding: 12px 36px;
  box-shadow: 0 6px 22px rgba(255, 127, 107, 0.45);
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.btn:active { transform: scale(0.97); }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.result { display: flex; gap: 28px; justify-content: center; }
.newbest { color: var(--mint); font-weight: 700; letter-spacing: 0.1em; margin: 0; }

.panel { background: rgba(15, 26, 46, 0.92); border: 1px solid var(--line); border-radius: 20px; padding: 20px 16px; gap: 10px; }
.panel h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: 0.1em; }
.tracks { display: grid; gap: 8px; width: 100%; }
.trk {
  width: 100%; display: grid; gap: 2px; text-align: left; cursor: pointer;
  background: rgba(255, 255, 255, 0.06); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px; font: 500 13px var(--f-body);
}
.trk b { font-size: 16px; }
.trk span { opacity: 0.75; }
.trk.on { border-color: var(--sun); background: rgba(255, 207, 107, 0.16); }
.trk.on b::after { content: "  ♪ 播放中"; font-size: 12px; color: var(--sun); }
.note { margin: 0; font-size: 12px; line-height: 1.6; opacity: 0.7; text-align: left; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .hp.low i { animation: none; } .toast { transition: none; } }
</style>

<canvas class="game" id="scenic" aria-label="慢遊公路畫面"></canvas>
<canvas class="game" id="city" aria-label="城市開車畫面"></canvas>

<div class="hud">
  <div class="stat">
    <button class="chip smallbtn" id="menuBtn" type="button">≡ 選單</button>
    <span class="label">車體 <span id="hudHpNum">100</span></span>
    <div class="hp" id="hpBar" aria-label="車體血量"><i id="hudHp"></i></div>
    <span class="label s-only" id="hudLap">第 1 圈</span>
    <span class="label c-only">闖紅燈 <span id="hudViol">0</span> 次</span>
  </div>
  <div class="stat mid">
    <span class="val speed" id="hudSpeed">0</span>
    <span class="label">km/h</span>
    <span class="chip s-only" id="hudZone">海岸公路</span>
    <span class="row c-only" style="gap:6px">
      <span class="chip gearchip" id="hudGear">D</span>
      <span class="chip lightchip" id="hudLight" hidden><i></i><span>前方號誌</span></span>
    </span>
  </div>
  <div class="stat right">
    <span class="label">里程</span>
    <span class="val" id="hudDist">0.00<small>km</small></span>
    <button class="chip smallbtn" id="musicBtn" type="button">♪ 夕陽兜風</button>
    <canvas class="c-only" id="minimap" width="208" height="208" aria-label="小地圖"></canvas>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="pads">
  <div class="group">
    <button class="pad" data-key="left" type="button" aria-label="左轉"><svg viewBox="0 0 24 24"><path d="M15.5 3 6 12l9.5 9 2-2-7.4-7 7.4-7z"/></svg></button>
    <button class="pad" data-key="right" type="button" aria-label="右轉"><svg viewBox="0 0 24 24"><path d="M8.5 3 18 12l-9.5 9-2-2 7.4-7-7.4-7z"/></svg></button>
  </div>
  <div class="group">
    <button class="pad gear c-only" id="gearBtn" type="button" aria-label="切換檔位">D</button>
    <button class="pad brake" data-key="brake" type="button">煞車</button>
    <button class="pad gas" data-key="gas" type="button">油門</button>
  </div>
</div>

<div class="screen" id="startScreen">
  <div class="card">
    <p class="tag">LUXGEN U6 GT · DRIVE</p>
    <h1 class="logo">U6 開車趣</h1>
    <p class="how">開著你的<b>納智捷 U6 GT</b>，選一種玩法：</p>
    <div class="modes">
      <button class="mode" data-mode="city" type="button"><b>城市自由開</b><span>在城市裡隨便開。有紅綠燈、汽車和很多機車，可以切 R 檔倒車。闖紅燈會被記一次。</span></button>
      <button class="mode" data-mode="scenic" type="button"><b>慢遊公路</b><span>沿著海岸、櫻花、松林、花田和城市慢慢兜風，天色從黃昏變到夜晚。</span></button>
    </div>
    <p class="how" id="howKeys">左下 ◀ ▶ 轉彎，右下 <b>煞車</b>、<b>油門</b>。撞到東西會損血，撞越貴的車扣越多。</p>
    <p class="how" id="bestLine"></p>
  </div>
</div>

<div class="screen" id="overScreen" hidden>
  <div class="card">
    <p class="tag">END OF THE ROAD</p>
    <h1 class="logo" style="font-size:clamp(36px,11vw,60px)">車子撞壞了</h1>
    <div class="result">
      <div class="stat mid"><span class="label">這趟里程</span><span class="val" id="resDist">0</span></div>
      <div class="stat mid"><span class="label">最遠紀錄</span><span class="val" id="resBest">0</span></div>
    </div>
    <p class="how" id="resLine"></p>
    <p class="newbest" id="newBest" hidden>新紀錄！</p>
    <div class="row">
      <button class="btn" id="againBtn" type="button">再開一趟</button>
      <button class="btn ghost" id="backBtn" type="button">回主選單</button>
    </div>
  </div>
</div>

<div class="screen" id="musicPanel" hidden>
  <div class="card panel">
    <h2>選音樂</h2>
    <div class="tracks">
      <button class="trk" data-track="0" type="button"><b>夕陽兜風</b><span>放克流行，輕快的律動</span></button>
      <button class="trk" data-track="1" type="button"><b>糖果氣泡</b><span>甜甜的電子流行</span></button>
      <button class="trk" data-track="2" type="button"><b>首爾夜色</b><span>K-pop 嘻哈，酷酷的低音</span></button>
      <label class="trk" id="userTrk" for="songFile"><b>放我自己的歌</b><span id="userSub">從手機選音樂檔，可以一次選好幾首</span></label>
      <input class="vh" type="file" id="songFile" accept="audio/*,.mp3,.m4a,.aac,.wav" multiple>
      <button class="trk" id="musicOff" type="button"><b>關閉音樂</b></button>
    </div>
    <p class="note">內建三首是原創曲。手機裡有自己買或下載的音樂檔，可以用「放我自己的歌」播放。想聽 YouTube、Spotify 的歌，先在那邊播放，再回來開車就好。</p>
    <button class="chip smallbtn" id="engineToggle" type="button">引擎聲：開</button>
    <button class="btn" id="panelClose" type="button">繼續開車</button>
  </div>
</div>

<script>
/* ===================== shared: helpers, input, flow ===================== */
const $ = id => document.getElementById(id);
const Game = {
  mode: "menu", paused: false,
  keys: { left: false, right: false, brake: false, gas: false },
  coarse: matchMedia("(pointer: coarse)").matches
};
const limit = (v, a, b) => Math.max(a, Math.min(v, b));
const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const css = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function shade(hex, amt) {
  const [r, g, b] = hex2rgb(hex);
  const f = v => Math.round(limit(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt, 0, 255));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
let toastTimer = 0;
function showToast(str, ms = 900, bad = false) {
  const t = $("toast"); t.textContent = str; t.classList.toggle("dmg", bad); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}
const fmtKm = m => (m / 1000).toFixed(2) + "<small>km</small>";
function setHud(o) {
  if (o.hp !== undefined) {
    $("hudHp").style.transform = `scaleX(${o.hp / 100})`;
    $("hudHpNum").textContent = Math.ceil(o.hp);
    $("hpBar").classList.toggle("low", o.hp <= 30);
  }
  if (o.kmh !== undefined) $("hudSpeed").textContent = Math.round(o.kmh);
  if (o.meters !== undefined) $("hudDist").innerHTML = fmtKm(o.meters);
}

/* ===================== vehicles: rear-view drawings, shared by both modes ===================== */
const Veh = (() => {
  let ctx = null, U = 1;
  function rrect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }
  function poly2(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
  const mirror = pts => pts.map(p => [-p[0], p[1]]).reverse();
  function bodyGrad(c, top, bottom) {
    const g = ctx.createLinearGradient(0, top, 0, bottom);
    g.addColorStop(0, shade(c, 0.4)); g.addColorStop(0.3, c); g.addColorStop(0.75, shade(c, -0.18)); g.addColorStop(1, shade(c, -0.45));
    return g;
  }
  function glass(pts) {
    let top = 0, bot = -9; pts.forEach(p => { top = Math.min(top, p[1]); bot = Math.max(bot, p[1]); });
    const g = ctx.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, "#56627e"); g.addColorStop(0.45, "#1a2033"); g.addColorStop(1, "#090b14");
    ctx.fillStyle = g; poly2(pts); ctx.fill();
    ctx.save(); poly2(pts); ctx.clip();
    ctx.fillStyle = "rgba(255,255,255,0.13)"; poly2([[-0.1, top], [0.05, top], [-0.12, bot], [-0.27, bot]]); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.07)"; poly2([[0.1, top], [0.14, top], [-0.03, bot], [-0.07, bot]]); ctx.fill();
    ctx.restore();
  }
  function tire(x, w, h) {
    const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    g.addColorStop(0, "#040405"); g.addColorStop(0.5, "#2b2b31"); g.addColorStop(1, "#040405");
    ctx.fillStyle = g; rrect(x - w / 2, -h, w, h, 0.025); ctx.fill();
  }
  function chromeFill(top, bottom) {
    const g = ctx.createLinearGradient(0, top, 0, bottom);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.45, "#9aa0ab"); g.addColorStop(0.55, "#5d626c"); g.addColorStop(1, "#e3e6ec");
    return g;
  }
  function chromeRect(x, y, w, h) { ctx.fillStyle = chromeFill(y, y + h); ctx.fillRect(x, y, w, h); }
  function glow(x, y, r, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,40,60,${a})`); g.addColorStop(1, "rgba(255,40,60,0)");
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function lampFill(top, bottom, lit) {
    const g = ctx.createLinearGradient(0, top, 0, bottom);
    if (lit) { g.addColorStop(0, "#ffb3b3"); g.addColorStop(0.5, "#ff2438"); g.addColorStop(1, "#c00018"); }
    else { g.addColorStop(0, "#ff7a85"); g.addColorStop(0.5, "#d1102a"); g.addColorStop(1, "#7a0614"); }
    return g;
  }
  function lampRect(x, y, w, h, lit) {
    glow(x + w / 2, y + h / 2, Math.max(w, h) * (lit ? 1.6 : 0.9), lit ? 0.55 : 0.22);
    ctx.fillStyle = lampFill(y, y + h, lit); ctx.fillRect(x, y, w, h);
  }
  function lampPoly(pts, lit) {
    let cx = 0, cy = 0; pts.forEach(p => { cx += p[0]; cy += p[1]; }); cx /= pts.length; cy /= pts.length;
    glow(cx, cy, lit ? 0.22 : 0.13, lit ? 0.55 : 0.22);
    let top = 0, bot = -9; pts.forEach(p => { top = Math.min(top, p[1]); bot = Math.max(bot, p[1]); });
    ctx.fillStyle = lampFill(top, bot, lit); poly2(pts); ctx.fill();
  }
  function text(str, x, y, size, fill, weight = 700, spacing = 0) {
    if (U * size < 5) return;
    ctx.save(); ctx.scale(1 / U, 1 / U);
    ctx.font = `${weight} ${size * U}px "Quicksand", Arial, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = fill;
    if (spacing && "letterSpacing" in ctx) ctx.letterSpacing = `${spacing * U}px`;
    ctx.fillText(str, x * U, y * U);
    ctx.restore();
  }
  function plate(y, str, w = 0.22) {
    ctx.fillStyle = "#e9ecf2"; rrect(-w / 2, y - 0.035, w, 0.07, 0.01); ctx.fill();
    ctx.strokeStyle = "#20232b"; ctx.lineWidth = 0.006; ctx.stroke();
    text(str, 0, y + 0.002, 0.045, "#1b2340");
  }
  function exhaust(x, y, r) {
    ctx.fillStyle = chromeFill(y - r, y + r); ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();

    engFilter.frequency.setTargetAtTime(300 + sp * 600, t, 0.1);
    engGain.gain.setTargetAtTime(on && engineOn ? 0.03 + sp * 0.02 : 0, t, 0.1);
  }
  function blip(freq, dur, type = "sine", vol = 0.1) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(sfxBus); o.start(); o.stop(actx.currentTime + dur + 0.02);
  }
  function crash() {
    if (!actx) return;
    const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = 1800;
    s.buffer = noiseBuf; g.gain.setValueAtTime(0.5, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.4);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(); s.stop(actx.currentTime + 0.45);
  }

  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  const CHORD = { maj: [0, 4, 7], min: [0, 3, 7], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10] };
  const TRACKS = [
    { name: "夕陽兜風", bpm: 108, swing: 0.12, chords: [[53, "maj7"], [52, "m7"], [50, "m7"], [48, "maj7"]],
      k: "x..x..x...x.....", s: "....x.......x...", h: "x.x.x.x.x.x.x.xx",
      bass: [0, null, null, 0, null, null, 12, null, null, 0, null, 7, null, 10, 12, null], bassKind: "funk", bassLen: 1.6,
      leadWave: "square", A: [0, -1, -1, 1, -1, 2, -1, 1, -1, -1, 3, -1, 2, -1, 1, -1], B: [2, -1, 3, -1, 4, -1, -1, 3, -1, 2, -1, -1, 1, -1, 0, -1], padVol: 0.03 },
    { name: "糖果氣泡", bpm: 122, swing: 0, chords: [[55, "maj"], [50, "maj"], [52, "min"], [48, "maj"]],
      k: "x...x...x...x...", s: "....x.......x...", h: "..x...x...x...x.",
      bass: [null, null, 0, null, null, null, 0, null, null, null, 0, null, null, null, 0, 12], bassKind: "synth", bassLen: 1.5,
      leadWave: "triangle", A: [0, 2, 4, 2, 1, 3, 5, 3, 0, 2, 4, 2, 1, 3, 4, 3], B: [4, -1, 4, 3, -1, 2, -1, 3, 4, -1, 5, -1, 4, 3, 2, -1], padVol: 0.028 },
    { name: "首爾夜色", bpm: 92, swing: 0.05, chords: [[57, "min"], [53, "maj7"], [48, "maj"], [55, "maj"]],
      k: "x......x..x.....", s: "........x.......", h: "x.x.x.xxx.x.x.xx",
      bass: [0, null, null, null, null, null, null, 0, null, null, 0, null, null, null, null, null], bassKind: "808", bassLen: 5,
      leadWave: "sawtooth", A: [-1, -1, 2, -1, -1, 1, -1, 0, -1, -1, -1, -1, 1, -1, 2, -1], B: [3, -1, -1, 2, -1, -1, 1, -1, 2, -1, -1, -1, 0, -1, -1, -1], padVol: 0.024 }
  ];
  let musicMode = "synth", trackIdx = 0, seqTimer = null, nextTime = 0, stepN = 0;
  let userList = [], userIdx = 0, userSrc = null;
  function env2(g, t, vol, atk, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function kick(t) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    env2(g, t, 0.9, 0.003, 0.32); o.connect(g); g.connect(synthBus); o.start(t); o.stop(t + 0.35);
  }
  function noiseHit(t, type, freq, vol, dur) {
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    env2(g, t, vol, 0.002, dur); s.connect(f); f.connect(g); g.connect(synthBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function snare(t) {
    noiseHit(t, "highpass", 1200, 0.35, 0.17);
    const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle"; o.frequency.value = 190;
    env2(g, t, 0.18, 0.002, 0.1); o.connect(g); g.connect(synthBus); o.start(t); o.stop(t + 0.12);
  }
  function hat(t) { noiseHit(t, "highpass", 7500, 0.08, 0.04); }
  function bassNote(m, t, dur, kind) {
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    f.type = "lowpass";
    if (kind === "808") { o.type = "sine"; o.frequency.setValueAtTime(midi(m) * 1.06, t); o.frequency.exponentialRampToValueAtTime(midi(m), t + 0.08); f.frequency.value = 400; env2(g, t, 0.55, 0.005, dur); }
    else if (kind === "funk") { o.type = "square"; o.frequency.value = midi(m); f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(250, t + dur); env2(g, t, 0.22, 0.005, dur); }
    else { o.type = "sawtooth"; o.frequency.value = midi(m); f.frequency.value = 650; env2(g, t, 0.2, 0.005, dur); }
    o.connect(f); f.connect(g); g.connect(synthBus); o.start(t); o.stop(t + dur + 0.05);
  }
  function padChord(notes, t, dur, vol) {
    const f = actx.createBiquadFilter(), g = actx.createGain();
    f.type = "lowpass"; f.frequency.value = 1100;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.25); g.gain.setValueAtTime(vol, t + dur - 0.2); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    f.connect(g); g.connect(synthBus);
    for (const n of notes) for (const det of [-7, 7]) {
      const o = actx.createOscillator(); o.type = "sawtooth"; o.frequency.value = midi(n); o.detune.value = det;
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);
    }
  }
  function leadNote(m, t, dur, wave) {
    const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    o.type = wave; o.frequency.value = midi(m); f.type = "lowpass"; f.frequency.value = wave === "sawtooth" ? 1600 : 2800;
    env2(g, t, wave === "triangle" ? 0.16 : 0.07, 0.006, dur);
    o.connect(f); f.connect(g); g.connect(synthBus); g.connect(delay); o.start(t); o.stop(t + dur + 0.05);
  }
  function playStep(tr, n, t) {
    const spb = 60 / tr.bpm / 4, bar = Math.floor(n / 16) % 16, s = n % 16;
    const [root, q] = tr.chords[bar % 4], tones = CHORD[q];
    const intro = bar < 2;
    if (tr.k[s] === "x") kick(t);
    if (!intro && tr.s[s] === "x") snare(t);
    if (tr.h[s] === "x") hat(t);
    const b = tr.bass[s];
    if (b !== null && !(intro && s > 8)) bassNote(root - 12 + b, t, spb * tr.bassLen, tr.bassKind);
    if (s === 0) padChord(tones.map(x => root + x), t, spb * 16, tr.padVol);
    if (!intro) {
      const idx = (bar % 2 ? tr.B : tr.A)[s];
      if (idx >= 0) leadNote(root + 12 + (bar >= 10 ? 12 : 0) + tones[idx % tones.length] + 12 * Math.floor(idx / tones.length), t, spb * (tr.leadWave === "triangle" ? 0.9 : 1.6), tr.leadWave);
    }
  }
  function schedule() {
    if (!actx || musicMode !== "synth") return;
    const tr = TRACKS[trackIdx], spb = 60 / tr.bpm / 4;
    if (nextTime < actx.currentTime - 0.2) nextTime = actx.currentTime + 0.05;
    while (nextTime < actx.currentTime + 0.15) { playStep(tr, stepN, nextTime + (stepN % 2 ? tr.swing * spb : 0)); nextTime += spb; stepN++; }
  }
  function stopAll() {
    clearInterval(seqTimer); seqTimer = null;
    if (userSrc) { const s = userSrc; userSrc = null; try { s.stop(); } catch (e) {} }
  }
  function startSynth(i) {
    init(); if (!actx) return;
    stopAll(); musicMode = "synth"; trackIdx = i;
    nextTime = actx.currentTime + 0.1; stepN = 0;
    seqTimer = setInterval(schedule, 25); schedule();
    label();
  }
  async function playUser() {
    init(); if (!actx || !userList.length) return;
    stopAll(); musicMode = "user";
    const item = userList[userIdx];
    $("musicBtn").textContent = "♪ 載入中…";
    try {
      const buf = await actx.decodeAudioData(await item.file.arrayBuffer());
      if (musicMode !== "user" || userList[userIdx] !== item) return;
      const src = actx.createBufferSource(); src.buffer = buf; src.connect(userBus);
      src.onended = () => { if (userSrc === src && musicMode === "user") { userIdx = (userIdx + 1) % userList.length; playUser(); } };
      src.start(); userSrc = src; label();
    } catch (e) {
      $("musicBtn").textContent = "♪ 這首放不出來";
      if (userList.length > 1) { userIdx = (userIdx + 1) % userList.length; setTimeout(playUser, 800); }
    }
  }
  function label() {
    const btn = $("musicBtn");
    if (musicMode === "synth") btn.textContent = "♪ " + TRACKS[trackIdx].name;
    else if (musicMode === "user" && userList.length) btn.textContent = "♪ " + userList[userIdx].name;
    else btn.textContent = "♪ 音樂關閉";
    document.querySelectorAll(".trk[data-track]").forEach(b => b.classList.toggle("on", musicMode === "synth" && +b.dataset.track === trackIdx));
    $("userTrk").classList.toggle("on", musicMode === "user");
    $("musicOff").classList.toggle("on", musicMode === "off");
    $("userSub").textContent = userList.length ? `已選 ${userList.length} 首，點這裡可重選` : "從手機選音樂檔，可以一次選好幾首";
  }
  function ensureMusic() { init(); if (musicMode === "synth" && !seqTimer) startSynth(trackIdx); }

  const panel = $("musicPanel");
  $("musicBtn").addEventListener("click", () => { init(); label(); panel.hidden = false; Game.paused = true; });
  $("panelClose").addEventListener("click", () => { panel.hidden = true; Game.paused = false; });
  document.querySelectorAll(".trk[data-track]").forEach(b => b.addEventListener("click", () => startSynth(+b.dataset.track)));
  $("musicOff").addEventListener("click", () => { stopAll(); musicMode = "off"; label(); });
  $("engineToggle").addEventListener("click", () => { engineOn = !engineOn; $("engineToggle").textContent = "引擎聲：" + (engineOn ? "開" : "關"); });
  $("songFile").addEventListener("change", e => {
    const fs = [...e.target.files]; if (!fs.length) return;
    userList = fs.map(f => ({ file: f, name: f.name.replace(/\.[^.]+$/, "") })); userIdx = 0;
    playUser(); e.target.value = "";
  });
  return { init, engine, blip, crash, ensureMusic };
})();

    btn.addEventListener("pointerup", off);
    btn.addEventListener("pointercancel", off);
    btn.addEventListener("lostpointercapture", off);
    btn.addEventListener("contextmenu", e => e.preventDefault());
  });
  $("gearBtn").addEventListener("pointerdown", e => { e.preventDefault(); if (Game.onGear) Game.onGear(); });
  addEventListener("blur", () => Object.keys(Game.keys).forEach(k => (Game.keys[k] = false)));
  if (!Game.coarse) $("howKeys").innerHTML = "鍵盤：<b>← →</b> 轉彎、<b>↑</b> 油門、<b>↓</b> 煞車、<b>R</b> 切換倒車檔。撞到東西會損血，撞越貴的車扣越多。";

<script>
/* ===================== mode 1: scenic road (pseudo-3D) ===================== */
const Scenic = (() => {
  const STEP = 1 / 60;

  };
  const ZONE_ORDER = ["coast", "sakura", "forest", "flower", "city"];
  const DAMAGE = { post: 15, pine: 10, sakura: 10, palm: 10, sign: 10, building: 15 };
  const MODELS = Veh.MODELS;

  const canvas = $("scenic"), ctx = canvas.getContext("2d");
  let W = 0, H = 0, PAD = 24, UX = 1, UY = 1, HORIZON = 1, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);

  const interp = (a, b, p) => a + (b - a) * p;

  function overlap(x1, w1, x2, w2, pct) { const h = (pct || 1) / 2; return !((x1 + w1 * h) < (x2 - w2 * h) || (x1 - w1 * h) > (x2 + w2 * h)); }
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  function poly(x1, y1, x2, y2, x3, y3, x4, y4, c) {
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4); ctx.closePath(); ctx.fill();
  }

  // time of day
  const KEYS = [
    { t: 0.00, top: "#3d8ee0", mid: "#7fbcf0", hor: "#d6edf9", fog: "#cfe3ef", tint: [0, 0, 0, 0],        night: 0,   sunH: 0.9,  sun: "#fff6d0", far: "#93b3d2", near: "#6289ab", cloud: [255, 255, 255, 0.85] },
    { t: 0.22, top: "#4a7cc8", mid: "#e9b47c", hor: "#ffd59a", fog: "#f0c99c", tint: [255, 150, 60, 0.1],  night: 0,   sunH: 0.35, sun: "#ffd27a", far: "#b08ca2", near: "#7a6a8a", cloud: [255, 214, 180, 0.8] },
    { t: 0.34, top: "#2a1a5e", mid: "#c2406f", hor: "#ff7a59", fog: "#c46a74", tint: [120, 50, 110, 0.28], night: 0.3, sunH: 0.04, sun: "#ff8a4c", far: "#4a2a6e", near: "#2a1550", cloud: [255, 150, 160, 0.7] },
    { t: 0.45, top: "#0e0b2e", mid: "#3a2266", hor: "#8a3d6e", fog: "#4a2a5e", tint: [30, 20, 70, 0.5],    night: 0.8, sunH: -0.3, sun: "#ff6a4c", far: "#2a1a4a", near: "#1a1033", cloud: [110, 80, 140, 0.5] },
    { t: 0.56, top: "#03040f", mid: "#0b1030", hor: "#1c2450", fog: "#151b3a", tint: [8, 12, 40, 0.62],    night: 1,   sunH: -1,   sun: "#ff6a4c", far: "#121630", near: "#0a0c1f", cloud: [60, 70, 110, 0.45] },
    { t: 0.76, top: "#03040f", mid: "#0b1030", hor: "#1c2450", fog: "#151b3a", tint: [8, 12, 40, 0.62],    night: 1,   sunH: -1,   sun: "#ff6a4c", far: "#121630", near: "#0a0c1f", cloud: [60, 70, 110, 0.45] },
    { t: 0.88, top: "#283a78", mid: "#d98a9a", hor: "#ffd0a0", fog: "#d9aaa8", tint: [120, 90, 140, 0.22], night: 0.3, sunH: 0.03, sun: "#ffb27a", far: "#8a7aa8", near: "#5a5a80", cloud: [255, 200, 200, 0.75] },

  let dayT = 0.2;

  function computeEnv() {
    let i = 0; while (KEYS[i + 1].t <= dayT) i++;

    const mix = (x, y) => x.map((v, j) => v + (y[j] - v) * f);
    COLOR_KEYS.forEach(c => (env[c] = mix(a[c], b[c])));

  }

  // track
  let segments = [], trackLength = 0;
  const L = { SHORT: 25, MEDIUM: 50, LONG: 100 }, CURVE = { EASY: 2, MEDIUM: 4, HARD: 6 }, HILL = { NONE: 0, LOW: 20, MEDIUM: 40, HIGH: 60 };
  const lastY = () => segments.length ? segments[segments.length - 1].p2.world.y : 0;
  function addSegment(curve, y) {
    const n = segments.length;
    segments.push({ index: n, curve, sprites: [], cars: [], clip: 0, fog: 1,
      p1: { world: { y: lastY(), z: n * SEG }, camera: {}, screen: {} }, p2: { world: { y, z: (n + 1) * SEG }, camera: {}, screen: {} },
      alt: Math.floor(n / RUMBLE) % 2, start: false, zone: "coast" });
  }
  function addRoad(enter, hold, leave, curve, y) {
    const sy = lastY(), ey = sy + (y || 0) * SEG, total = enter + hold + leave;
    for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(sy, ey, n / total));
    for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(sy, ey, (enter + n) / total));
    for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(sy, ey, (enter + hold + n) / total));
  }
  const straight = (n = L.MEDIUM) => addRoad(n, n, n, 0, 0);
  const hill = (n = L.MEDIUM, h = HILL.MEDIUM) => addRoad(n, n, n, 0, h);
  const curve = (n = L.MEDIUM, c = CURVE.MEDIUM, h = HILL.NONE) => addRoad(n, n, n, c, h);
  function sCurves() {
    addRoad(L.MEDIUM, L.MEDIUM, L.MEDIUM, -CURVE.EASY, HILL.NONE); addRoad(L.MEDIUM, L.MEDIUM, L.MEDIUM, CURVE.MEDIUM, HILL.MEDIUM);
    addRoad(L.MEDIUM, L.MEDIUM, L.MEDIUM, CURVE.EASY, -HILL.LOW); addRoad(L.MEDIUM, L.MEDIUM, L.MEDIUM, -CURVE.EASY, HILL.MEDIUM);
    addRoad(L.MEDIUM, L.MEDIUM, L.MEDIUM, -CURVE.MEDIUM, -HILL.MEDIUM);
  }
  function rolling(h = HILL.LOW) {
    addRoad(L.SHORT, L.SHORT, L.SHORT, 0, h / 2); addRoad(L.SHORT, L.SHORT, L.SHORT, 0, -h); addRoad(L.SHORT, L.SHORT, L.SHORT, CURVE.EASY, h);
    addRoad(L.SHORT, L.SHORT, L.SHORT, 0, 0); addRoad(L.SHORT, L.SHORT, L.SHORT, -CURVE.EASY, h / 2); addRoad(L.SHORT, L.SHORT, L.SHORT, 0, 0);
  }
  function bumps() { [5, -2, -5, 8, 5, -7, 5, -2].forEach(h => addRoad(10, 10, 10, 0, h)); }

<script>

  // ---------- traffic ----------
  const SHIRTS = ["#2f6fd1", "#d14a3a", "#3aa35b", "#f2f2f2", "#222831", "#e0a42c", "#8a4fbf"];
  const HELMETS = ["#f4f4f4", "#e23b3b", "#222222", "#2b67c6", "#f2c94c", "#ff8fb1"];
  const BIKECOL = ["#e8e8ea", "#2b2f38", "#c8102e", "#5aa0e6", "#f2c94c", "#7fbf7f"];
  function segPoint(A, d, off, t) {

  }
  function spawn() {
    for (const v of vehicles) scene.remove(v.mesh);
    vehicles = [];
    let tries = 0;
    while (vehicles.length < NCARS + NBIKES && tries++ < 2000) {
      const bike = vehicles.length >= NCARS;
      const A = [Math.floor(rng() * N), Math.floor(rng() * N)];
      const d = [[1, 0], [-1, 0], [0, 1], [0, -1]][Math.floor(rng() * 4)];
      if (!inb(A[0] + d[0], A[1] + d[1])) continue;
      const t = 2 + rng() * (SEGLEN - 4), off = bike ? LANE_BIKE : LANE_CAR;
      const [x, z] = segPoint(A, d, off, t);
      if (Math.hypot(x - player.x, z - player.z) < 25) continue;
      if (vehicles.some(o => o.A[0] === A[0] && o.A[1] === A[1] && o.d[0] === d[0] && o.d[1] === d[1] && o.off === off && Math.abs(o.t - t) < 9)) continue;
      let o;
      if (bike) {
        const rider = { shirt: SHIRTS[Math.floor(rng() * SHIRTS.length)], helmet: HELMETS[Math.floor(rng() * HELMETS.length)] };
        o = { kind: "bike", name: "機車", dmg: 10, L: 1.9, W: 0.7, vmax: 8 + rng() * 4, mesh: bikeMesh(BIKECOL[Math.floor(rng() * BIKECOL.length)], rider) };
      } else {
        const key = Veh.pick(), m = Veh.MODELS[key];
        o = { kind: "car", name: m.cn, dmg: m.dmg, L: m.L, W: m.W, vmax: 9 + m.spd[0] * 6 + rng() * 3, mesh: carMesh(key, m.colors[Math.floor(rng() * m.colors.length)]) };
      }
      Object.assign(o, { A, d, t, off, v: o.vmax * 0.6, state: "road", crashT: 0, x, z, h: Math.atan2(d[0], d[1]), next: null });
      scene.add(o.mesh); vehicles.push(o);
    }
  }
  function chooseTurn(o) {
    const B = [o.A[0] + o.d[0], o.A[1] + o.d[1]], [dx, dz] = o.d;
    const opts = [[[dx, dz], 0.5], [[-dz, dx], 0.25], [[dz, -dx], 0.25]].filter(([nd]) => inb(B[0] + nd[0], B[1] + nd[1]));
    let r = rng() * opts.reduce((a, b) => a + b[1], 0);

  function updateVehicles(dt) {
    const lanes = {};
    for (const o of vehicles) if (o.state === "road") { const k = o.A + "|" + o.d + "|" + o.off; (lanes[k] = lanes[k] || []).push(o); }
    for (const k in lanes) lanes[k].sort((a, b) => a.t - b.t);
    for (const o of vehicles) {

      // keep back from the player
      const dpx = player.x - o.x, dpz = player.z - o.z, proj = dpx * fx + dpz * fz, lat = Math.abs(dpx * fz - dpz * fx);
      if (proj > 0 && proj < 20 && lat < o.W / 2 + P_HW + 0.5) allow = Math.min(allow, Math.sqrt(Math.max(0, 2 * 6 * (proj - o.L / 2 - P_HL - 1.5))));

        if (lead) allow = Math.min(allow, Math.sqrt(Math.max(0, 2 * 6 * (lead.t - o.t - (lead.L + o.L) / 2 - 1.8))));

  // ---------- collisions (separating axis on rectangles) ----------
  function corners(o) {
    const s = Math.sin(o.h), c = Math.cos(o.h);

      for (const [x, z] of cb) { const p = x * ax + z * az; b0 = Math.min(b0, p); b1 = Math.max(b1, p); }
      if (a1 < b0 || b1 < a0) return false;
    }

  }

  // ---------- player ----------
  function reset() {
    rs = 777;

    $("gearBtn").textContent = g; $("gearBtn").classList.toggle("r", g === "R");
    $("hudGear").textContent = g === "R" ? "R 倒車" : "D"; $("hudGear").classList.toggle("r", g === "R");
  }
  function damage(n, label) {
    if (player.invuln > 0 || player.over) return;
    player.hp = Math.max(0, player.hp - n); player.invuln = 1;
    GameAudio.crash(); showToast(`${label} -${n} 血`, 1100, true);

    if (player.hp <= 0) gameOver();

  function updatePlayer(dt) {

    const target = p.over ? 0 : (k.left ? 1 : 0) - (k.right ? 1 : 0);

    p.dist += Math.abs(p.v) * dt;
    p.invuln = Math.max(0, p.invuln - dt);

    const me = { x: p.x, z: p.z, h: p.h, hw: P_HW, hl: P_HL };
    const bi = Math.floor(p.x / S), bj = Math.floor(p.z / S);
    let blocked = null;
    for (let a = bi - 1; a <= bi + 1 && !blocked; a++) for (let b = bj - 1; b <= bj + 1 && !blocked; b++) {
      for (const ob of obstacles[a + "," + b] || []) if (hit(me, ob)) { blocked = ob; break; }
    }
    if (blocked) {
      const sp = Math.abs(p.v);
      p.x = ox; p.z = oz; p.h = oh; p.v = -p.v * 0.25;
      if (sp > 2.2) damage(Math.round(Math.min(20, 4 + sp * 1.1)), blocked.kind === "tree" ? "撞到樹" : "撞到大樓");
      else if (sp > 0.5) GameAudio.blip(120, 0.08, "square", 0.05);
    }
    for (const o of vehicles) {
      if (Math.abs(o.x - p.x) > 7 || Math.abs(o.z - p.z) > 7) continue;

        p.x = ox; p.z = oz; p.h = oh; p.v = -p.v * 0.2; o.crashT = 2.5; o.v = 0;
        if (rel > 1.2) damage(o.dmg, o.name); else GameAudio.blip(140, 0.08, "square", 0.05);

      }
    }
    // red light check when entering an intersection
    const ni = Math.round(p.x / S), nj = Math.round(p.z / S);
    const inside = inb(ni, nj) && Math.abs(p.x - ni * S) < RW && Math.abs(p.z - nj * S) < RW;
    if (inside && !p.inBox && p.v > 2 && !p.over) {
      const fx = Math.sin(p.h), fz = Math.cos(p.h), axis = Math.abs(fx) > Math.abs(fz) ? "EW" : "NS";
      const from = axis === "EW" ? [ni - Math.sign(fx), nj] : [ni, nj - Math.sign(fz)];
      if (inb(from[0], from[1]) && lightState(ni, nj, axis) === "R") {
        p.viol++; showToast("闖紅燈！", 1300, true); GameAudio.blip(880, 0.15, "square", 0.08); setTimeout(() => GameAudio.blip(660, 0.2, "square", 0.08), 160);
      }
    }
    p.inBox = inside;
    if (p.gear === "R" && p.v < -0.3) { beepT -= dt; if (beepT <= 0) { GameAudio.blip(1200, 0.12, "sine", 0.06); beepT = 0.7; } } else beepT = 0;
    pMesh.position.set(p.x, 0, p.z); pMesh.rotation.y = p.h;
    pMesh.visible = !(p.invuln > 0 && Math.floor(p.invuln * 12) % 2 === 0);
  }

  // ---------- HUD ----------
  const mm = $("minimap"), mg = mm.getContext("2d");
  function drawMinimap() {
    const sz = 208, pad = 14, sc = (sz - 2 * pad) / MAXC;
    mg.clearRect(0, 0, sz, sz);
    mg.strokeStyle = "rgba(255,255,255,0.4)"; mg.lineWidth = 6;
    for (let i = 0; i < N; i++) {
      mg.beginPath(); mg.moveTo(pad + i * S * sc, pad); mg.lineTo(pad + i * S * sc, sz - pad); mg.stroke();
      mg.beginPath(); mg.moveTo(pad, pad + i * S * sc); mg.lineTo(sz - pad, pad + i * S * sc); mg.stroke();
    }
    for (const o of vehicles) { mg.fillStyle = o.kind === "bike" ? "#ffcf6b" : "#9fb4ff"; mg.fillRect(pad + o.x * sc - 2, pad + o.z * sc - 2, 4, 4); }
    mg.save(); mg.translate(pad + player.x * sc, pad + player.z * sc); mg.rotate(-player.h + Math.PI);
    mg.fillStyle = "#7fe0c8"; mg.beginPath(); mg.moveTo(0, -10); mg.lineTo(7, 8); mg.lineTo(-7, 8); mg.closePath(); mg.fill();
    mg.restore();
  }
  function hud() {
    const p = player;
    setHud({ hp: p.hp, kmh: Math.abs(p.v) * 3.6, meters: p.dist });
    $("hudViol").textContent = p.viol;
    const fx = Math.sin(p.h), fz = Math.cos(p.h), axis = Math.abs(fx) > Math.abs(fz) ? "EW" : "NS";
    let ni, nj, dist;
    if (axis === "EW") { ni = fx > 0 ? Math.ceil((p.x + RW) / S) : Math.floor((p.x - RW) / S); nj = Math.round(p.z / S); dist = Math.abs(ni * S - p.x); }
    else { nj = fz > 0 ? Math.ceil((p.z + RW) / S) : Math.floor((p.z - RW) / S); ni = Math.round(p.x / S); dist = Math.abs(nj * S - p.z); }
    const chip = $("hudLight");
    if (inb(ni, nj) && dist < 60 && p.gear === "D") {
      const st = lightState(ni, nj, axis), col = st === "G" ? "#2ee07f" : st === "Y" ? "#ffc21a" : "#ff3b3b";
      chip.hidden = false; const dot = chip.querySelector("i"); dot.style.background = col; dot.style.color = col;
      chip.querySelector("span").textContent = `前方 ${Math.round(dist)}m`;
    } else chip.hidden = true;
    drawMinimap();
  }
  function updateLights() {
    const on = { R: 0xff2a2a, Y: 0xffc21a, G: 0x22e07a }, off = 0x2b2b2b, C = new THREE.Color();
    lightRefs.forEach((r, k) => {
      const st = lightState(r.i, r.j, r.axis);
      ["R", "Y", "G"].forEach((s, li) => lamps[li].setColorAt(k, C.set(st === s ? on[s] : off)));
    });
    lamps.forEach(l => (l.instanceColor.needsUpdate = true));
  }

  function resize() {
    if (!renderer) return;
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.fov = camera.aspect < 1 ? 70 : 58;
    camera.updateProjectionMatrix();
  }
  const tmpA = { v: null }, tmpB = { v: null };
  function loop(now) {
    if (!running) return;
    raf = requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!Game.paused) {
      simT += dt;
      updateVehicles(dt);
      updatePlayer(dt);
      lightTick -= dt; if (lightTick <= 0) { updateLights(); lightTick = 0.1; }
    }
    const p = player, fx = Math.sin(p.h), fz = Math.cos(p.h);
    const k = 1 - Math.exp(-dt * 5);
    if (!tmpA.v) { tmpA.v = new THREE.Vector3(); tmpB.v = new THREE.Vector3(); }
    camPos.lerp(tmpA.v.set(p.x - fx * 11.5, 4.4, p.z - fz * 11.5), k);
    camLook.lerp(tmpB.v.set(p.x + fx * 4, 1.2, p.z + fz * 4), k);
    camera.position.copy(camPos); camera.lookAt(camLook);
    sky.position.copy(camPos);
    renderer.render(scene, camera);
    hud();
    GameAudio.engine(Math.abs(p.v) / VFWD, Game.keys.gas, !p.over && !Game.paused);
  }
  async function start() {
    showToast("城市載入中…", 4000);
    try { await load(); } catch (e) { showToast("城市載入失敗，請確認網路後再試", 2500, true); Flow.menu(); return; }
    if (Game.mode !== "city") return;
    if (!built) build();
    reset(); resize(); updateLights();
    running = true; last = performance.now();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
    showToast(Game.coarse ? "踩油門出發，右下 D/R 切倒車" : "↑ 出發，R 鍵切倒車", 2200);
  }
  function stop() { running = false; cancelAnimationFrame(raf); }
  function gameOver() {
    player.over = true;
    const m = player.dist, isBest = m > best;
    if (isBest) { best = m; try { localStorage.setItem("city-best", String(m)); } catch (e) {} }
    Flow.over({ meters: m, best, isBest, line: `闖紅燈 ${player.viol} 次` });
  }
  Game.onGear = () => { if (Game.mode === "city" && player && !player.over) { setGear(player.gear === "D" ? "R" : "D"); GameAudio.blip(500, 0.06, "square", 0.05); } };
  window.__city = { player: () => player, setTime: t => (simT = t) };
  return { start, stop };
})();
</script>

<script>
/* ===================== flow between screens ===================== */
const Flow = (() => {
  function show(id) { ["startScreen", "overScreen"].forEach(s => ($(s).hidden = s !== id)); }
  function play(mode) {
    GameAudio.init(); GameAudio.ensureMusic();
    Game.mode = mode; document.body.dataset.mode = mode; Game.paused = false;
    show(null);
    if (mode === "city") City.start(); else { City.stop(); Scenic.start(); }
  }
  function menu() {
    City.stop(); Scenic.toMenu();
    Game.mode = "menu"; document.body.dataset.mode = "menu";
    const b = Scenic.best();
    $("bestLine").innerHTML = b > 0 ? `慢遊公路最遠：<b>${(b / 1000).toFixed(2)} km</b>` : "";
    show("startScreen");
  }
  function over(o) {
    $("resDist").innerHTML = fmtKm(o.meters); $("resBest").innerHTML = fmtKm(o.best);
    $("resLine").textContent = o.line; $("newBest").hidden = !o.isBest;
    setTimeout(() => { if (Game.mode !== "menu") { show("overScreen"); $("againBtn").focus(); } }, 900);
    GameAudio.blip(220, 0.6, "triangle", 0.12);
  }
  document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => play(b.dataset.mode)));
  $("againBtn").addEventListener("click", () => play(Game.mode));
  $("backBtn").addEventListener("click", menu);
  $("menuBtn").addEventListener("click", menu);
  menu();
  return { play, menu, over };
})();
</script>

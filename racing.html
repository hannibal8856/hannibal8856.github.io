<style>
/* Layout: one full-screen canvas, HUD pinned top, touch pads pinned bottom. Single dark neon-sunset look by choice. */
:root {
  --night: #140a33;
  --haze: #5b2a6e;
  --ink: #f4f1ff;
  --pink: #ff3d7f;
  --sun: #ffd166;
  --teal: #3ee6c8;
  --glass: rgba(20, 10, 51, 0.62);
  --f-display: "Chakra Petch", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px;
  pointer-events: none;
}
.stat { display: grid; gap: 2px; }
.stat.right { justify-items: end; text-align: right; }
.stat.mid { justify-items: center; text-align: center; }
.label { font-size: 11px; letter-spacing: 0.14em; opacity: 0.75; }
.val {
  font-family: var(--f-display); font-weight: 700; font-style: italic;
  font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums;
  text-shadow: 0 0 12px rgba(255, 61, 127, 0.7);
}
.val small { font-size: 13px; font-style: normal; opacity: 0.8; margin-left: 3px; }
.val.speed { font-size: 40px; color: var(--sun); text-shadow: 0 0 14px rgba(255, 209, 102, 0.6); }
.val.low { color: var(--pink); animation: pulse 0.5s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: 0.45; } }
.nitro { width: 92px; height: 7px; border-radius: 4px; background: rgba(244, 241, 255, 0.18); overflow: hidden; margin-top: 4px; }
.nitro i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--teal), var(--ink)); transform-origin: left; }
.hp { width: 110px; height: 9px; border-radius: 5px; background: rgba(244, 241, 255, 0.18); overflow: hidden; margin-top: 2px; }
.hp i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--pink), var(--sun)); transform-origin: left; transition: transform 0.2s; }
.hp.low i { background: var(--pink); animation: pulse 0.4s ease-in-out infinite alternate; }
.toast.dmg { color: var(--pink); }
.mute {
  pointer-events: auto; margin-top: 6px;
  font: 600 12px var(--f-body); color: var(--ink);
  background: var(--glass); border: 1px solid rgba(244, 241, 255, 0.25);
  border-radius: 999px; padding: 4px 10px;
}

.toast {
  position: fixed; left: 0; right: 0; top: 28%;
  text-align: center; font-family: var(--f-display); font-weight: 700; font-style: italic;
  font-size: clamp(28px, 8vw, 56px); color: var(--sun);
  text-shadow: 0 0 20px rgba(255, 61, 127, 0.9);
  pointer-events: none; opacity: 0; transition: opacity 0.25s;
}
.toast.show { opacity: 1; }

.pads {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  pointer-events: none;
}
.group { display: flex; gap: 12px; }
.pad {
  pointer-events: auto; touch-action: none;
  width: 76px; height: 76px; border-radius: 50%;
  background: var(--glass); color: var(--ink);
  border: 2px solid rgba(244, 241, 255, 0.35);
  font: 700 15px var(--f-body); letter-spacing: 0.06em;
  display: grid; place-items: center;
  -webkit-tap-highlight-color: transparent;
}
.pad svg { width: 30px; height: 30px; fill: currentColor; }
.pad.brake { border-color: rgba(255, 61, 127, 0.7); }
.pad.boost { border-color: rgba(62, 230, 200, 0.8); color: var(--teal); }
.pad.on { background: rgba(255, 61, 127, 0.45); transform: scale(0.94); }
.pad.boost.on { background: rgba(62, 230, 200, 0.4); }
.pad:focus-visible, .btn:focus-visible, .mute:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
@media (pointer: fine) { .pads { display: none; } }

.screen {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at 50% 40%, rgba(20, 10, 51, 0.35), rgba(20, 10, 51, 0.82));
}
.card { max-width: 420px; width: 100%; display: grid; gap: 14px; justify-items: center; text-align: center; }
.logo {
  font-family: var(--f-display); font-weight: 700; font-style: italic;
  font-size: clamp(46px, 14vw, 84px); line-height: 0.95; margin: 0;
  background: linear-gradient(180deg, var(--sun) 15%, var(--pink) 85%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(255, 61, 127, 0.55));
  text-wrap: balance;
}
.tag { font-family: var(--f-display); letter-spacing: 0.4em; font-size: 12px; color: var(--teal); margin: 0; }
.how { margin: 0; font-size: 14px; line-height: 1.7; opacity: 0.88; }
.how b { color: var(--sun); font-weight: 700; }
.btn {
  font: 700 20px var(--f-display); letter-spacing: 0.12em; color: var(--night);
  background: linear-gradient(180deg, var(--sun), var(--pink));
  border: 0; border-radius: 12px; padding: 14px 40px; margin-top: 6px;
  box-shadow: 0 0 24px rgba(255, 61, 127, 0.55);
}
.btn:active { transform: scale(0.97); }
.result { display: flex; gap: 28px; justify-content: center; }
.result .val { font-size: 34px; }
.newbest { color: var(--teal); font-weight: 700; letter-spacing: 0.1em; }
@media (prefers-reduced-motion: reduce) { .val.low { animation: none; } .toast { transition: none; } }
</style>

<div class="screen" id="startScreen">
  <div class="card">
    <p class="tag">NEON NIGHT RUN</p>
    <h1 class="logo">霓虹狂飆</h1>
    <p class="how">車子會<b>自動加速</b>。閃過車流、別衝出跑道。<br>撞到車子或路燈會<b>損血</b>，血條歸零就爆車。<br>每跑完一圈加 <b>25 秒</b>、補 <b>20 血</b>，時間歸零也結束。<br>
      <span id="howKeys">手機：按左右鍵轉彎，右下角是煞車和氮氣。</span></p>

</div>

<div class="screen" id="overScreen" hidden>
  <div class="card">
    <p class="tag" id="overTag">TIME UP</p>
    <h1 class="logo" style="font-size:clamp(40px,12vw,68px)" id="overTitle">時間到！</h1>

      <div class="stat mid"><span class="label">這次距離</span><span class="val" id="resDist">0</span></div>

    </div>

    <p class="newbest" id="newBest" hidden>新紀錄！</p>
    <button class="btn" id="againBtn" type="button">再跑一次</button>
  </div>
</div>

<script>
(() => {
  // ---------- constants ----------
  const STEP = 1 / 60;
  const SEG = 200;              // segment length
  const RUMBLE = 3;
  const ROADW = 2000;           // half road width in world units
  const LANES = 3;
  const CAMH = 1000;
  const CAMDEPTH = 1 / Math.tan((100 / 2) * Math.PI / 180);
  const DRAW = 280;
  const FOGD = 5;
  const PLAYERZ = CAMH * CAMDEPTH;
  const MAXS = SEG / STEP;      // 12000
  const ACCEL = MAXS / 5, BRAKE = -MAXS, DECEL = -MAXS / 5;
  const OFFDECEL = -MAXS / 2, OFFLIMIT = MAXS / 4;
  const CENTRIFUGAL = 0.3;
  const CARW = 0.36;            // car width in half-road units
  const BOOSTMAX = MAXS * 1.35;
  const START_TIME = 50, LAP_BONUS = 25, NUM_CARS = 46;
  const MAX_HP = 100, LAP_HEAL = 20, INVULN = 1.0;
  const DAMAGE = { car: 20, post: 15, tree: 10, sign: 10 };
  const UNIT_M = 66.67 / MAXS;  // 12000 units/s = 240 km/h

  const COL = {
    light: { road: "#38334f", grass: "#103d3c", rumble: "#ff3d7f", lane: "#f4f1ff" },
    dark:  { road: "#322d48", grass: "#0c3332", rumble: "#f4f1ff", lane: null },
    start: { road: "#f4f1ff", grass: "#103d3c", rumble: "#f4f1ff", lane: null },
    fog: "#5b2a6e"
  };
  const CAR_COLORS = ["#ffd166", "#3ee6c8", "#7aa2ff", "#ff8a3d", "#b07bff", "#e8e8f0", "#57d977"];

  // ---------- canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, PAD = 24, UX = 1, UY = 1, HORIZON = 1;
  const coarse = matchMedia("(pointer: coarse)").matches;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    PAD = coarse ? Math.min(150, H * 0.2) : 24;
    UX = (W / 2) * (W < H ? 0.68 : 1);
    UY = (H - PAD) / 2;
    HORIZON = (H - PAD) / 2;
  }
  addEventListener("resize", resize);
  resize();

  // ---------- helpers ----------
  const limit = (v, a, b) => Math.max(a, Math.min(v, b));
  const accelerate = (v, a, dt) => v + a * dt;
  const interp = (a, b, p) => a + (b - a) * p;
  const easeIn = (a, b, p) => a + (b - a) * Math.pow(p, 2);
  const easeInOut = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);
  const fogAt = (d, dens) => 1 / Math.pow(Math.E, d * d * dens);
  function increase(start, inc, max) {
    let r = start + inc;
    while (r >= max) r -= max;
    while (r < 0) r += max;
    return r;
  }
  function overlap(x1, w1, x2, w2, pct) {
    const h = (pct || 1) / 2;
    return !((x1 + w1 * h) < (x2 - w2 * h) || (x1 - w1 * h) > (x2 + w2 * h));
  }
  // deterministic random for scenery
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  // ---------- track ----------
  let segments = [], trackLength = 0;
  const L = { SHORT: 25, MEDIUM: 50, LONG: 100 };
  const CURVE = { EASY: 2, MEDIUM: 4, HARD: 6 };
  const HILL = { NONE: 0, LOW: 20, MEDIUM: 40, HIGH: 60 };
  const lastY = () => segments.length ? segments[segments.length - 1].p2.world.y : 0;
  function addSegment(curve, y) {
    const n = segments.length;
    segments.push({
      index: n,
      p1: { world: { y: lastY(), z: n * SEG }, camera: {}, screen: {} },
      p2: { world: { y: y, z: (n + 1) * SEG }, camera: {}, screen: {} },
      curve, sprites: [], cars: [], clip: 0,
      color: Math.floor(n / RUMBLE) % 2 ? COL.dark : COL.light
    });
  }
  function addRoad(enter, hold, leave, curve, y) {
    const sy = lastY(), ey = sy + (y || 0) * SEG, total = enter + hold + leave;
    for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(sy, ey, n / total));
    for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(sy, ey, (enter + n) / total));
    for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(sy, ey, (enter + hold + n) / total));
  }
  const straight = (n = L.MEDIUM) => addRoad(n, n, n, 0, 0);
  const hill = (n = L.MEDIUM, h = HILL.MEDIUM) => addRoad(n, n, n, 0, h);
  const curve = (n = L.MEDIUM, c = CURVE.MEDIUM, h = HILL.NONE) => addRoad(n, n, n, c, h);
  function sCurves() {
    addRoad(L.MEDIUM, L.MEDIUM, L.MEDIUM, -CURVE.EASY, HILL.NONE);
    addRoad(L.MEDIUM, L.MEDIUM, L.MEDIUM, CURVE.MEDIUM, HILL.MEDIUM);
    addRoad(L.MEDIUM, L.MEDIUM, L.MEDIUM, CURVE.EASY, -HILL.LOW);
    addRoad(L.MEDIUM, L.MEDIUM, L.MEDIUM, -CURVE.EASY, HILL.MEDIUM);
    addRoad(L.MEDIUM, L.MEDIUM, L.MEDIUM, -CURVE.MEDIUM, -HILL.MEDIUM);
  }
  function rolling(h = HILL.LOW) {
    addRoad(L.SHORT, L.SHORT, L.SHORT, 0, h / 2);
    addRoad(L.SHORT, L.SHORT, L.SHORT, 0, -h);
    addRoad(L.SHORT, L.SHORT, L.SHORT, CURVE.EASY, h);
    addRoad(L.SHORT, L.SHORT, L.SHORT, 0, 0);
    addRoad(L.SHORT, L.SHORT, L.SHORT, -CURVE.EASY, h / 2);
    addRoad(L.SHORT, L.SHORT, L.SHORT, 0, 0);
  }
  function bumps() {
    [5, -2, -5, 8, 5, -7, 5, -2].forEach(h => addRoad(10, 10, 10, 0, h));
  }
  function buildTrack() {
    segments = [];
    straight(L.SHORT);
    rolling();
    curve(L.MEDIUM, CURVE.MEDIUM, HILL.LOW);
    bumps();
    curve(L.LONG, -CURVE.MEDIUM, HILL.MEDIUM);
    straight();
    sCurves();
    curve(L.LONG, CURVE.HARD, HILL.HIGH);
    hill(L.MEDIUM, HILL.HIGH);
    curve(L.LONG, -CURVE.MEDIUM, HILL.NONE);
    bumps();
    curve(L.LONG, CURVE.MEDIUM, -HILL.LOW);
    hill(L.LONG, -HILL.MEDIUM);
    sCurves();
    addRoad(200, 200, 200, -CURVE.EASY, -lastY() / SEG);
    trackLength = segments.length * SEG;
    for (let i = 0; i < RUMBLE * 2; i++) segments[i + 6].color = COL.start;

    // scenery
    seed = 7;
    const add = (n, type, offset) => { if (segments[n]) segments[n].sprites.push({ type, offset }); };
    for (let n = 20; n < segments.length; n += 3 + Math.floor(rnd() * 4)) {
      const side = rnd() < 0.5 ? -1 : 1;
      add(n, "tree", side * (1.5 + rnd() * 3));
      if (rnd() < 0.5) add(n, "tree", -side * (1.6 + rnd() * 4));
    }
    for (let n = 10; n < segments.length; n += 20) { add(n, "post", -1.25); add(n, "post", 1.25); }
    const signs = ["夜路狂飆", "注意彎道", "全速前進", "霓虹城 5km", "小心超車"];
    for (let n = 120, k = 0; n < segments.length; n += 160, k++) {
      segments[n].sprites.push({ type: "sign", offset: (k % 2 ? 1 : -1) * 1.9, text: signs[k % signs.length] });
    }
  }

  const findSegment = z => segments[Math.floor(z / SEG) % segments.length];

  // ---------- traffic ----------
  let cars = [];
  function resetCars() {
    cars = [];
    segments.forEach(s => (s.cars = []));
    const lanesX = [-2 / 3, 0, 2 / 3];
    for (let i = 0; i < NUM_CARS; i++) {
      const z = (40 + Math.floor(Math.random() * (segments.length - 60))) * SEG;
      const car = {
        offset: lanesX[Math.floor(Math.random() * 3)] + (Math.random() - 0.5) * 0.12,
        z, percent: 0,
        speed: MAXS * (0.22 + Math.random() * 0.33),
        color: CAR_COLORS[i % CAR_COLORS.length]
      };
      findSegment(z).cars.push(car);
      cars.push(car);
    }
  }

  // ---------- state ----------
  let position = 0, playerX = 0, speed = 0, nitro = 1, timeLeft = START_TIME, hp = MAX_HP, invuln = 0, overReason = "time";
  let lap = 1, dist = 0, state = "menu", countdown = 0, skyOffset = 0, shake = 0, steerVis = 0;
  const keys = { left: false, right: false, brake: false, boost: false };
  let best = 0;
  try { best = Number(localStorage.getItem("neon-run-best")) || 0; } catch (e) {}

  // ---------- audio ----------
  let actx = null, engOsc, engOsc2, engGain, engFilter, muted = false;
  function initAudio() {
    if (actx) { actx.resume && actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      engFilter = actx.createBiquadFilter(); engFilter.type = "lowpass"; engFilter.frequency.value = 700;
      engGain = actx.createGain(); engGain.gain.value = 0;
      engOsc = actx.createOscillator(); engOsc.type = "sawtooth"; engOsc.frequency.value = 50;
      engOsc2 = actx.createOscillator(); engOsc2.type = "square"; engOsc2.frequency.value = 25;
      const g2 = actx.createGain(); g2.gain.value = 0.4;
      engOsc.connect(engFilter); engOsc2.connect(g2); g2.connect(engFilter);
      engFilter.connect(engGain); engGain.connect(actx.destination);
      engOsc.start(); engOsc2.start();
    } catch (e) { actx = null; }
  }
  function engineSound() {
    if (!actx) return;
    const sp = speed / MAXS, t = actx.currentTime;
    const on = state === "play" && !muted;
    engOsc.frequency.setTargetAtTime(48 + sp * 130 + (keys.boost && nitro > 0 ? 25 : 0), t, 0.05);
    engOsc2.frequency.setTargetAtTime(24 + sp * 65, t, 0.05);
    engFilter.frequency.setTargetAtTime(500 + sp * 1400, t, 0.1);
    engGain.gain.setTargetAtTime(on ? 0.045 + sp * 0.03 : 0, t, 0.08);
  }
  function blip(freq, dur, type = "square", vol = 0.08) {
    if (!actx || muted) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }
  function crashSound() {
    if (!actx || muted) return;
    const len = actx.sampleRate * 0.35, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = actx.createBufferSource(), g = actx.createGain();
    g.gain.value = 0.35; s.buffer = buf; s.connect(g); g.connect(actx.destination); s.start();
  }

  // ---------- update ----------
  function crash(newSpeed, what) {
    speed = newSpeed;
    if (invuln > 0) return;
    const d = DAMAGE[what] || 10;
    hp = Math.max(0, hp - d); invuln = INVULN; shake = 0.45; crashSound();
    showToast(`-${d} 血`, 600); $("toast").classList.add("dmg");
    if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
    if (hp <= 0) { overReason = "wreck"; gameOver(); }
  }
  function update(dt) {
    for (const car of cars) {
      const old = findSegment(car.z);
      car.z = increase(car.z, dt * car.speed, trackLength);
      car.percent = (car.z % SEG) / SEG;
      const ns = findSegment(car.z);
      if (old !== ns) { old.cars.splice(old.cars.indexOf(car), 1); ns.cars.push(car); }
    }
    if (state === "countdown") {
      const before = Math.ceil(countdown);
      countdown -= dt;
      const after = Math.ceil(countdown);
      if (after !== before) {
        if (after > 0) { showToast(String(after)); blip(440, 0.18); }
        else { showToast("出發！", 700); blip(880, 0.35); state = "play"; }
      }
      return;
    }
    if (state !== "play") { if (state === "over") speed = Math.max(0, speed + DECEL * 2 * dt); position = increase(position, dt * speed, trackLength); return; }

    const playerSeg = findSegment(position + PLAYERZ);
    const sp = speed / MAXS;
    const dx = dt * 2 * Math.min(sp, 1);
    const oldPos = position;
    position = increase(position, dt * speed, trackLength);
    dist += dt * speed;
    if (position < oldPos) {
      lap++; timeLeft += LAP_BONUS; hp = Math.min(MAX_HP, hp + LAP_HEAL);
      showToast(`第 ${lap} 圈！+${LAP_BONUS} 秒 +${LAP_HEAL} 血`, 1600); blip(660, 0.15); setTimeout(() => blip(990, 0.25), 140);
    }

    if (keys.left) playerX -= dx; else if (keys.right) playerX += dx;
    steerVis += ((keys.left ? -1 : keys.right ? 1 : 0) - steerVis) * Math.min(1, dt * 10);
    playerX -= dx * Math.min(sp, 1.2) * playerSeg.curve * CENTRIFUGAL;

    const boosting = keys.boost && nitro > 0.02 && !keys.brake;
    if (boosting) { nitro = Math.max(0, nitro - dt * 0.33); speed = accelerate(speed, ACCEL * 1.6, dt); }
    else {
      nitro = Math.min(1, nitro + dt * 0.07);
      if (keys.brake) speed = accelerate(speed, BRAKE, dt);
      else if (speed < MAXS) speed = accelerate(speed, ACCEL, dt);
      else speed = accelerate(speed, DECEL, dt);
    }

    if ((playerX < -1 || playerX > 1)) {
      if (speed > OFFLIMIT) speed = accelerate(speed, OFFDECEL, dt);
      for (const s of playerSeg.sprites) {
        const sw = s.type === "tree" ? 0.7 : s.type === "sign" ? 1.0 : 0.12;
        if (overlap(playerX, CARW, s.offset, sw, 1)) {
          crash(MAXS / 6, s.type);
          position = increase(playerSeg.p1.world.z, -PLAYERZ, trackLength);
          break;
        }
      }
    }
    for (const car of playerSeg.cars) {
      if (speed > car.speed && overlap(playerX, CARW, car.offset, CARW, 0.85)) {
        crash(car.speed * (car.speed / speed), "car");
        position = increase(car.z, -PLAYERZ, trackLength);
        break;
      }
    }

    playerX = limit(playerX, -2.6, 2.6);
    speed = limit(speed, 0, boosting ? BOOSTMAX : Math.max(MAXS, speed));
    skyOffset += playerSeg.curve * sp * dt * 0.02;
    shake = Math.max(0, shake - dt);
    invuln = Math.max(0, invuln - dt);
    if (state !== "play") return;

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; overReason = "time"; gameOver(); }
  }

  // ---------- render ----------
  function project(p, camX, camY, camZ) {
    p.camera.x = 0 - camX;
    p.camera.y = (p.world.y || 0) - camY;
    p.camera.z = (p.world.z || 0) - camZ;
    p.screen.scale = CAMDEPTH / p.camera.z;
    p.screen.x = W / 2 + p.screen.scale * p.camera.x * UX;
    p.screen.y = HORIZON - p.screen.scale * p.camera.y * UY;
    p.screen.w = p.screen.scale * ROADW * UX;
  }
  function poly(x1, y1, x2, y2, x3, y3, x4, y4, c) {
    ctx.fillStyle = c; ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
    ctx.closePath(); ctx.fill();
  }
  function drawSegment(x1, y1, w1, x2, y2, w2, fog, c) {
    const r1 = w1 / 6, r2 = w2 / 6, l1 = w1 / 32, l2 = w2 / 32;
    ctx.fillStyle = c.grass; ctx.fillRect(0, y2, W, y1 - y2 + 1);
    poly(x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, c.rumble);
    poly(x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, c.rumble);
    poly(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, c.road);
    if (c.lane) {
      const lw1 = w1 * 2 / LANES, lw2 = w2 * 2 / LANES;
      let lx1 = x1 - w1 + lw1, lx2 = x2 - w2 + lw2;
      for (let i = 1; i < LANES; i++, lx1 += lw1, lx2 += lw2)
        poly(lx1 - l1 / 2, y1, lx1 + l1 / 2, y1, lx2 + l2 / 2, y2, lx2 - l2 / 2, y2, c.lane);
    }
    if (fog < 1) {
      ctx.globalAlpha = 1 - fog; ctx.fillStyle = COL.fog;
      ctx.fillRect(0, y2, W, y1 - y2 + 1); ctx.globalAlpha = 1;
    }
  }

  // mountain profiles
  const ridgeA = [], ridgeB = [];
  { let s = 3; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = 0; i < 48; i++) { ridgeA.push(0.3 + r() * 0.7); ridgeB.push(0.2 + r() * 0.8); } }
  function drawRidge(ridge, off, height, color) {
    const span = Math.max(W, 600) * 2, step = span / ridge.length;
    let x0 = -((off * span) % span); if (x0 > 0) x0 -= span;
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x0, HORIZON + 2);
    for (let rep = 0; rep < 3; rep++)
      for (let i = 0; i <= ridge.length; i++) {
        const x = x0 + rep * span + i * step;
        ctx.lineTo(x, HORIZON - ridge[i % ridge.length] * height);
      }
    ctx.lineTo(x0 + 3 * span, HORIZON + 2); ctx.closePath(); ctx.fill();
  }
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
    g.addColorStop(0, "#140a33"); g.addColorStop(0.55, "#4a1a6b"); g.addColorStop(0.9, "#c2406f"); g.addColorStop(1, "#ff7a59");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, HORIZON + 2);
    // stars
    ctx.fillStyle = "rgba(244,241,255,0.7)";
    for (let i = 0; i < 40; i++) {
      const sx = ((i * 97.3 + skyOffset * 200 * W) % W + W) % W, sy = (i * 53.7) % (HORIZON * 0.5);
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
    // sun
    const sr = Math.min(W, H) * 0.2, sx = W / 2, sy = HORIZON - sr * 0.35;
    const sg = ctx.createLinearGradient(0, sy - sr, 0, sy + sr);
    sg.addColorStop(0, "#ffd166"); sg.addColorStop(1, "#ff3d7f");
    ctx.save(); ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = sg; ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    ctx.fillStyle = "#c2406f";
    for (let i = 0; i < 6; i++) { const yy = sy + i * sr * 0.16, hh = 2 + i * 1.6; ctx.fillRect(sx - sr, yy, sr * 2, hh); }
    ctx.restore();
    ctx.shadowColor = "#ff3d7f"; ctx.shadowBlur = 0;
    drawRidge(ridgeB, skyOffset * 0.5, H * 0.13, "#2a1550");
    drawRidge(ridgeA, skyOffset, H * 0.08, "#1b0d3a");
    ctx.fillStyle = COL.fog; ctx.fillRect(0, HORIZON, W, H - HORIZON);
  }

  function rrect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }
  function drawCar(cx, by, w, color, steer, lit, flame) {
    if (w < 2) return;
    const h = w * 0.6;
    ctx.save(); ctx.translate(cx, by); ctx.rotate(steer * 0.05);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath(); ctx.ellipse(0, -h * 0.02, w * 0.58, h * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0b0716";
    ctx.fillRect(-w * 0.5, -h * 0.3, w * 0.2, h * 0.3); ctx.fillRect(w * 0.3, -h * 0.3, w * 0.2, h * 0.3);
    // cabin
    ctx.fillStyle = shade(color, -0.35);
    ctx.beginPath(); ctx.moveTo(-w * 0.4, -h * 0.6); ctx.lineTo(-w * 0.3, -h); ctx.lineTo(w * 0.3, -h); ctx.lineTo(w * 0.4, -h * 0.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#1c2440";
    ctx.beginPath(); ctx.moveTo(-w * 0.33, -h * 0.64); ctx.lineTo(-w * 0.26, -h * 0.93); ctx.lineTo(w * 0.26, -h * 0.93); ctx.lineTo(w * 0.33, -h * 0.64); ctx.closePath(); ctx.fill();
    // body
    ctx.fillStyle = color; rrect(-w * 0.5, -h * 0.66, w, h * 0.46, Math.max(1, w * 0.06)); ctx.fill();
    ctx.fillStyle = shade(color, -0.2); ctx.fillRect(-w * 0.5, -h * 0.32, w, h * 0.1);
    // lights
    ctx.fillStyle = lit ? "#ff2e4d" : "#a3122b";
    if (lit && w > 30) { ctx.shadowColor = "#ff2e4d"; ctx.shadowBlur = w * 0.15; }
    ctx.fillRect(-w * 0.45, -h * 0.56, w * 0.22, h * 0.1); ctx.fillRect(w * 0.23, -h * 0.56, w * 0.22, h * 0.1);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#f4f1ff"; ctx.fillRect(-w * 0.1, -h * 0.5, w * 0.2, h * 0.09);
    if (flame) {
      const f = 0.6 + Math.random() * 0.6;
      ctx.fillStyle = "#3ee6c8"; ctx.beginPath();
      ctx.moveTo(-w * 0.32, -h * 0.24); ctx.lineTo(-w * 0.22, -h * 0.24); ctx.lineTo(-w * 0.27, h * 0.28 * f); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(w * 0.22, -h * 0.24); ctx.lineTo(w * 0.32, -h * 0.24); ctx.lineTo(w * 0.27, h * 0.28 * f); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = v => Math.round(limit(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt, 0, 255));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function drawSprite(s, x, y, unit) {
    if (s.type === "tree") {
      const w = unit * 0.8, h = unit * 1.5;
      if (w < 1) return;
      ctx.fillStyle = "#2a1b2e"; ctx.fillRect(x - w * 0.07, y - h * 0.25, w * 0.14, h * 0.25);
      const greens = ["#0f5b4f", "#137a62", "#1aa07a"];
      for (let i = 0; i < 3; i++) {
        const ty = y - h * 0.2 - i * h * 0.25, tw = w * (1 - i * 0.22);
        ctx.fillStyle = greens[i]; ctx.beginPath();
        ctx.moveTo(x - tw / 2, ty); ctx.lineTo(x + tw / 2, ty); ctx.lineTo(x, ty - h * 0.42); ctx.closePath(); ctx.fill();
      }
    } else if (s.type === "post") {
      const h = unit * 1.6, w = Math.max(1, unit * 0.05);
      ctx.fillStyle = "#4a3d66"; ctx.fillRect(x - w / 2, y - h, w, h);
      const dir = s.offset < 0 ? 1 : -1;
      ctx.fillRect(dir > 0 ? x : x - unit * 0.25, y - h, unit * 0.25, w);
      ctx.fillStyle = "#ffd166";
      if (unit > 40) { ctx.shadowColor = "#ffd166"; ctx.shadowBlur = unit * 0.2; }
      ctx.fillRect(x + dir * unit * 0.22 - unit * 0.05, y - h, unit * 0.1, unit * 0.05);
      ctx.shadowBlur = 0;
    } else if (s.type === "sign") {
      const w = unit * 1.3, h = unit * 0.55, top = y - unit * 1.2;
      if (w < 2) return;
      ctx.fillStyle = "#2a1550";
      ctx.fillRect(x - w * 0.35, top + h, w * 0.05, unit * 1.2 - h); ctx.fillRect(x + w * 0.3, top + h, w * 0.05, unit * 1.2 - h);
      ctx.fillStyle = "#1b0d3a"; ctx.fillRect(x - w / 2, top, w, h);
      ctx.strokeStyle = "#ff3d7f"; ctx.lineWidth = Math.max(1, w * 0.03); ctx.strokeRect(x - w / 2, top, w, h);
      if (w > 40) {
        ctx.fillStyle = "#ffd166"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = `700 ${Math.round(h * 0.42)}px "Chakra Petch","PingFang TC","Noto Sans TC",sans-serif`;
        ctx.fillText(s.text, x, top + h / 2, w * 0.9);
      }
    }
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * shake, (Math.random() - 0.5) * 10 * shake);
    drawSky();

    const base = findSegment(position);
    const basePct = (position % SEG) / SEG;
    const playerSeg = findSegment(position + PLAYERZ);
    const playerPct = ((position + PLAYERZ) % SEG) / SEG;
    const playerY = interp(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);
    let maxy = H + 40, x = 0, dx = -(base.curve * basePct);

    for (let n = 0; n < DRAW; n++) {
      const seg = segments[(base.index + n) % segments.length];
      const looped = seg.index < base.index;
      const fog = fogAt(n / DRAW, FOGD);
      seg.clip = maxy;
      seg.fog = fog;
      const camZ = position - (looped ? trackLength : 0);
      project(seg.p1, playerX * ROADW - x, playerY + CAMH, camZ);
      project(seg.p2, playerX * ROADW - x - dx, playerY + CAMH, camZ);
      x += dx; dx += seg.curve;
      if (seg.p1.camera.z <= CAMDEPTH || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
      drawSegment(seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w, seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w, fog, seg.color);
      maxy = seg.p1.screen.y;
    }

    for (let n = DRAW - 1; n > 0; n--) {
      const seg = segments[(base.index + n) % segments.length];
      if (seg.p1.camera.z <= CAMDEPTH) continue;
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, seg.clip); ctx.clip();
      ctx.globalAlpha = Math.max(0.25, seg.fog);
      for (const s of seg.sprites) {
        const sc = seg.p1.screen.scale;
        const unit = sc * ROADW * UX;
        drawSprite(s, seg.p1.screen.x + unit * s.offset, seg.p1.screen.y, unit);
      }
      for (const car of seg.cars) {
        const sc = interp(seg.p1.screen.scale, seg.p2.screen.scale, car.percent);
        const unit = sc * ROADW * UX;
        const cx = interp(seg.p1.screen.x, seg.p2.screen.x, car.percent) + unit * car.offset;
        const cy = interp(seg.p1.screen.y, seg.p2.screen.y, car.percent);
        drawCar(cx, cy, unit * CARW, car.color, 0, true, false);
      }
      ctx.restore();
    }

    // player
    const unitP = (1 / CAMH) * ROADW * UX;
    const off = playerX < -1 || playerX > 1;
    const bounce = (off ? 4 : 1.2) * (speed / MAXS) * (Math.random() - 0.5) * 2;
    const boosting = state === "play" && keys.boost && nitro > 0.02 && !keys.brake;
    const pw = unitP * CARW;
    if (hp < 40 && (state === "play" || state === "over")) {
      const dens = hp <= 0 ? 10 : 5;
      for (let i = 0; i < dens; i++) {
        const t = (performance.now() / 600 + i / dens) % 1;
        ctx.fillStyle = hp <= 0 ? `rgba(30,20,40,${0.6 * (1 - t)})` : `rgba(160,150,180,${0.4 * (1 - t)})`;
        ctx.beginPath();
        ctx.arc(W / 2 + Math.sin(i * 2.3 + t * 3) * pw * 0.2, H - PAD - pw * 0.55 - t * pw * 0.9, pw * (0.08 + t * 0.18), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    const blinkOff = invuln > 0 && Math.floor(invuln * 12) % 2 === 0;
    if (!blinkOff) drawCar(W / 2, H - PAD + bounce, pw, hp <= 0 ? "#5a3a55" : "#ff3d7f", steerVis, keys.brake && state === "play", boosting);

    if (boosting) {
      ctx.strokeStyle = "rgba(244,241,255,0.35)"; ctx.lineWidth = 2;
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2, r1 = Math.min(W, H) * (0.35 + Math.random() * 0.2), r2 = r1 + 40 + Math.random() * 60;
        ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * r1, HORIZON + Math.sin(a) * r1);
        ctx.lineTo(W / 2 + Math.cos(a) * r2, HORIZON + Math.sin(a) * r2); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---------- HUD ----------
  const $ = id => document.getElementById(id);
  const hudHp = $("hudHp"), hudHpNum = $("hudHpNum"), hpBar = $("hpBar"), hudTime = $("hudTime"), hudSpeed = $("hudSpeed"), hudDist = $("hudDist"), hudLap = $("hudLap"), hudNitro = $("hudNitro");
  let toastTimer = 0;
  function showToast(text, ms = 800) {
    const t = $("toast"); t.textContent = text; t.classList.remove("dmg"); t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
  }
  const fmtDist = m => m >= 1000 ? (m / 1000).toFixed(2) + "<small>km</small>" : Math.floor(m) + "<small>m</small>";
  function hud() {
    hudTime.innerHTML = Math.ceil(timeLeft) + "<small>秒</small>";
    hudTime.classList.toggle("low", state === "play" && timeLeft < 10);
    hudSpeed.textContent = Math.round(speed / MAXS * 240);
    hudDist.innerHTML = fmtDist(dist * UNIT_M);
    hudLap.textContent = `第 ${lap} 圈`;
    hudNitro.style.transform = `scaleX(${nitro})`;
    hudHp.style.transform = `scaleX(${hp / MAX_HP})`;
    hudHpNum.textContent = Math.ceil(hp);
    hpBar.classList.toggle("low", hp <= 30);
  }
  function showBest() {
    $("bestLine").innerHTML = best > 0 ? `最佳紀錄：<b>${(best / 1000).toFixed(2)} km</b>` : "";
  }
  showBest();
  $("howKeys").textContent = coarse
    ? "手機：按左右鍵轉彎，右下角是煞車和氮氣。"
    : "鍵盤：← → 轉彎、↓ 煞車、空白鍵 氮氣。";

  // ---------- flow ----------
  function startGame() {
    initAudio();
    position = 0; playerX = 0; speed = 0; nitro = 1; timeLeft = START_TIME; hp = MAX_HP; invuln = 0; overReason = "time"; lap = 1; dist = 0; shake = 0;
    resetCars();
    $("startScreen").hidden = true; $("overScreen").hidden = true;
    state = "countdown"; countdown = 3.0001;
    showToast("3"); blip(440, 0.18);
  }
  function gameOver() {
    state = "over";
    const m = dist * UNIT_M;
    const isBest = m > best;
    if (isBest) { best = m; try { localStorage.setItem("neon-run-best", String(m)); } catch (e) {} }
    $("resDist").innerHTML = fmtDist(m);
    $("resBest").innerHTML = fmtDist(best);
    $("resLaps").textContent = `跑完 ${lap - 1} 圈`;
    $("overTag").textContent = overReason === "wreck" ? "WRECKED" : "TIME UP";
    $("overTitle").textContent = overReason === "wreck" ? "車子撞爛了！" : "時間到！";
    $("newBest").hidden = !isBest;
    setTimeout(() => { $("overScreen").hidden = false; $("againBtn").focus(); }, 700);
    blip(220, 0.5, "sawtooth", 0.06);
  }
  $("startBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", startGame);
  $("mute").addEventListener("click", () => {
    muted = !muted; $("mute").textContent = muted ? "音效 關" : "音效 開"; initAudio();
  });

  // ---------- input ----------
  const keyMap = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowDown: "brake", KeyS: "brake", Space: "boost", ShiftLeft: "boost", ShiftRight: "boost" };
  addEventListener("keydown", e => {
    const k = keyMap[e.code];
    if (k) { keys[k] = true; e.preventDefault(); }
    if ((e.code === "Enter" || e.code === "Space") && state === "menu") startGame();
  });
  addEventListener("keyup", e => { const k = keyMap[e.code]; if (k) keys[k] = false; });
  document.querySelectorAll(".pad").forEach(btn => {
    const k = btn.dataset.key;
    const on = e => { e.preventDefault(); keys[k] = true; btn.classList.add("on"); try { btn.setPointerCapture(e.pointerId); } catch (_) {} };
    const off = () => { keys[k] = false; btn.classList.remove("on"); };
    btn.addEventListener("pointerdown", on);
    btn.addEventListener("pointerup", off);
    btn.addEventListener("pointercancel", off);
    btn.addEventListener("lostpointercapture", off);
    btn.addEventListener("contextmenu", e => e.preventDefault());
  });
  addEventListener("blur", () => Object.keys(keys).forEach(k => (keys[k] = false)));

  // ---------- loop ----------
  buildTrack();
  resetCars();
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(0.25, (now - last) / 1000); last = now;
    while (acc > STEP) { update(STEP); acc -= STEP; }
    render(); hud(); engineSound();
    requestAnimationFrame(frame);
  }
  // idle attract mode on the menu: roll forward slowly
  speed = MAXS * 0.45;
  requestAnimationFrame(frame);
})();
</script>

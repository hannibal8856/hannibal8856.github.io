<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hannibal 游戏厅</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
:root {
  --bg: #12202c; --fg: #eef3f6; --muted: #93a8b6; --card: #1b2d3c; --line: #ffffff1a; --glow: #ffd23f;
  --num: "Bungee", "Arial Black", system-ui, sans-serif;
  --ui: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color-scheme: dark;
}
body {
  margin: 0; min-height: 100vh; background: radial-gradient(120% 60% at 50% 0%, #1d3343, var(--bg) 70%); color: var(--fg);
  font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px;
  box-sizing: border-box;
}
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1 { margin: 0; font: 400 2rem var(--num); }
h1 span { color: var(--glow); }
p.lead { margin: 0; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 12px; }
a.game {
  display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 14px; text-decoration: none; color: inherit;
  background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); transition: transform .15s, box-shadow .15s;
}
a.game:hover, a.game:focus-visible { transform: translateY(-2px); box-shadow: inset 0 0 0 2px var(--glow); outline: none; }
.icon { flex: 0 0 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font: 400 1.1rem var(--num); color: #fff; }
.g2048 { background: #2a6e5d; color: #f3e7c9; }
.guno { background: #e0303f; }
.gflip { background: linear-gradient(135deg, #2370d6 50%, #7d43c8 50%); }
.game h2 { margin: 0 0 4px; font-size: 1.1rem; }
.game p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.4; }
.game div:last-child { min-width: 0; }
</style>
<main>
  <div>
    <h1>游戏<span>厅</span></h1>
    <p class="lead">点一个开始玩，手机和电脑都可以。</p>
  </div>
  <div class="list">
    <a class="game" href="flip.html">
      <div class="icon gflip">⇅</div>
      <div><h2>最后一张 翻转版</h2><p>UNO Flip 规则。双面牌，打出翻面牌整桌翻转，和 3 个电脑对手比谁先出完。</p></div>
    </a>
    <a class="game" href="uno.html">
      <div class="icon guno">+2</div>
      <div><h2>最后一张</h2><p>经典 UNO 规则。跳过、反转、+2、变色牌，记得喊“最后一张”。</p></div>
    </a>
    <a class="game" href="2048.html">
      <div class="icon g2048">2048</div>
      <div><h2>青瓷 2048</h2><p>滑动合并相同的数字，拼出 2048。可以撤销，会记住最高分。</p></div>
    </a>
  </div>
</main>
</html>

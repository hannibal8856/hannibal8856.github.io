@media (prefers-reduced-motion: reduce) { .slot.pick .card { animation: none; } .queue { scroll-behavior: auto; } }

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

// ---------- data ----------
const FAMS = [
  { n: '赤獅家', c: '#b23a32' }, { n: '蒼鷹家', c: '#2f5d9e' }, { n: '翠鹿家', c: '#2f7d4f' },
  { n: '紫鴉家', c: '#74489c' }, { n: '金狼家', c: '#b5841c' },
];
const T = {
  soldier:    { n: '士兵', ic: '⚔️', k: 'char', d: '消滅相鄰的一張牌。' },
  archer:     { n: '弓箭手', ic: '🏹', k: 'char', d: '消滅佇列最前面或最後面的一張牌。' },
  spy:        { n: '間諜', ic: '🕵️', k: 'char', d: '從一位有牌和間諜相鄰的對手那裡偷 1 點影響力。' },
  heir:       { n: '繼承人', ic: '👑', k: 'char', d: '佇列裡沒有其他翻開的繼承人時，得 2 點影響力。' },
  lord:       { n: '勛爵', ic: '🏰', k: 'char', d: '得 1 點影響力，每有一張相鄰的自家牌再多 1 點。' },
  shift:      { n: '變形者', ic: '🎭', k: 'char', d: '複製一張相鄰、已翻開的角色牌的能力。' },
  assassin:   { n: '刺殺', ic: '🗡️', k: 'plan', d: '消滅佇列中任何一張牌，然後棄掉。' },
  decree:     { n: '皇家法令', ic: '📜', k: 'plan', d: '把佇列中任一張牌移到任何位置，然後棄掉。' },
  ambush:     { n: '伏擊', ic: '🪤', k: 'plan', d: '被對手的牌消滅時：改成消滅攻擊它的牌，你得 4 點。自己翻開：得 1 點，棄掉。' },
  conspiracy: { n: '陰謀', ic: '🐍', k: 'plan', d: '翻開時拿走牌上影響力的兩倍，然後棄掉。' },
};
const KINDS = Object.keys(T);
const ROUNDS = 6;

// ---------- state ----------
let S = null, gid = 0, SPEED = 1, cid = 0;
let ui = { sel: null, decreeCard: null, showLog: false };
const cfg = { n: +(store.get('fc-n') || 4), name: store.get('fc-name') || '我', fam: +(store.get('fc-fam') || 0) };
const P = i => S.players[i];
const top = sl => sl[sl.length - 1];
const tops = () => S.queue.map(top);
const slotOf = c => S.queue.findIndex(sl => sl.includes(c));
const topIdx = c => S.queue.findIndex(sl => top(sl) === c);
const byId = id => { for (const sl of S.queue) for (const c of sl) if (c.id === id) return c; return null; };
const me = () => Math.max(0, S.players.findIndex(p => p.human));
const cname = c => T[c.t].n;
const who = c => P(c.owner).name;
const rint = n => Math.floor(Math.random() * n);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rint(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function log(s) { S.log.push(s); if (S.log.length > 200) S.log.shift(); }
function toast(s) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = s; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function nap(ms) { const g = gid; return new Promise((res, rej) => setTimeout(() => g === gid ? res() : rej('stop'), ms * SPEED)); }
function ask(pr) { const g = gid; return new Promise((res, rej) => { S.prompt = pr; S.resolve = v => { if (g !== gid) return rej('stop'); res(v); }; ui.sel = null; render(); }); }
function answer(v) { const r = S.resolve; if (!r) return; S.prompt = null; S.resolve = null; render(); r(v); }

// ---------- setup ----------
function newGame(allBots) {
  gid++;
  const fams = [cfg.fam, ...shuffle([0, 1, 2, 3, 4].filter(f => f !== cfg.fam))].slice(0, cfg.n);
  const players = fams.map((f, i) => {
    const deck = shuffle(KINDS.map(t => ({ id: ++cid, t, owner: i, up: false, inf: 0 })));
    const hu = i === 0 && !allBots;
    return { name: hu ? cfg.name : FAMS[f].n.replace('家', '') + '（電腦）', fam: f, human: hu, hand: deck.slice(3), out: deck.slice(0, 3), inf: 1 };
  });
  S = { players, queue: [], round: 1, start: rint(cfg.n), phase: 'place', log: [], prompt: null, resolve: null, cur: null, over: false };
  log(`遊戲開始。每人隨機蓋掉 3 張牌，拿 1 點影響力。${P(S.start).name} 先開始。`);
  ui = { sel: null, decreeCard: null, showLog: ui.showLog };
  run().catch(e => { if (e !== 'stop') { console.error(e); throw e; } });
}

async function run() {
  for (S.round = 1; S.round <= ROUNDS; S.round++) {
    S.phase = 'place'; log(`── 第 ${S.round} 輪：放置 ──`); render();
    for (let k = 0; k < S.players.length; k++) {
      const i = (S.start + k) % S.players.length, p = P(i);
      S.turn = i; render();
      const mv = p.human ? await ask({ type: 'place' }) : (await nap(650), botPlace(i));
      doPlace(i, mv); render();
    }
    S.turn = null; S.phase = 'resolve'; log(`── 第 ${S.round} 輪：執行 ──`); render(); await nap(600);
    await resolution();
    S.start = (S.start + 1) % S.players.length;
  }
  S.phase = 'end'; S.over = true; S.cur = null;
  const rank = S.players.map((p, i) => ({ i, inf: p.inf, left: S.queue.reduce((a, sl) => a + sl.filter(c => c.owner === i).length, 0) }))
    .sort((a, b) => b.inf - a.inf || b.left - a.left);
  S.rank = rank;
  log(`遊戲結束！${P(rank[0].i).name} 以 ${rank[0].inf} 點影響力獲勝。`);
  render();
}

function doPlace(i, mv) {
  const p = P(i), k = p.hand.findIndex(c => c.id === mv.id), c = p.hand.splice(k, 1)[0];
  c.up = false; c.inf = 0;
  if (mv.where === 'L') S.queue.unshift([c]);
  else if (mv.where === 'R') S.queue.push([c]);
  else S.queue[mv.where].push(c);
  const where = mv.where === 'L' ? '最左端' : mv.where === 'R' ? '最右端' : '自己的一張牌上面';
  log(`${p.name} 蓋一張牌放在${where}。`);
}

// ---------- resolution ----------
async function resolution() {
  for (const sl of S.queue) for (const c of sl) c.done = false;
  let pos = 0;
  while (true) {
    let i = -1;
    for (let j = pos; j < S.queue.length; j++) if (!top(S.queue[j]).done) { i = j; break; }
    if (i < 0) break;
    const c = top(S.queue[i]); c.done = true; S.cur = c.id; render();
    const mySl = S.queue[i], rightSl = S.queue[i + 1];
    await resolveCard(c);
    // continue right after this card; a card uncovered under it waits until next round
    if (S.queue.includes(mySl)) pos = S.queue.indexOf(mySl) + 1;
    else if (rightSl && S.queue.includes(rightSl)) pos = S.queue.indexOf(rightSl);
    else pos = S.queue.length;
    S.cur = null; render(); await nap(450);
  }
  S.cur = null;
}

async function resolveCard(c) {
  const p = P(c.owner);
  if (!c.up) {
    const rev = p.human ? await ask({ type: 'reveal', id: c.id }) : (await nap(500), botReveal(c));
    if (!rev) { c.inf++; log(`${p.name} 不翻開，牌上累積到 ${c.inf} 點影響力。`); render(); return; }
    c.up = true;
    let gain = c.inf; if (c.t === 'conspiracy') gain *= 2;
    p.inf += gain; c.inf = 0;
    log(`${p.name} 翻開【${cname(c)}】${gain ? `，拿走 ${gain} 點影響力${c.t === 'conspiracy' ? '（陰謀加倍）' : ''}` : ''}。`);
    render(); await nap(550);
  } else {
    log(`${p.name} 的【${cname(c)}】再次發動。`);
  }
  await ability(c.t, c);
  if (T[c.t].k === 'plan' && slotOf(c) >= 0) { removeCard(c); log(`【${cname(c)}】用完棄掉。`); }
  render();
}

function removeCard(c) {
  const i = slotOf(c); if (i < 0) return;
  const sl = S.queue[i]; sl.splice(sl.indexOf(c), 1);
  if (!sl.length) S.queue.splice(i, 1);
  c.inf = 0;
}

async function eliminate(t, actor) {
  const ap = P(actor.owner), tp = P(t.owner);
  if (t.t === 'ambush' && t.owner !== actor.owner) {
    t.up = true; render(); await nap(400);
    tp.inf += 4; tp.usedAmbush = true;
    log(`💥 ${ap.name} 攻擊到 ${tp.name} 的【伏擊】！${tp.name} 得 4 點影響力，${ap.name} 的【${cname(actor)}】被消滅。`);
    removeCard(t);
    if (slotOf(actor) >= 0) removeCard(actor);
    if (tp.human && !ap.human) toast(`你的伏擊生效！+4 影響力`);
    if (ap.human) toast('踩到伏擊了！');
    render(); return;
  }
  const wasUp = t.up; t.up = true;
  removeCard(t); ap.inf += 1;
  log(`${ap.name} 消滅了 ${tp.name} 的${wasUp ? '' : '蓋牌'}【${cname(t)}】，得 1 點影響力。`);
  render();
}

// ability of type `type`, performed from the position of card `actor`
async function ability(type, actor) {
  const o = actor.owner, p = P(o), i = topIdx(actor);
  const adj = () => { const k = topIdx(actor); return [S.queue[k - 1], S.queue[k + 1]].filter(Boolean).map(top); };
  switch (type) {
    case 'soldier': {
      const opts = adj(); if (!opts.length) { log('旁邊沒有牌可以消滅。'); return; }
      const t = await chooseCard(o, opts, `【${T[actor.t].n}】${type !== actor.t ? '（複製士兵）' : ''}：消滅相鄰的一張牌`, 'kill');
      if (t) await eliminate(t, actor); else log(`${p.name} 選擇不消滅。`);
      return;
    }
    case 'archer': {
      const q = tops(); const opts = [...new Set([q[0], q[q.length - 1]])].filter(c => c && c !== actor);
      if (!opts.length) { log('兩端沒有可以射的牌。'); return; }
      const t = await chooseCard(o, opts, `【${T[actor.t].n}】${type !== actor.t ? '（複製弓箭手）' : ''}：消滅最前面或最後面的牌`, 'kill');
      if (t) await eliminate(t, actor); else log(`${p.name} 選擇不射擊。`);
      return;
    }
    case 'spy': {
      const opts = adj().filter(c => c.owner !== o && P(c.owner).inf > 0);
      if (!opts.length) { log('間諜旁邊沒有可以偷的對手。'); return; }
      const t = await chooseCard(o, opts, '【間諜】：選一張相鄰的對手牌，從那位玩家偷 1 點影響力', 'spy');
      if (t) { P(t.owner).inf -= 1; p.inf += 1; log(`${p.name} 從 ${P(t.owner).name} 偷走 1 點影響力。`); }
      return;
    }
    case 'heir': {
      const other = tops().some(c => c !== actor && c.up && c.t === 'heir');
      if (other) { log('佇列裡已經有其他翻開的繼承人，沒有得分。'); return; }
      p.inf += 2; log(`${p.name} 的繼承人得 2 點影響力。`); return;
    }
    case 'lord': {
      const n = 1 + adj().filter(c => c.owner === o).length;
      p.inf += n; log(`${p.name} 的勛爵得 ${n} 點影響力。`); return;
    }
    case 'shift': {
      const opts = adj().filter(c => c.up && T[c.t].k === 'char' && c.t !== 'shift');
      if (!opts.length) { log('變形者旁邊沒有翻開的角色可以複製。'); return; }
      const t = await chooseCard(o, opts, '【變形者】：選一張相鄰、翻開的角色，複製它的能力', 'copy');
      if (t) { log(`${p.name} 的變形者複製【${cname(t)}】。`); render(); await ability(t.t, actor); }
      return;
    }
    case 'assassin': {
      const opts = tops().filter(c => c !== actor); if (!opts.length) return;
      const t = await chooseCard(o, opts, '【刺殺】：消滅佇列中任何一張牌', 'kill');
      if (t) await eliminate(t, actor); else log(`${p.name} 放棄刺殺。`);
      return;
    }
    case 'decree': {
      const opts = tops().filter(c => c !== actor); if (!opts.length) return;
      let mv;
      if (p.human) {
        const t = await chooseCard(o, opts, '【皇家法令】：選一張要移動的牌（連同疊在下面的牌）', 'move');
        if (!t) { log(`${p.name} 沒有移動任何牌。`); return; }
        ui.decreeCard = t.id;
        const gap = await ask({ type: 'gap', id: t.id });
        ui.decreeCard = null; mv = { t, gap };
      } else mv = botDecree(o, actor);
      if (!mv) { log(`${p.name} 沒有移動任何牌。`); return; }
      const from = slotOf(mv.t), sl = S.queue.splice(from, 1)[0];
      let g = mv.gap; if (g > from) g--;
      S.queue.splice(g, 0, sl);
      log(`${p.name} 用皇家法令移動了 ${who(mv.t)} 的${mv.t.up ? '【' + cname(mv.t) + '】' : '蓋牌'}。`);
      return;
    }
    case 'ambush': p.inf += 1; p.usedAmbush = true; log(`${p.name} 自己翻開伏擊，得 1 點影響力。`); return;
    case 'conspiracy': return;
  }
}

async function chooseCard(o, opts, title, mode) {
  if (P(o).human) { const id = await ask({ type: 'target', opts: opts.map(c => c.id), title, mode }); return id == null ? null : byId(id); }
  await nap(500);
  return botPick(o, opts, mode);
}

// ---------- bots (only see face-up cards of others) ----------
function leader(o) { let best = -1, bi = -1; S.players.forEach((p, i) => { if (i !== o && p.inf > best) { best = p.inf; bi = i; } }); return bi; }
function killValue(o, c) {
  if (c.owner === o) return -6 + (c.up ? 0 : -2);
  let v;
  if (c.up) v = { soldier: 5, archer: 5, spy: 3.5, lord: 3, heir: 3, shift: 3.5 }[c.t] || 2;
  else v = 2.2 + c.inf * 0.9 - 6 * ambushRisk(c);
  if (c.owner === leader(o)) v += 1;
  return v;
}
function ambushRisk(c) {
  // the opponent's ambush is still unseen if it is not face-up anywhere and not in the discard history
  const seen = S.queue.some(sl => sl.some(x => x.owner === c.owner && x.t === 'ambush' && x.up)) || (P(c.owner).usedAmbush);
  if (seen) return 0;
  const hidden = S.queue.reduce((a, sl) => a + sl.filter(x => x.owner === c.owner && !x.up).length, 0) + P(c.owner).hand.length;
  return hidden ? Math.min(0.45, 0.7 / hidden) : 0;
}
function botPick(o, opts, mode) {
  if (mode === 'kill') { let best = null, bv = 0.8; for (const c of opts) { const v = killValue(o, c) + Math.random() * 0.6; if (v > bv) { bv = v; best = c; } } return best; }
  if (mode === 'spy') return opts.slice().sort((a, b) => P(b.owner).inf - P(a.owner).inf)[0];
  if (mode === 'copy') { const pref = { soldier: 3, archer: 3, heir: 2, lord: 2, spy: 1 }; return opts.slice().sort((a, b) => (pref[b.t] || 0) - (pref[a.t] || 0))[0]; }
  return opts[0];
}
function botDecree(o, actor) {
  // move a dangerous opponent card next to one of our revealed soldiers, else push an opponent card to an end for our archer
  const q = tops();
  const mySoldier = q.findIndex(c => c.owner === o && c.up && c.t === 'soldier');
  const targets = q.filter(c => c !== actor && c.owner !== o).sort((a, b) => killValue(o, b) - killValue(o, a));
  if (!targets.length) return null;
  const t = targets[0];
  if (mySoldier >= 0) return { t, gap: mySoldier + 1 };
  if (q.some(c => c.owner === o && c.up && c.t === 'archer')) return { t, gap: 0 };
  return Math.random() < 0.5 ? { t, gap: S.queue.length } : null;
}
function botReveal(c) {
  const o = c.owner, last = S.round === ROUNDS;
  if (last) return true;
  const k = topIdx(c), q = tops(), adj = [q[k - 1], q[k + 1]].filter(Boolean);
  const r = Math.random();
  switch (c.t) {
    case 'soldier': return adj.some(x => killValue(o, x) > 1.6) || (c.inf >= 2 && r < 0.4);
    case 'archer': return [q[0], q[q.length - 1]].some(x => x && x !== c && killValue(o, x) > 1.6) || (c.inf >= 2 && r < 0.4);
    case 'spy': return adj.some(x => x.owner !== o && P(x.owner).inf > 0) || c.inf >= 2;
    case 'heir': return !q.some(x => x !== c && x.up && x.t === 'heir') ? r < 0.8 || c.inf >= 1 : c.inf >= 3;
    case 'lord': return 1 + adj.filter(x => x.owner === o).length >= 2 || r < 0.55 || c.inf >= 2;
    case 'shift': return adj.some(x => x.up && ['soldier', 'archer', 'heir', 'lord'].includes(x.t));
    case 'assassin': return q.some(x => x !== c && killValue(o, x) >= 3.6) || (c.inf >= 2 && q.some(x => x !== c && killValue(o, x) > 2));
    case 'decree': return c.inf >= 3 || (r < 0.2 && q.some(x => x.owner === o && x.up && (x.t === 'soldier' || x.t === 'archer')));
    case 'ambush': return false;
    case 'conspiracy': return c.inf >= 3 || (c.inf >= 2 && r < 0.35);
  }
  return r < 0.5;
}
function botPlace(i) {
  const p = P(i), q = tops();
  const left = q[0], right = q[q.length - 1];
  const w = { soldier: 3, archer: 2.5, spy: 2.2, heir: 2.6, lord: 2.8, shift: 1.2, assassin: 2, decree: 1, ambush: 2.2, conspiracy: 2.4 };
  if (S.round >= 5) { w.conspiracy = 0.6; w.lord += 1; w.heir += 1; }
  if (!q.some(c => c.owner !== i)) { w.soldier = 1; w.spy = 0.8; }
  let best = null, bv = -1e9;
  for (const c of p.hand) for (const where of ['L', 'R']) {
    const end = where === 'L' ? left : right;
    let v = w[c.t] + Math.random() * 2.2;
    if (end) {
      const opp = end.owner !== i;
      if (c.t === 'soldier' || c.t === 'spy') v += opp ? 1.2 : -1;
      if (c.t === 'lord') v += opp ? -0.4 : 1.2;
      if (c.t === 'shift') v += end.up && T[end.t].k === 'char' ? 1.5 : -0.5;
    }
    if (v > bv) { bv = v; best = { id: c.id, where }; }
  }
  return best;
}

// ---------- render ----------
function cardHTML(c, viewer, opts = {}) {
  const f = FAMS[P(c.owner).fam], mine = c.owner === viewer;
  const tok = c.inf ? `<span class="tok" title="牌上的影響力">${c.inf}</span>` : '';
  const stk = opts.under ? `<span class="stk">下面還有 ${opts.under} 張</span>` : '';
  if (c.up || opts.reveal || S.over) {
    return `<div class="card" style="--c:${f.c}" data-id="${c.id}"><span class="fam">${esc(P(c.owner).name)}</span><div><div class="ic">${T[c.t].ic}</div><div class="nm">${T[c.t].n}</div></div><span class="fam">${T[c.t].k === 'char' ? '角色' : '策略'}${!c.up && S.over ? '・沒翻開' : ''}</span>${tok}${stk}</div>`;
  }
  if (mine) return `<div class="card back mine" style="--c:${f.c}" data-id="${c.id}"><span class="fam">${esc(P(c.owner).name)}</span><div><div class="ic">${T[c.t].ic}</div><div class="nm">${T[c.t].n}</div></div><span class="tag">蓋著（只有你看得到）</span>${tok}${stk}</div>`;
  return `<div class="card back" style="--c:${f.c}" data-id="${c.id}"><span class="fam" style="color:#fff">${esc(P(c.owner).name)}</span><span class="q">?</span><span></span>${tok}${stk}</div>`;
}
function handCardHTML(c, sel) {
  const f = FAMS[P(c.owner).fam];
  return `<div class="card${sel ? ' sel' : ''}" style="--c:${f.c}" data-hand="${c.id}"><span class="fam">${T[c.t].k === 'char' ? '角色' : '策略'}</span><div><div class="ic">${T[c.t].ic}</div><div class="nm">${T[c.t].n}</div></div><span></span></div>`;
}

function render() {
  if (!S) return renderSetup();
  const v = me(), pr = S.prompt;
  const qEl = document.querySelector('.queue'); const sx = qEl ? qEl.scrollLeft : null;
  const picks = pr && pr.type === 'target' ? new Set(pr.opts) : null;
  const stackOK = pr && pr.type === 'place' && S.round >= 2 && ui.sel != null;
  let qh = '';
  const gapMode = pr && pr.type === 'gap';
  const gapAt = g => gapMode ? `<button class="gap" data-gap="${g}">放這裡</button>` : '';
  S.queue.forEach((sl, i) => {
    const c = top(sl);
    const cls = ['slot'];
    if (sl.length > 1) cls.push('stacked');
    if (S.cur === c.id) cls.push('cur');
    if (picks && picks.has(c.id)) cls.push('pick');
    if (stackOK && c.owner === v) cls.push('pickself');
    qh += gapAt(i) + `<div class="${cls.join(' ')}" data-slot="${i}">${cardHTML(c, v, { under: sl.length - 1 })}</div>`;
  });
  qh += gapAt(S.queue.length);
  if (!S.queue.length) qh = '<div class="empty">佇列還是空的</div>';

  const phaseTxt = S.over ? '遊戲結束' : S.phase === 'place' ? '放置階段' : '執行階段';
  const players = S.players.map((p, i) => `<div class="pl${i === v ? ' me' : ''}" style="--c:${FAMS[p.fam].c}"><b>${esc(p.name)}</b>${i === S.start && !S.over ? '<span class="first">★ 本輪先放</span>' : ''}<span>影響力 <span class="inf">${p.inf}</span></span><span>手牌 ${p.hand.length}${S.turn === i ? '・放牌中…' : ''}</span></div>`).join('');
  const logs = (ui.showLog ? S.log : S.log.slice(-6)).map(s => `<div>${esc(s)}</div>`).join('');
  $('app').innerHTML = `
  <div class="top"><h1>豐富之城<small>富饒之城2 規則</small></h1><div class="row"><button class="pill" id="rulesBtn">規則</button><button class="pill" id="newBtn">重新開始</button></div></div>
  <div class="status">第 <b>${Math.min(S.round, ROUNDS)}</b> / ${ROUNDS} 輪・<b>${phaseTxt}</b>　佇列由左往右執行</div>
  <div class="players">${players}</div>
  <div class="tablebox"><div class="lbl"><span>◀ 左端（先執行）</span><span>影響力佇列</span><span>右端 ▶</span></div><div class="queue" id="queue">${qh}</div></div>
  <div class="log" id="log">${logs}</div>
  <div class="row" style="margin-top:6px"><button class="pill" id="logBtn">${ui.showLog ? '只看最近' : '看全部紀錄'}</button></div>`;
  const qn = $('queue');
  if (sx != null) qn.scrollLeft = sx;
  const curEl = qn.querySelector('.slot.cur, .slot.pick');
  if (curEl) { const r = curEl.offsetLeft - qn.clientWidth / 2 + curEl.offsetWidth / 2; qn.scrollLeft = r; }
  if (gapMode && sx == null) qn.scrollLeft = 0;
  const lg = $('log'); lg.scrollTop = lg.scrollHeight;
  $('rulesBtn').onclick = showRules;
  $('newBtn').onclick = () => { if (S.over || confirm('放棄這一局，重新開始？')) { S = null; gid++; render(); } };
  $('logBtn').onclick = () => { ui.showLog = !ui.showLog; render(); };
  qn.querySelectorAll('.slot').forEach(el => el.onclick = () => {
    const i = +el.dataset.slot, c = top(S.queue[i]);
    if (picks && picks.has(c.id)) return answer(c.id);
    if (stackOK && c.owner === v) return answer({ id: ui.sel, where: i });
    showCardInfo(c);
  });
  qn.querySelectorAll('.gap').forEach(el => el.onclick = () => answer(+el.dataset.gap));
  renderPanel();
  if (S.over) renderEnd();
}

function renderPanel() {
  const pr = S.prompt, v = me(), pn = $('panel'), pin = $('panelIn');
  const hand = P(v).hand;
  let h = '';
  if (pr && pr.type === 'place') {
    const sel = hand.find(c => c.id === ui.sel);
    h = `<h3>輪到你放牌</h3>
      <div class="hand">${hand.map(c => handCardHTML(c, c.id === ui.sel)).join('')}</div>
      ${sel ? `<div class="desc"><b>${T[sel.t].ic} ${T[sel.t].n}</b>：${T[sel.t].d}</div>` : '<p>先點一張手牌。牌會蓋著放進佇列，對手看不到是什麼。</p>'}
      <div class="btns"><button class="btn" id="pL" ${sel ? '' : 'disabled'}>放最左端</button><button class="btn" id="pR" ${sel ? '' : 'disabled'}>放最右端</button></div>
      ${S.round >= 2 ? '<p>也可以疊在自己的牌上面：選好手牌後，點佇列裡自己的牌（藍色虛線框）。下面那張會暫停，不累積、不發動、不能被攻擊。</p>' : ''}`;
  } else if (pr && pr.type === 'reveal') {
    const c = byId(pr.id), gain = c.t === 'conspiracy' ? c.inf * 2 : c.inf;
    h = `<h3>輪到你的蓋牌：${T[c.t].ic} ${T[c.t].n}</h3><div class="desc">${T[c.t].d}</div>
      <p>牌上有 ${c.inf} 點影響力。翻開就拿走${gain !== c.inf ? `（陰謀加倍成 ${gain} 點）` : ''}並發動能力；不翻開則再累積 1 點，但可能被對手消滅。${S.round === ROUNDS ? '<b>最後一輪了，沒翻開的牌上的影響力不算分。</b>' : ''}</p>
      <div class="btns"><button class="btn" id="rY">翻開${gain ? `（+${gain}）` : ''}</button><button class="btn alt" id="rN">不翻開（牌上 +1）</button></div>`;
  } else if (pr && pr.type === 'target') {
    h = `<h3>${esc(pr.title)}</h3><p>點佇列裡發亮的牌。${pr.mode === 'kill' ? '每消滅一張牌你得 1 點影響力；但對手的蓋牌可能是伏擊。' : ''}</p>
      <div class="btns"><button class="btn ghost" id="tSkip">${pr.mode === 'copy' ? '不複製' : pr.mode === 'move' ? '不移動' : '不發動'}</button></div>`;
  } else if (pr && pr.type === 'gap') {
    h = `<h3>皇家法令：選新位置</h3><p>點佇列中黃色虛線的「放這裡」。</p>`;
  } else if (!S.over) {
    h = `<p>${S.phase === 'place' ? (S.turn != null ? `${esc(P(S.turn).name)} 正在放牌…` : '') : '執行中…'}</p>
      <div class="hand" style="opacity:.75">${hand.map(c => handCardHTML(c, false)).join('') || '<p>手牌用完了</p>'}</div>`;
  }
  pn.hidden = !h; pin.innerHTML = h;
  pin.querySelectorAll('[data-hand]').forEach(el => el.onclick = () => { if (pr && pr.type === 'place') { ui.sel = +el.dataset.hand; render(); } else showCardInfo(P(v).hand.find(c => c.id === +el.dataset.hand)); });
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  on('pL', () => answer({ id: ui.sel, where: 'L' }));
  on('pR', () => answer({ id: ui.sel, where: 'R' }));
  on('rY', () => answer(true)); on('rN', () => answer(false));
  on('tSkip', () => answer(null));
  document.querySelector('.wrap').style.paddingBottom = (pn.hidden ? 40 : pn.offsetHeight + 30) + 'px';
}

      <p style="margin:0;line-height:1.7">老國王駕崩，沒有留下繼承人。各大家族把手下蓋著派進宮廷，什麼時候亮出身分、要暗殺誰，都要好好盤算。<b>6 輪後影響力最多的家族奪得王位。</b></p>
      <label>你的名字<input id="nm" maxlength="8" value="${esc(cfg.name)}"></label>
      <div><div style="font-size:.9rem;margin-bottom:4px">你的家族</div><div class="fams">${FAMS.map((f, i) => `<button style="--c:${f.c}" data-f="${i}" aria-pressed="${i === cfg.fam}">${f.n}</button>`).join('')}</div></div>
      <div><div style="font-size:.9rem;margin-bottom:4px">人數（你 + 電腦）</div><div class="seg">${[3, 4, 5].map(n => `<button data-n="${n}" aria-pressed="${n === cfg.n}">${n} 人</button>`).join('')}</div></div>
      <button class="btn" id="go">開始遊戲</button>
    </div>
    <p style="font-size:.78rem;color:var(--muted);text-align:center">非官方練習版，依公開規則整理製作。</p>
  </div>`;
  $('rulesBtn').onclick = showRules;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { cfg.fam = +b.dataset.f; renderSetup(); });
  document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { cfg.n = +b.dataset.n; renderSetup(); });
  $('nm').oninput = e => { cfg.name = e.target.value; };
  $('go').onclick = () => {
    cfg.name = ($('nm').value || '我').trim() || '我';
    store.set('fc-n', cfg.n); store.set('fc-name', cfg.name); store.set('fc-fam', cfg.fam);
    newGame();
  };
}

addEventListener('resize', () => { if (S) renderPanel(); });
render();

// test hooks
window.__fc = {
  S: () => S, answer, speed: v => { SPEED = v; },
  bots: n => { cfg.n = n; newGame(true); },
};
})();
</script>
</html>

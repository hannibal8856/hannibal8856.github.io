<style>
/* Layout: a late-night kitchen table — players around the top, the face-down card being passed in the middle, your hand and choices in a fixed bar at the bottom. Single deliberate dark theme. */

  background: radial-gradient(110% 55% at 50% 25%, #2b2418, var(--bg) 70%); }
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 260px; }

.log div:first-child { color: var(--fg); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #120f0bf3; backdrop-filter: blur(6px); border-top: 1.5px solid var(--line);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar .in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

.ab.on { background: var(--acc); color: #2a1e08; box-shadow: 0 0 0 2px #fff4; }
.ab:disabled { opacity: .3; cursor: default; }
.ab .n { font-weight: 800; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.sheet { background: var(--bg2); width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 0 1.5px var(--acc2); }
.sheet.wide { max-width: 620px; }
.sheet h2 { font-size: 1.35rem; color: var(--acc); }
.sheet p { margin: 0; line-height: 1.6; }
@keyframes fade { from { opacity: 0; } }
.rules h3 { font-size: 1.02rem; color: var(--acc); margin-top: 6px; }
.rules ul, .rules ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; line-height: 1.6; font-size: .9rem; }
.setup { display: flex; flex-direction: column; gap: 14px; background: var(--bg2); border-radius: 14px; padding: 14px; }
.seg { display: inline-flex; border-radius: 9px; overflow: hidden; box-shadow: inset 0 0 0 1.5px #ffffff44; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: .9rem; }
.seg button.on { background: var(--acc); color: #2a1e08; }
.chk { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.chk input { width: 18px; height: 18px; accent-color: var(--acc); }
.muted { color: var(--muted); } .small { font-size: .8rem; }
table.res { width: 100%; border-collapse: collapse; font-size: .86rem; }
table.res td, table.res th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.chatbtn { position: relative; }
.chatbtn .badge { position: absolute; top: -5px; right: -5px; background: var(--red); color: #fff; border-radius: 999px; font-size: .66rem; padding: 0 5px; min-width: 17px; line-height: 17px; }
.chat { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #1d1811fa; border-top: 1.5px solid var(--acc); box-shadow: 0 -10px 30px #000a;
  padding: 12px max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.chat .cin { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.chat .chd { display: flex; justify-content: space-between; align-items: center; }
.chat .msgs { overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; min-height: 70px; max-height: 34vh; line-height: 1.45; }
.chat .msgs b { color: var(--acc); }
.chat .msgs .sys { color: var(--muted); font-size: .8rem; }
.emos { display: flex; gap: 4px; flex-wrap: wrap; }
.emos button { font-size: 1.35rem; background: var(--bg3); border: 0; border-radius: 8px; padding: 3px 6px; line-height: 1.2; }
.chat form { display: flex; gap: 6px; }
.chat input, .netin { flex: 1; font: inherit; border: 1.5px solid #ffffff2a; border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--fg); min-width: 0; }
.bubble { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); z-index: 50; background: #221d16f5; border: 1.5px solid var(--acc); border-radius: 14px; padding: 8px 16px; box-shadow: 0 8px 24px #000a; animation: pop .25s; pointer-events: none; text-align: center; max-width: 86vw; font-size: .9rem; }
.bubble .e { font-size: 2.4rem; display: block; line-height: 1.15; }
@keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } }
.code { font: 700 2.6rem var(--ui); letter-spacing: .3em; color: var(--acc); text-align: center; text-shadow: 0 0 18px #f2c14e55; }
.plist { display: flex; flex-direction: column; gap: 6px; }
.plist div { background: var(--bg); border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 8px; }
.err { background: #e5533d33; color: #ffb3a3; border-radius: 10px; padding: 9px 12px; font-size: .88rem; }

<div class="wrap" id="app"></div>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rint = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rint(a.length)];

const AN = [{ n: '蟑螂', e: '🪳' }, { n: '老鼠', e: '🐀' }, { n: '蝙蝠', e: '🦇' }, { n: '蒼蠅', e: '🪰' }, { n: '蟾蜍', e: '🐸' }, { n: '蠍子', e: '🦂' }, { n: '臭蟲', e: '🪲' }, { n: '蜘蛛', e: '🕷️' }];
const A = (k) => AN[k].e + AN[k].n;
let SLEEP = 1;

let S = null, resolver = null, UI = {}, setupCfg = null;
const P = (i) => S.players[i];
const nm = (i) => P(i).name;
function log(t) { S.log.unshift(t); if (S.log.length > 120) S.log.pop(); }
async function nap(ms) { const g = S && S.gid; await sleep(ms * SLEEP); if (!S || S.gid !== g) throw 'stop'; }
function ask(pr) {
  if (S.online && pr.p != null && P(pr.p).remote) { pr.pid = ++NET.pid; S.rprompts[pr.p] = pr; render(); return new Promise(r => { NET.waits[pr.pid] = { r, seat: pr.p, pr }; }); }
  UI = {}; S.prompt = pr; render(); return new Promise(r => { resolver = r; });
}
function answer(v) {
  if (NET.role === 'client') { closeSheet(); clientAnswer(v); return; }
  const r = resolver; resolver = null; S.prompt = null; UI = {}; if (r) r(v);
}

// ---------- game ----------
function newGame(cfg) {
  const n = cfg.seats.length;
  S = { n, rule8: !!cfg.rule8, players: cfg.seats.map(s => ({ name: s.name, baseName: s.name, human: s.human, remote: !!s.remote, off: false, hand: [], table: Array(8).fill(0) })),
    cur: rint(n), turn: null, chain: null, reveal: null, log: [], over: false, loser: null, why: '', gid: Math.random(), prompt: null, stats: Array.from({ length: n }, () => ({ t: 0, l: 0 })), rid: 0 };
  shuffle(Array.from({ length: 64 }, (_, i) => i % 8)).forEach((c, i) => S.players[(i + S.cur) % n].hand.push(c));
  S.players.forEach(p => p.hand.sort((a, b) => a - b));
  log(`新遊戲：${n} 位玩家，牌全部發完（每人 ${Math.floor(64 / n)}～${Math.ceil(64 / n)} 張）。誰先集滿 4 張同種動物就輸！`);
}
async function run() { try { await runInner(); } catch (e) { if (e !== 'stop') throw e; } }
async function runInner() {
  while (true) {
    const i = S.cur, pl = P(i);
    S.turn = i; S.chain = null;
    if (!pl.hand.length) return finish(i, `輪到 ${nm(i)} 推牌時，他已經沒有手牌了`);
    let g;
    if (pl.human) g = await ask({ type: 'give', p: i });
    else { render(); await nap(900); g = botGive(i); }
    const card = pl.hand.splice(g.idx, 1)[0];
    S.chain = { card, from: i, to: g.to, claim: g.claim, seen: [i], steps: [{ from: i, to: g.to, claim: g.claim }], id: ++S.rid };
    log(`${nm(i)} 把一張牌推給 ${nm(g.to)}：「這是${A(g.claim)}」`);
    while (true) {
      const ch = S.chain, j = ch.to;
      const canPass = S.players.some((_, k) => k !== j && !ch.seen.includes(k));
      let r;
      if (P(j).human) r = await ask({ type: 'recv', p: j, canPass });
      else { render(); await nap(1100); r = botRecv(j, canPass); }
      if (r.k === 'peek' && canPass) {
        ch.seen.push(j);
        let ps;
        if (P(j).human) ps = await ask({ type: 'pass', p: j, card: ch.card });
        else { await nap(500); ps = botPass(j); }
        log(`${nm(j)} 偷看後，把牌推給 ${nm(ps.to)}：「這是${A(ps.claim)}」`);
        ch.from = j; ch.to = ps.to; ch.claim = ps.claim; ch.steps.push({ from: j, to: ps.to, claim: ps.claim }); ch.id = ++S.rid;
        continue;
      }
      const truth = ch.card === ch.claim, correct = r.say === truth, getter = correct ? ch.from : j;
      S.stats[ch.from][truth ? 't' : 'l']++;
      P(getter).table[ch.card]++;
      S.reveal = { card: ch.card, claim: ch.claim, from: ch.from, to: j, say: r.say, correct, getter, id: ++S.rid };
      log(`${nm(j)} 說「${r.say ? '是' : '不是'}」，翻開是 ${A(ch.card)} → ${correct ? '猜對了' : '猜錯了'}，牌放到 ${nm(getter)} 面前`);
      S.chain = null; S.cur = getter; S.turn = null;
      render(); await nap(2600);
      if (P(getter).table[ch.card] >= 4) return finish(getter, `${nm(getter)} 面前集滿 4 張${A(ch.card)}`);
      if (S.rule8 && P(getter).table.every(x => x > 0)) return finish(getter, `${nm(getter)} 面前 8 種動物都有了`);
      break;
    }
  }
}
function finish(i, why) { S.over = true; S.loser = i; S.why = why; S.turn = null; S.chain = null; log(`遊戲結束：${why}。${nm(i)} 輸了，其他人獲勝！`); render(); }

// ---------- computer players ----------
const others = (i) => S.players.map((_, j) => j).filter(j => j !== i);
const maxT = (j) => Math.max(...P(j).table);
function botGive(i) {
  const pl = P(i); let best = null, bv = -1e9;
  const types = [...new Set(pl.hand)];
  for (const j of others(i)) for (const c of types) {
    const v = P(j).table[c] * 3 + (P(j).table[c] === 3 ? 4 : 0) + Math.random() * 2.5 - pl.hand.filter(x => x === c).length * 0.15 - P(i).table[c] * 0.5;
    if (v > bv) { bv = v; best = { idx: pl.hand.indexOf(c), to: j, c }; }
  }
  let claim = best.c;
  if (Math.random() > 0.45) { const t = P(best.to).table; const opts = [0, 1, 2, 3, 4, 5, 6, 7].filter(k => k !== best.c); opts.sort((a, b) => t[b] - t[a] + (Math.random() - 0.5) * 2); claim = opts[0]; }
  return { idx: best.idx, to: best.to, claim };
}
function pTrue(i) {
  const ch = S.chain, k = ch.claim;
  let known = P(i).hand.filter(x => x === k).length; S.players.forEach(p => known += p.table[k]);
  const rem = 8 - known; if (rem <= 0) return 0.01;
  const st = S.stats[ch.from], honest = (st.t + 1) / (st.t + st.l + 2);
  return Math.min(0.95, Math.max(0.05, 0.25 + 0.45 * (rem / 8) + 0.35 * (honest - 0.5) + (Math.random() - 0.5) * 0.2));
}
function botRecv(i, canPass) {
  const p = pTrue(i);
  const sure = Math.abs(p - 0.5) > 0.3;
  if (canPass && !sure && Math.random() < 0.3 + 0.12 * maxT(i)) return { k: 'peek' };
  return { k: 'call', say: p > 0.5 };
}
function botPass(i) {
  const ch = S.chain, c = ch.card;
  const cand = others(i).filter(j => !ch.seen.includes(j));
  let to = cand[0], bv = -1e9;
  for (const j of cand) { const v = P(j).table[c] * 3 + Math.random() * 2; if (v > bv) { bv = v; to = j; } }
  let claim = c;
  if (Math.random() > 0.45) claim = Math.random() < 0.5 ? ch.claim : pick([0, 1, 2, 3, 4, 5, 6, 7].filter(k => k !== c));
  return { to, claim };
}

// ---------- rendering ----------
function viewer() { if (S.online) return S.me; return S.players.findIndex(p => p.human); }
function tableHTML(p) { const t = p.table.map((c, k) => c ? `<span class="tc ${c >= 3 ? 'd3' : ''}">${AN[k].e}×${c}</span>` : '').join(''); return t || '<span class="small muted">面前還沒有牌</span>'; }
function render() {
  if (!S) return renderSetup();
  const app = $('#app'), pr = S.prompt, me = viewer(), ch = S.chain;
  const picking = pr && (pr.type === 'give' || pr.type === 'pass') ? pr : null;
  app.innerHTML = `
  <div class="top"><h1>蟲蟲吹牛<small>德國蟑螂規則</small></h1><div style="display:flex;gap:6px">${NET.role ? chatBtnHTML() : ''}<button class="pill" id="rulesBtn">規則</button><button class="pill" id="quitBtn">${S.online ? '離開' : '重新開始'}</button></div></div>
  ${S.online ? `<div class="small muted">房號 <b style="color:var(--acc)">${esc(NET.code)}</b></div>` : ''}
  <div class="players">${S.players.map((p, j) => {
    let cls = '';
    if (picking) { const ok = j !== pr.p && (pr.type === 'give' || !S.chain.seen.includes(j)); cls = ok ? 'pick' + (UI.to === j ? ' on' : '') : 'dis'; }
    const tags = [];
    if (ch && ch.to === j) tags.push('<span class="tag gets">收到牌</span>');
    if (ch && ch.seen.includes(j) && ch.from !== j && ch.steps[0].from !== j) tags.push('<span class="tag seen">看過</span>');
    if (ch && ch.steps[0].from === j) tags.push('<span class="tag seen">出牌</span>');
    if (p.off) tags.push('<span class="tag off">離線・電腦代打</span>');
    return `<button class="pl ${S.turn === j || (ch && ch.to === j) ? 'turn' : ''} ${j === me ? 'me' : ''} ${cls} ${S.over && S.loser === j ? 'lose' : ''}" data-pl="${j}" ${cls.startsWith('pick') ? '' : 'tabindex="-1"'}>
      <span class="nm">${esc(p.name)}${j === me ? '<span class="small muted">（你）</span>' : ''}${tags.join('')}</span>
      <span class="sub">手牌 ${p.hand.length} 張</span><span class="tbl">${tableHTML(p)}</span></button>`; }).join('')}</div>
  <div class="stage">${stageHTML()}</div>
  <div style="display:flex;flex-direction:column;gap:6px"><h3 style="font-size:1rem">紀錄</h3><div class="log">${S.log.map(l => `<div>${esc(l)}</div>`).join('')}</div></div>`;
  $('#rulesBtn').onclick = showRules;
  $('#quitBtn').onclick = confirmQuit;
  bindChatBtn();
  app.querySelectorAll('.pl.pick').forEach(b => b.onclick = () => { UI.to = +b.dataset.pl; render(); });
  renderBar(); renderSheet();
  syncSoon();
}
function stageHTML() {
  const ch = S.chain, rv = S.reveal;

// ----- host -----
async function hostRoom(name) {
  NET.role = 'host'; NET.myName = name; NET.err = ''; NET.status = '正在建立房間…'; NET.lobby = { n: 4, rule8: false };
  render();

  if (NET.role !== 'host') return;
  for (let tries = 0; tries < 6 && !NET.peer; tries++) {
    const code = newCode();
    const r = await new Promise(res => {
      const p = new Peer(PEER_PREFIX + code, peerOpts());
      let done = false;
      p.on('open', () => { done = true; res({ p, code }); });
      p.on('error', e => { if (!done) { done = true; try { p.destroy(); } catch {} res({ err: e }); } else hostPeerError(e); });
      setTimeout(() => { if (!done) { done = true; try { p.destroy(); } catch {} res({ err: { type: 'timeout' } }); } }, 15000);
    });

    if (r.p) { NET.peer = r.p; NET.code = r.code; break; }

function startOnline() {
  const L = NET.lobby, n = lobbyN();
  if (1 + NET.conns.length > n) return;
  const seats = [{ name: NET.myName, human: true }, ...NET.conns.map(r => ({ name: r.name, human: true, remote: true }))];
  NET.conns.forEach((r, i) => r.seat = i + 1);
  let b = 0; while (seats.length < n) seats.push({ name: BOTNAMES[b++], human: false });
  NET.waits = {};
  newGame({ seats, rule8: L.rule8 });
  S.online = true; S.me = 0; S.rprompts = {};
  sysChat(`開始遊戲！${n} 位玩家`);
  render(); run();
}

// ----- client -----
async function joinRoom(code, name) {
  NET.role = 'client'; NET.myName = name; NET.code = code; NET.err = ''; NET.status = '正在連線到房間 ' + code + '…';
  render();
  let Peer; try { Peer = await loadPeer(); } catch { return netFail('連線元件載入失敗，請確認網路後再試一次。'); }
  if (NET.role !== 'client') return;
  const p = new Peer(undefined, peerOpts()); NET.peer = p;
  p.on('error', e => {
    if (NET.role !== 'client') return;
    if (e.type === 'peer-unavailable') netFail(`找不到房間 ${code}，請確認房號，或請房主重新開房。`);
    else if (!NET.host || !NET.host.open) netFail('連線失敗（' + (e.type || '網路錯誤') + '），請再試一次。');
  });
  p.on('open', () => {
    const c = p.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' }); NET.host = c;
    c.on('open', () => { NET.hostLast = Date.now(); send(c, { t: 'hello', name }); NET.status = '已連線，等待房主…'; render(); });
    c.on('data', clientRecv);
    c.on('close', () => { if (NET.role === 'client') netFail(S && !S.over ? '和房主的連線中斷了。用同一個名字重新加入可以接回座位。' : '房間已經關閉了。'); });
  });
  setTimeout(() => { if (NET.role === 'client' && NET.code === code && !NET.lobby && !S) netFail('連線逾時。請確認房號，或請房主重新開房。'); }, 20000);
}
function clientRecv(d) {
  if (!d || typeof d !== 'object') return;
  NET.hostLast = Date.now();
  if (d.t === 'ping') { send(NET.host, { t: 'pong' }); return; }
  if (d.t === 'lobby') { NET.lobby = d; NET.status = ''; if (S) { S = null; NET.dismissed = {}; NET.answered = 0; NET.roleKey = ''; closeSheet(); } render(); }
  else if (d.t === 'view') applyView(d.v);
  else if (d.t === 'chat') addChat(d.from, d.text, d.sys);
  else if (d.t === 'emo') addEmo(d.from, d.e);
  else if (d.t === 'bye') { const r = d.reason; netFail(r); }
}
function applyView(v) {
  NET.lastView = v;
  const prevPid = S && S.prompt && S.prompt.pid;
  S = { online: true, client: true, me: v.me, gid: v.gk, n: v.n, rule8: v.rule8, cur: v.cur, turn: v.turn, log: v.log, over: v.over, loser: v.loser, why: v.why, stats: v.stats, reveal: v.reveal, chain: v.chain,
    players: v.players.map(p => ({ ...p, hand: Array.isArray(p.hand) ? p.hand : Array(p.hand).fill(null) })), prompt: null, rprompts: {} };
  if (v.prompt && v.prompt.pid !== NET.answered) S.prompt = v.prompt;
  if (!(S.prompt && S.prompt.pid && S.prompt.pid === prevPid)) UI = {};
  render();
}
function clientAnswer(v) {
  const pr = S && S.prompt; if (!pr) return;
  S.prompt = null; UI = {};
  if (pr.local) { if (pr.type === 'role') NET.roleKey = pr.key; else if (pr.key) NET.dismissed[pr.key] = true; if (NET.lastView) applyView(NET.lastView); else render(); return; }
  NET.answered = pr.pid; send(NET.host, { t: 'ans', pid: pr.pid, v }); render();
}

// ----- chat & emotes -----
function chatBtnHTML() { return `<button class="pill chatbtn" id="chatBtn" aria-label="聊天">💬 聊天${NET.unread ? `<span class="badge">${NET.unread}</span>` : ''}</button>`; }
function bindChatBtn() { const b = $('#chatBtn'); if (b) b.onclick = () => { NET.chatOpen = !NET.chatOpen; NET.unread = 0; updateBadge(); renderChat(); }; }
function updateBadge() { const b = $('#chatBtn'); if (b) b.innerHTML = `💬 聊天${NET.unread ? `<span class="badge">${NET.unread}</span>` : ''}`; }
function addChat(from, text, sys) {
  NET.chat.push({ from, text, sys: !!sys }); if (NET.chat.length > 120) NET.chat.shift();
  if (NET.role === 'host') bcast({ t: 'chat', from, text, sys: !!sys });
  if (!NET.chatOpen && !sys) { NET.unread++; updateBadge(); }
  renderChat();
}
function sysChat(text) { addChat('', text, true); }
function addEmo(from, e) {
  if (NET.role === 'host') bcast({ t: 'emo', from, e });
  NET.chat.push({ from, text: e, emo: true }); if (NET.chat.length > 120) NET.chat.shift();
  renderChat();
  const old = $('#bubble'); if (old) old.remove();
  const b = document.createElement('div'); b.className = 'bubble'; b.id = 'bubble';
  b.innerHTML = `<span class="e">${e}</span>${esc(from)}`;
  document.body.appendChild(b); setTimeout(() => { if (b.isConnected) b.remove(); }, 2300);
}
function sendChat(text) {
  text = text.trim().slice(0, 120); if (!text) return;
  if (NET.role === 'host') addChat(NET.myName, text); else send(NET.host, { t: 'chat', text });
}
function sendEmo(e) { if (NET.role === 'host') addEmo(NET.myName, e); else send(NET.host, { t: 'emo', e }); }
function renderChat() {
  let el = $('#chat');
  if (!NET.chatOpen || !NET.role) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div'); el.className = 'chat'; el.id = 'chat';
    el.innerHTML = `<div class="cin"><div class="chd"><h3 style="font-size:1.05rem">💬 聊天</h3><button class="pill" id="chatX">關閉</button></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="emos">${EMOS.map(e => `<button data-emo="${e}" aria-label="送出 ${e}">${e}</button>`).join('')}</div>
      <form id="chatF"><input id="chatI" maxlength="120" placeholder="說點什麼…（例如：相信我，這真的是蟑螂！）" autocomplete="off"><button class="btn" type="submit">送出</button></form></div>`;
    document.body.appendChild(el);
    $('#chatX', el).onclick = () => { NET.chatOpen = false; renderChat(); };
    el.querySelectorAll('[data-emo]').forEach(b => b.onclick = () => sendEmo(b.dataset.emo));
    $('#chatF', el).onsubmit = (ev) => { ev.preventDefault(); const i = $('#chatI', el); sendChat(i.value); i.value = ''; i.focus(); };
  }
  const box = $('#msgs', el);
  box.innerHTML = NET.chat.map(m => m.sys ? `<div class="sys">— ${esc(m.text)} —</div>` : `<div><b>${esc(m.from)}</b>：${m.emo ? `<span style="font-size:1.3rem">${m.text}</span>` : esc(m.text)}</div>`).join('') || '<div class="sys">還沒有訊息</div>';
  box.scrollTop = box.scrollHeight;
}

// ----- setup & lobby screens -----
function playSegHTML() {
  const p = setupCfg.play;
  return `<div class="setup" style="gap:8px"><h3>怎麼玩</h3><div class="seg"><button data-play="local" class="${p === 'local' ? 'on' : ''}">這支手機</button><button data-play="host" class="${p === 'host' ? 'on' : ''}">線上開房</button><button data-play="join" class="${p === 'join' ? 'on' : ''}">加入房間</button></div>
    <span class="small muted">${p === 'local' ? '和電腦玩。' : p === 'host' ? '你開一個房間，朋友用自己的手機輸入房號加入，空位由電腦補。' : '輸入朋友給你的 4 碼房號。'}</span>
    ${NET.err ? `<div class="err">${esc(NET.err)}</div>` : ''}</div>`;
}
function bindPlaySeg(save) { document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => { if (save) save(); setupCfg.play = b.dataset.play; NET.err = ''; renderSetup(); }); }
function renderNetSetup() {
  const c = setupCfg, host = c.play === 'host';
  const name = c.netName ?? store.get('roach-name');
  $('#app').innerHTML = `
  <div class="top"><h1>蟲蟲吹牛<small>德國蟑螂規則</small></h1><button class="pill" id="rulesBtn">規則</button></div>
  <p style="margin:0;color:var(--muted);line-height:1.6">「這是一隻蟑螂！」——說真話還是在吹牛？</p>
  ${playSegHTML()}
  <div class="setup">
    <div style="display:flex;flex-direction:column;gap:6px"><h3>你的名字</h3><input class="netin" id="nmI" maxlength="8" value="${esc(name)}" placeholder="最多 8 個字"></div>
    ${host ? '<p class="small muted" style="margin:0">人數和選用規則，進房後再設定。</p>'
      : `<div style="display:flex;flex-direction:column;gap:6px"><h3>房號</h3><input class="netin" id="codeI" maxlength="4" value="${esc(c.code || '')}" placeholder="例如 K7QF" style="text-transform:uppercase;letter-spacing:.3em;font-size:1.3rem;max-width:200px" autocapitalize="characters"></div>`}
    <button class="btn" id="go" style="align-self:flex-start;font-size:1.05rem">${host ? '建立房間' : '加入房間'}</button>
    <span class="small muted">需要網路。房主的手機負責發牌和計算，遊戲中請房主不要關掉這個網頁。</span>
  </div>`;
  $('#rulesBtn').onclick = showRules;
  const keep = () => { c.netName = $('#nmI').value; const ci = $('#codeI'); if (ci) c.code = ci.value; };
  bindPlaySeg(keep);
  $('#go').onclick = () => {
    const nm2 = $('#nmI').value.trim().slice(0, 8);
    if (!nm2) { $('#nmI').focus(); return; }
    store.set('roach-name', nm2); c.netName = nm2;
    if (host) hostRoom(nm2);
    else { const code = ($('#codeI').value || '').trim().toUpperCase(); if (code.length !== 4) { $('#codeI').focus(); return; } c.code = code; joinRoom(code, nm2); }
  };
}
function renderLobby() {
  const host = NET.role === 'host', L = NET.lobby;
  let body;
  if (NET.status || !L || (host && !NET.code)) body = `<p>${esc(NET.status || '連線中…')}</p>`;
  else {
    const players = host ? [NET.myName, ...NET.conns.map(r => r.name)] : L.players;
    const n = host ? lobbyN() : L.n;
    const ns = []; for (let k = Math.max(3, players.length); k <= 6; k++) ns.push(k);
    body = `<div style="text-align:center"><span class="small muted">房號</span><div class="code">${esc(NET.code)}</div>
      ${host ? `<div class="row" style="justify-content:center"><button class="btn alt" id="share">分享邀請連結</button></div><p class="small muted" style="margin:6px 0 0">朋友打開遊戲 → 加入房間 → 輸入房號。</p>` : ''}</div>
    <div style="display:flex;flex-direction:column;gap:6px"><h3>玩家（${players.length} 位真人）</h3>
      <div class="plist">${players.map((p, i) => `<div><span>${esc(p)}${p === NET.myName ? '（你）' : ''}</span><span class="small muted">${i === 0 ? '房主' : '已加入'}</span></div>`).join('')}
      ${n > players.length ? `<div><span class="muted">電腦 × ${n - players.length}</span><span class="small muted">補空位</span></div>` : ''}</div></div>
    ${host ? `<div><h3>總人數</h3>${players.length > 6 ? '<p class="err">最多 6 人。</p>' : `<div class="seg">${ns.map(k => `<button data-ln="${k}" class="${n === k ? 'on' : ''}">${k}</button>`).join('')}</div>`}</div>
      <label class="chk"><input type="checkbox" id="lr8" ${L.rule8 ? 'checked' : ''}> 選用規則：面前 8 種動物都有了也算輸</label>
      <button class="btn" id="startOn" style="align-self:flex-start;font-size:1.05rem" ${players.length > 6 ? 'disabled' : ''}>開始遊戲</button>`
      : `<p class="small muted" style="margin:0">共 ${n} 位玩家${L.rule8 ? '，使用「8 種動物也算輸」' : ''}。等房主開始…</p>`}`;
  }
  $('#app').innerHTML = `
  <div class="top"><h1>蟲蟲吹牛<small>線上房間</small></h1><div style="display:flex;gap:6px">${chatBtnHTML()}<button class="pill" id="rulesBtn">規則</button><button class="pill" id="leave">離開</button></div></div>
  <div class="setup">${body}</div>`;
  $('#rulesBtn').onclick = showRules;
  bindChatBtn();
  $('#leave').onclick = netLeave;
  document.querySelectorAll('[data-ln]').forEach(b => b.onclick = () => { NET.lobby.n = +b.dataset.ln; render(); });
  const r8 = $('#lr8'); if (r8) r8.onchange = (e) => { NET.lobby.rule8 = e.target.checked; render(); };
  const so = $('#startOn'); if (so) so.onclick = startOnline;
  const sh = $('#share'); if (sh) sh.onclick = async () => {
    const link = location.href.split('?')[0].split('#')[0] + '?room=' + NET.code;
    const text = `來玩蟲蟲吹牛！房號 ${NET.code}`;
    try { if (navigator.share) { await navigator.share({ title: '蟲蟲吹牛', text, url: link }); return; } } catch { return; }
    try { await navigator.clipboard.writeText(text + ' ' + link); sh.textContent = '已複製連結'; } catch { sh.textContent = '房號：' + NET.code; }
  };
  syncSoon();
}

window.__roach = () => S;
window.__roachNet = () => NET;
window.__roachSpeed = (v) => { SLEEP = v; };
window.__roachBots = (n, r8) => { newGame({ seats: BOTNAMES.concat(["電腦 X"]).slice(0, n).map(x => ({ name: x, human: false })), rule8: r8 }); render(); run(); };
render();
})();
</script>
</html>

<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
<title>河畔牧場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: one scrolling column on a saloon-wood table — header, plot market + saloon, player chips, the viewed ranch (5-wide grid above its reservation board), log; fixed action bar at the bottom. Single deliberate theme. */
:root {
  color-scheme: dark;
  --wood: #3a2316; --wood2: #4c2f1e; --wood3: #2a180f;
  --paper: #f1dfb4; --paper2: #e4cb95; --paper3: #c9a868;
  --ink: #2e1c10; --muted: #6e5136; --soft: #f5e8cc; --soft2: #cdb38c;
  --river: #3d9ad1; --river2: #2a6f9e; --gold: #f2c230; --red: #b8402a; --sun: #ffcf5a;
  --tD: #e6dcc2; --tC: #dd7038; --tM: #86c04c; --tF: #285431; --tK: #efc12d; --tA: #8a5532;
  --line: #2e1c1029;
  --west: "Rye", "LXGW WenKai TC", serif;
  --hand: "LXGW WenKai TC", "Kaiti TC", serif;
  --ui: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--wood); color: var(--soft); font-family: var(--ui); font-size: 15px;
  background-image: repeating-linear-gradient(90deg, #ffffff06 0 3px, transparent 3px 46px), repeating-linear-gradient(0deg, #00000018 0 1px, transparent 1px 7px);
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 170px;
}
h1, h2, h3 { margin: 0; font-family: var(--hand); font-weight: 700; text-wrap: balance; }
button { font: inherit; cursor: pointer; }
button:focus-visible, [role="button"]:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.top h1 { font-family: var(--west); font-weight: 400; font-size: 1.7rem; letter-spacing: .02em; color: var(--sun); text-shadow: 0 2px 0 #0008; }
.top h1 small { font-family: var(--hand); font-size: .9rem; color: var(--soft2); text-shadow: none; margin-left: 6px; }
.pill { border: 1.5px solid #ffffff33; background: transparent; color: var(--soft); border-radius: 999px; padding: 5px 12px; font-size: .85rem; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; font-size: .82rem; }
.stat { background: var(--wood3); border-radius: 8px; padding: 4px 9px; color: var(--soft2); }
.stat b { color: var(--soft); font-variant-numeric: tabular-nums; }
.panel { background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px; box-shadow: 0 3px 0 var(--paper3), 0 10px 22px #0007; }
.panel h3 { font-size: 1rem; }
.muted { color: var(--muted); } .small { font-size: .8rem; }

/* plots */
.plot { position: relative; width: 100%; height: 100%; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px #0002; }
.t-D { background: var(--tD); background-image: linear-gradient(35deg, transparent 46%, #b9a98288 47%, transparent 49%), linear-gradient(-50deg, transparent 60%, #b9a98288 61%, transparent 63%); }
.t-C { background: var(--tC); background-image: radial-gradient(ellipse at 50% 85%, #b3532088 0 30%, transparent 32%), radial-gradient(ellipse at 30% 70%, #f3925a66 0 18%, transparent 20%); }
.t-M { background: var(--tM); background-image: radial-gradient(circle at 25% 30%, #a3d86a 0 8%, transparent 9%), radial-gradient(circle at 70% 65%, #6fae3c 0 10%, transparent 11%); }
.t-F { background: var(--tF); background-image: linear-gradient(135deg, transparent 40%, #1c3f24 41% 59%, transparent 60%), linear-gradient(45deg, transparent 40%, #3b7340 41% 50%, transparent 51%); background-size: 14px 14px; }
.t-K { background: var(--tK); background-image: repeating-linear-gradient(90deg, #d9a51b 0 2px, transparent 2px 7px); }
.t-A { background: var(--tA); background-image: linear-gradient(0deg, #6c3f22 0 28%, transparent 28%), linear-gradient(90deg, transparent 30%, #b8452e 30% 70%, transparent 70%); background-size: 100% 100%, 100% 46%; background-position: 0 0, 0 52%; background-repeat: no-repeat; }
.plot .syms { position: absolute; top: 2px; left: 2px; display: flex; gap: 1px; }
.plot .res { position: absolute; bottom: 2px; left: 2px; display: flex; gap: 1px; align-items: center; font: 700 .62rem var(--ui); color: #fff; text-shadow: 0 1px 1px #000; }
.ic { width: 16px; height: 16px; display: block; }
.ic.sym { filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000); }
.ring { position: absolute; left: 50%; top: 50%; width: 52%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 2px solid #fff; border-radius: 50%; opacity: .9; }
.cows { position: absolute; right: 2px; bottom: 2px; display: flex; align-items: center; gap: 1px; font: 800 .7rem var(--ui); color: #fff; text-shadow: 0 1px 1px #000; }
.cows .ic { width: 24px; height: 24px; filter: drop-shadow(0 1px 0 #fff) drop-shadow(0 0 1px #000); }
.num { position: absolute; top: 1px; right: 3px; font: 400 .7rem var(--west); color: #fff; text-shadow: 0 1px 1px #000, 0 0 3px #000; }
.used { opacity: .35; }
.tok { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 60%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font: 700 .64rem var(--hand); color: #fff; text-shadow: 0 1px 1px #000a; border: 2px solid #fff; box-shadow: 0 2px 4px #0007; }
.tk-cowboy { background: radial-gradient(circle at 50% 70%, #3a2416 0 22%, transparent 23%), linear-gradient(#f7a33a, #d9531f); }
.tk-gold, .tk-trapper, .tk-farmer { background: linear-gradient(#5aa6e0, #2c6fb0); }
.tk-thief, .tk-desp { background: linear-gradient(#e2685a, #b33227); }
.tokbig { position: relative; width: 52px; height: 52px; flex: 0 0 auto; }
.tokbig .tok { width: 100%; font-size: .8rem; }

/* market */
.market { display: grid; grid-template-columns: auto auto 1fr; gap: 12px; align-items: start; }
.mcol { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.mcol h3, .saloon h3 { font-size: .85rem; white-space: nowrap; }
.mslot { position: relative; width: 58px; height: 58px; border-radius: 7px; background: #0000000f; }
.mslot.can { cursor: pointer; box-shadow: 0 0 0 3px var(--red); animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px #b8402a55; } }
.pawn { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -40%); width: 22px; height: 28px; z-index: 2; filter: drop-shadow(0 2px 2px #000a); }
.saloon { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.saloon .toks { display: flex; flex-wrap: wrap; gap: 6px; }
.saloon .tokbig { width: 46px; height: 46px; }
.mnote { font-size: .76rem; color: var(--muted); line-height: 1.4; }

.players { display: flex; gap: 8px; flex-wrap: wrap; }
.pchip { display: flex; align-items: center; gap: 7px; background: var(--wood3); color: var(--soft); border: 0; border-radius: 10px; padding: 6px 10px; font-size: .85rem; }
.pchip.viewing { box-shadow: inset 0 0 0 2px var(--soft2); }
.pchip.active { background: #6a3f22; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #0006; flex: 0 0 auto; }
.pchip b { font-variant-numeric: tabular-nums; }

/* ranch */
.ranch { display: flex; flex-direction: column; align-items: center; gap: 0; }
.rhead { display: flex; justify-content: space-between; align-items: baseline; width: 100%; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.rhead h2 { font-size: 1.15rem; display: flex; gap: 8px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; width: 100%; max-width: 340px; padding: 3px; background: #c9a86844; border-radius: 8px 8px 0 0; }
.cell { aspect-ratio: 1; border-radius: 6px; position: relative; min-width: 0; }
.cell.empty { background: #fff3; box-shadow: inset 0 0 0 1px #8a6a3a44; }
.cell.bridge::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -3px; height: 7px; background: repeating-linear-gradient(90deg, #6b4122 0 4px, #8b5a30 4px 7px); border-radius: 2px; z-index: 2; }
.cell.bridge.empty { box-shadow: inset 0 0 0 1.5px #3d9ad1aa; }
.cell.bump { background: linear-gradient(90deg, transparent 32%, var(--river) 32% 68%, transparent 68%), #d9bd85; border-radius: 6px 6px 0 0; }
.cell.bump::before { content: ""; position: absolute; left: 50%; top: 50%; width: 46%; height: 34%; transform: translate(-50%, -50%); background: #fbf3e0; border-radius: 40% 40% 6px 6px; box-shadow: 0 0 0 2px #6b4122; }
.cell.cand { cursor: pointer; box-shadow: inset 0 0 0 3px var(--red); background: #fff8; animation: pulse 1.3s ease-in-out infinite; }
.cell.sel1 .plot, .cell.ghost .plot { opacity: .75; outline: 3px dashed var(--ink); outline-offset: -3px; }
.cell.src { cursor: pointer; }
.cell.src .plot { box-shadow: 0 0 0 3px var(--sun); }
.cell.from .plot { box-shadow: 0 0 0 3px var(--red); }
.cell.dst { cursor: pointer; }
.cell.dst .plot { box-shadow: 0 0 0 3px var(--river); }
.board { width: 100%; max-width: 340px; background: #d9bd85; border-radius: 0 0 10px 10px; padding: 10px 8px 8px; position: relative; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.board::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(var(--river), var(--river2)); }
.storage { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.sslot { width: 56px; height: 56px; border-radius: 7px; background: #b8995e; box-shadow: inset 0 0 0 2px #8a6a3a; position: relative; border: 0; padding: 0; }
.sslot.over { box-shadow: inset 0 0 0 2px var(--red); background: #e8b9a0; }
.sslot.pick { cursor: pointer; }
.sslot.on .plot { box-shadow: 0 0 0 3px var(--red); transform: translateY(-4px); }
.sslot .badge { position: absolute; top: -8px; left: -6px; background: var(--red); color: #fff; border-radius: 50%; width: 18px; height: 18px; font: 700 .7rem/18px var(--ui); text-align: center; z-index: 3; }
.board .bname { font-size: .78rem; color: var(--muted); }
.scorebox { width: 100%; font-size: .82rem; line-height: 1.5; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.scorebox b { font-variant-numeric: tabular-nums; }

.log { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--soft2); max-height: 220px; overflow-y: auto; }
.log div:first-child { color: var(--soft); }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #1e110aee; backdrop-filter: blur(6px); border-top: 1.5px solid #ffffff1a;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar .in { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.bar .t { font-size: .95rem; line-height: 1.4; }
.bar .t b { color: var(--sun); }
.bar .hint { font-size: .8rem; color: var(--soft2); line-height: 1.4; }
.bar .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; background: var(--sun); color: var(--ink); }
.btn.alt { background: transparent; color: var(--soft); box-shadow: inset 0 0 0 1.5px #ffffff44; }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }

.modal { position: fixed; inset: 0; z-index: 30; background: #120804d9; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { background: var(--paper); color: var(--ink); width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { font-size: 1.35rem; }
.sheet p { margin: 0; line-height: 1.5; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
@keyframes fade { from { opacity: 0; } }
.opt { display: flex; gap: 10px; align-items: center; background: #fbf1da; border-radius: 10px; padding: 8px; box-shadow: inset 0 0 0 1.5px var(--line); }
.opt .txt { min-width: 0; flex: 1; font-size: .85rem; line-height: 1.4; }
.opt .txt b { font-size: .95rem; }
.opt .btns { display: flex; flex-direction: column; gap: 6px; }
.opt .btns .btn { padding: 7px 10px; font-size: .82rem; }
.target { display: flex; gap: 8px; align-items: center; background: #fbf1da; border: 0; border-radius: 10px; padding: 6px 10px; text-align: left; color: var(--ink); width: 100%; }
.target .mini { width: 40px; height: 40px; flex: 0 0 auto; }
.rules h3 { font-size: 1.05rem; margin-top: 6px; }
.rules ol, .rules ul { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; line-height: 1.55; font-size: .9rem; }
.rules p { font-size: .9rem; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; font-size: .82rem; }
.legend div { display: flex; gap: 6px; align-items: center; }
.legend .sw { width: 30px; height: 30px; flex: 0 0 auto; }
.tablewrap { overflow-x: auto; }
table.res { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
table.res th, table.res td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.res th:first-child, table.res td:first-child { text-align: left; }
table.res tr.win td { font-weight: 800; }
.setup { display: flex; flex-direction: column; gap: 14px; }
.seatrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seatrow input { font: inherit; border: 1.5px solid var(--paper3); border-radius: 8px; padding: 6px 8px; background: #fbf1da; color: var(--ink); width: 120px; min-width: 0; }
.seg { display: inline-flex; border-radius: 9px; overflow: hidden; box-shadow: inset 0 0 0 1.5px var(--ink); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 6px 12px; font-size: .88rem; }
.seg button.on { background: var(--ink); color: var(--paper); }
.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; background: var(--sun); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: .9rem; max-width: 90vw; text-align: center; animation: toast 2.6s ease-out forwards; pointer-events: none; }
@keyframes toast { 0% { opacity: 0; } 10%, 85% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rint = (n) => Math.floor(Math.random() * n);
const W = 5;
const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];

const TYPES = { D: '沙漠', C: '峽谷', M: '草原', F: '森林', K: '玉米田', A: '農場' };
const ROLE = {
  cowboy: { n: '牛仔', s: '牛仔', d: '放下時：在你的牧場移動牛最多 3 步（每步走到相鄰地塊，不能進玉米田）。' },
  gold: { n: '淘金客', s: '淘金', d: '結束時：你牧場每個金塊再 +1 分。' },
  trapper: { n: '捕獸人', s: '捕獸', d: '結束時：你牧場每個河狸再 +1 分。' },
  farmer: { n: '農夫', s: '農夫', d: '結束時：你牧場每根玉米再 +1 分。' },
  thief: { n: '偷牛賊', s: '偷牛', d: '放下時：從別人牧場偷 1 頭沒被保護的牛，放到這塊地上。' },
  desp: { n: '亡命徒', s: '亡命', d: '放下時：用你儲存區 1 塊地，換別人儲存區 1 塊地。' },
};
const BOARDS = {
  camp: { n: '營地', cap: 3, br: ['up', 'left', 'right'] },
  mary: { n: '瑪麗', cap: 4, br: ['up'] },
  wesley: { n: '衛斯理', cap: 3, br: ['up', 'left'] },
  calamity: { n: '卡拉米蒂', cap: 3, br: ['up', 'right'] },
  bigjo: { n: '大喬', cap: 2, br: ['up', 'left', 'right'] },
};
const SEATS = [
  { color: '#7b4fa8', cn: '紫', ch: 'mary' },
  { color: '#e0782f', cn: '橘', ch: 'calamity' },
  { color: '#2f8a4e', cn: '綠', ch: 'bigjo' },
  { color: '#efe9dc', cn: '白', ch: 'wesley' },
];
const SCEN = {
  1: { n: '木材漂流', d: '至少 3 塊相連的森林、且其中至少 1 塊碰到河：10 分，每多 1 塊森林 +10。' },
  2: { n: '淘金熱', d: '至少 3 塊相連、都有金塊的地（金脈）：10 分，每多 1 個金塊 +10。' },
  3: { n: '亡命之徒', d: '至少 3 個相連的夥伴、其中至少 1 個是亡命徒或偷牛賊（幫派）：10 分，每多 1 個夥伴 +10。' },
  4: { n: '月河鎮', d: '至少 3 塊相連的農場（城鎮）：10 分，每多 1 塊農場 +10。' },
};

const IC = {
  cow: (c = '#fff') => `<svg class="ic" viewBox="0 0 24 18"><path fill="${c}" d="M2 6.5 4.5 4h12l2-2.5h2.5l1 2-1 2.2-1.6.6V11l-1 1v4h-2.3v-3.5H8V16H5.7v-4L4.5 11 3.8 8.4 2 9z"/></svg>`,
  skull: () => `<svg class="ic sym" viewBox="0 0 20 20"><path fill="#fff" stroke="#2e1c10" stroke-width="1.3" fill-rule="evenodd" d="M1 3c2 1 3 2 4 2h10c1 0 2-1 4-2-1 2-1.5 3.5-3.5 4.5L14 15c-.5 2-2 3-4 3s-3.5-1-4-3L4.5 7.5C2.5 6.5 2 5 1 3zm6 5.5a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zm6 0a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8z"/></svg>`,
  nug: () => `<svg class="ic" viewBox="0 0 20 20"><path fill="#f6c935" stroke="#7a5a10" stroke-width="1.2" d="M3 13.5 6 6l5.5-2.5L17 8l-1 6.5L9.5 17z"/><path fill="#fff6" d="M7 8l3-2 1 2-3 2z"/></svg>`,
  bea: () => `<svg class="ic" viewBox="0 0 22 18"><ellipse cx="17" cy="12.5" rx="4" ry="2.4" fill="#4a2c16"/><ellipse cx="9" cy="10" rx="7" ry="5" fill="#8a5428" stroke="#3a210f" stroke-width="1"/><circle cx="4" cy="7" r="2.6" fill="#8a5428" stroke="#3a210f" stroke-width="1"/></svg>`,
  corn: () => `<svg class="ic" viewBox="0 0 16 20"><ellipse cx="8" cy="8" rx="3.6" ry="6.5" fill="#ffd84a" stroke="#9a7410" stroke-width="1"/><path d="M8 19C4 16 2.5 12 3 8c2 3 4.5 6 5 11zM8 19c4-3 5.5-7 5-11-2 3-4.5 6-5 11z" fill="#4c9a32"/></svg>`,
  pawn: (c) => `<svg class="pawn" viewBox="0 0 22 28"><path fill="${c}" stroke="#000" stroke-width="1.2" d="M11 1.5a4 4 0 0 1 4 4 4 4 0 0 1-1.6 3.2L19 12v3l-3.5-1.2L18 26H4l2.5-12.2L3 15v-3l5.6-3.3A4 4 0 0 1 7 5.5a4 4 0 0 1 4-4z"/><path d="M5 5.5h12" stroke="#000" stroke-width="2.2"/></svg>`,
};

// ---------------- plots ----------------
let uid = 1;
function makePlots() {
  const L = [];

async function runInner() {
  const g = S.gid;
  const askG = async (pr) => { const v = await ask(pr); if (!S || S.gid !== g) throw 'stop'; return v; };
  S.colA = drawColumn();
  const seq = S.n === 2 ? (() => { const f = rint(2); return [f, 1 - f, 1 - f, f]; })() : shuffle(S.players.map((_, i) => i));
  log('抽牧場主：照順序在第一排地塊上選位置。數字越小，下一輪越早行動。');
  for (const p of seq) {
    S.active = p;
    let k;
    if (P(p).human) k = await askG({ type: 'pick', p, col: 'A' });
    else { render(); await nap(500); k = botPickSlot(p, S.colA); }
    S.colA[k].r = p; log(`${nm(p)} 選了 ${S.colA[k].plot.num} 號（${TYPES[S.colA[k].plot.t]}）`);
  }
  S.colB = drawColumn();
  while (true) {
    S.round++; S.final = !S.colB;
    log(S.final ? '— 最後一輪！拿地、擴建，不再選新地 —' : `— 第 ${S.round} 輪 —`);
    for (let k = 0; k < 4; k++) {
      const slot = S.colA[k];
      if (slot.r == null) continue;
      const p = slot.r, pl = P(p);
      S.active = p;
      const plot = slot.plot; slot.plot = null; slot.r = null; pl.storage.push(plot);
      log(`${pl.name} 收下 ${plot.num} 號${TYPES[plot.t]}`);
      if (pl.human) await humanExpand(p, false);
      else { render(); await nap(450); await botExpand(p, false); }
      if (S.colB) {
        let k2;
        if (pl.human) k2 = await askG({ type: 'pick', p, col: 'B' });
        else { render(); await nap(400); k2 = botPickSlot(p, S.colB); }
        S.colB[k2].r = p; log(`${pl.name} 選了下一輪的 ${S.colB[k2].plot.num} 號（${TYPES[S.colB[k2].plot.t]}）`);
      }
      render();
    }
    if (S.final) break;
    refillSaloon();
    S.colA = S.colB;
    S.colB = S.pile.length >= 4 ? drawColumn() : null;
    if (!S.colB) { refillSaloon(); log('牌堆用完了，下一輪是最後一輪。'); }
  }
  log('最後擴建：每個人必須把儲存區的地盡量放進牧場。');
  for (let i = 0; i < S.n; i++) {
    S.active = i;
    if (P(i).human) await humanExpand(i, true);
    else { render(); await nap(300); await botExpand(i, true); }
  }
  // overpopulation
  S.players.forEach(pl => { let k = 0; pl.grid.forEach(row => row.forEach(p => { if (p && p.cowsOn > 1) { k += p.cowsOn - 1; S.cows += p.cowsOn - 1; p.cowsOn = 1; } })); if (k) log(`${pl.name} 牛太擠，移除 ${k} 頭（每塊地最多 1 頭）`); });
  S.active = null; S.over = true;
  const rows = S.players.map((pl, i) => ({ i, s: score(pl.grid) })).sort((a, b) => b.s.total - a.s.total || b.s.largest - a.s.largest || b.s.cows - a.s.cows);
  S.result = rows;
  log(`遊戲結束！${nm(rows[0].i)} 獲勝，${rows[0].s.total} 分`);
  ask({ type: 'end', rows });
}

// ---------------- rendering ----------------
function plotHTML(p, o = {}) {
  if (!p) return '';
  const syms = [];
  for (let k = 0; k < p.cow; k++) syms.push(IC.cow('#fff').replace('class="ic"', 'class="ic sym"'));
  if (p.skull) syms.push(p.skullUsed ? IC.skull().replace('class="ic sym"', 'class="ic sym used"') : IC.skull());
  const res = [];
  if (p.nug) res.push(IC.nug());
  for (let k = 0; k < p.bea; k++) res.push(IC.bea());
  if (p.corn) res.push(IC.corn() + `×${p.corn}`);
  const center = p.partner ? `<div class="tok tk-${role(p)}">${ROLE[role(p)].s}</div>` : (p.circle ? '<div class="ring"></div>' : '');
  const cows = p.cowsOn ? `<div class="cows">${IC.cow('#4a2410')}${p.cowsOn > 1 ? '×' + p.cowsOn : ''}</div>` : '';
  return `<div class="plot t-${p.t}" title="${TYPES[p.t]}">${syms.length ? `<div class="syms">${syms.join('')}</div>` : ''}${center}${res.length ? `<div class="res">${res.join('')}</div>` : ''}${cows}${o.num ? `<span class="num">${p.num}</span>` : ''}</div>`;
}
const tokHTML = (spec, side = 'spec') => { const r = side === 'cowboy' ? 'cowboy' : spec; return `<div class="tokbig"><div class="tok tk-${r}">${ROLE[r].s}</div></div>`; };

function render() {
  if (!S) return renderSetup();
  const app = $('#app');
  const pr = S.prompt;
  const colHTML = (col, key) => col ? col.map((s, k) => {
    const can = pr && pr.type === 'pick' && pr.col === key && s.plot && s.r == null;
    return `<div class="mslot ${can ? 'can' : ''}" ${can ? `data-pick="${k}" role="button" tabindex="0"` : ''}>${plotHTML(s.plot, { num: true })}${s.r != null ? IC.pawn(P(s.r).color) : ''}</div>`;
  }).join('') : '<div class="mnote">牌堆用完</div>';
  app.innerHTML = `
  <div class="top"><h1>河畔牧場<small>月之河畔規則</small></h1>
    <div style="display:flex;gap:6px"><button class="pill" id="rulesBtn">規則</button><button class="pill" id="quitBtn">重新開始</button></div></div>
  <div class="stats"><span class="stat">${S.final ? '最後一輪' : `第 <b>${S.round || 0}</b> 輪`}</span><span class="stat">牌堆 <b>${S.pile.length}</b> 塊</span><span class="stat">牛 <b>${S.cows}</b> 頭</span>
    ${S.variant === 'legends' ? `<span class="stat">劇本 <b>${SCEN[S.scenario].n}</b></span>` : ''}</div>
  <div class="panel market">
    <div class="mcol"><h3>這一輪</h3>${colHTML(S.colA, 'A')}</div>
    <div class="mcol"><h3>下一輪</h3>${colHTML(S.colB, 'B')}</div>
    <div class="saloon"><h3>酒館（夥伴）</h3><div class="toks">${S.saloon.map(t => tokHTML(t.spec)).join('') || '<span class="mnote">空了</span>'}</div>
      <div class="mnote">還有 ${S.stack.length} 個在門口。<br>行動順序 = 這一輪地塊由上到下（數字小的先）。</div></div>
  </div>
  <div class="players">${S.players.map((pl, i) => `<button class="pchip ${S.view === i ? 'viewing' : ''} ${S.active === i ? 'active' : ''}" data-view="${i}">
    <span class="dot" style="background:${pl.color}"></span>${esc(pl.name)}${S.variant === 'legends' ? `（${pl.bname}）` : ''} <b>${score(pl.grid).total}</b> 分 · 存 ${pl.storage.length}</button>`).join('')}</div>
  ${ranchHTML(S.view)}
  <div style="display:flex;flex-direction:column;gap:6px"><h3 style="color:var(--soft)">紀錄</h3><div class="log">${S.log.map(l => `<div>${esc(l)}</div>`).join('')}</div></div>`;
  $('#rulesBtn').onclick = showRules;
  $('#quitBtn').onclick = confirmQuit;
  app.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.view = +b.dataset.view; UI = pr && pr.p === S.view ? UI : UI; render(); });
  app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => answer(+b.dataset.pick));
  app.querySelectorAll('[data-st]').forEach(b => b.onclick = () => clickStorage(+b.dataset.st));
  app.querySelectorAll('[data-cell]').forEach(b => b.onclick = () => { const [r, c] = b.dataset.cell.split(',').map(Number); clickCell(r, c); });
  renderBar(); renderSheet();
}

function candidates(pl) {
  const pr = S.prompt; const out = { cand: new Set(), ghost: {} };
  if (!pr || pr.p !== S.view) return out;
  if (pr.type === 'expand' && UI.sel && UI.sel.length === 2) {
    const a = pl.storage[UI.sel[0]], b = pl.storage[UI.sel[1]];
    if (UI.c1 == null) { for (let r = 0; r < S.R; r++) for (let c = 0; c < W; c++) if (DIRS.some(([dr, dc]) => validDom(pl, a, b, r, c, r + dr, c + dc))) out.cand.add(r + ',' + c); }
    else if (UI.c2 == null) { const [r, c] = UI.c1; out.ghost[r + ',' + c] = a; for (const [dr, dc] of DIRS) if (validDom(pl, a, b, r, c, r + dr, c + dc)) out.cand.add((r + dr) + ',' + (c + dc)); }
    else { out.ghost[UI.c1.join(',')] = a; out.ghost[UI.c2.join(',')] = b; }
  }
  if (pr.type === 'bonusCell') pr.cells.forEach(([r, c]) => out.cand.add(r + ',' + c));
  return out;
}

function ranchHTML(i) {
  const pl = P(i), pr = S.prompt, mine = pr && pr.p === i;
  const cd = candidates(pl);
  const cowboy = mine && pr.type === 'cowboy';
  const srcs = new Set(), dsts = new Set();
  if (cowboy) {
    cowMoves(pl).forEach(([r, c, x, y]) => { srcs.add(r + ',' + c); if (UI.from && UI.from[0] === r && UI.from[1] === c) dsts.add(x + ',' + y); });
  }
  let cells = '';
  for (let r = 0; r < S.R; r++) for (let c = 0; c < W; c++) {
    const key = r + ',' + c;
    if (isBump(r, c)) { cells += '<div class="cell bump" title="河上的篷車"></div>'; continue; }
    const p = pl.grid[r][c], br = isBridge(pl, r, c) ? ' bridge' : '';
    if (p) {
      let cls = '';
      if (cowboy && UI.from && UI.from[0] === r && UI.from[1] === c) cls = ' from';
      else if (cowboy && dsts.has(key)) cls = ' dst';
      else if (cowboy && srcs.has(key) && !UI.from) cls = ' src';
      const click = cls && cls !== ' from' ? `data-cell="${key}" role="button"` : (cls === ' from' ? `data-cell="${key}"` : '');
      cells += `<div class="cell${br}${cls}" ${click}>${plotHTML(p)}</div>`;
    } else if (cd.ghost[key]) cells += `<div class="cell ghost${br}" data-cell="${key}">${plotHTML(cd.ghost[key])}</div>`;
    else if (cd.cand.has(key)) cells += `<div class="cell empty cand${br}" data-cell="${key}" role="button" tabindex="0"></div>`;
    else cells += `<div class="cell empty${br}"></div>`;
  }
  const canSel = mine && ['expand', 'discard'].includes(pr.type);
  const slots = [];
  for (let k = 0; k < Math.max(pl.cap, pl.storage.length); k++) {
    const p = pl.storage[k];
    const on = UI.sel && UI.sel.includes(k);
    const badge = on && pr.type === 'expand' ? `<span class="badge">${UI.sel.indexOf(k) + 1}</span>` : (on ? '<span class="badge">×</span>' : '');
    slots.push(`<button class="sslot ${k >= pl.cap ? 'over' : ''} ${p && canSel ? 'pick' : ''} ${on ? 'on' : ''}" ${p && canSel ? `data-st="${k}"` : 'disabled'} aria-label="儲存區">${badge}${plotHTML(p)}</button>`);
  }
  const s = score(pl.grid);
  return `<div class="panel ranch">
    <div class="rhead"><h2><span class="dot" style="background:${pl.color}"></span>${esc(pl.name)} 的牧場</h2><span class="small muted">${S.variant === 'legends' ? `角色：${pl.bname} · ` : ''}藍框格子＝橋（可以直接接）</span></div>
    <div class="grid">${cells}</div>
    <div class="board"><div class="storage">${slots.join('')}</div><span class="bname">儲存區（最多 ${pl.cap} 塊）</span></div>
    <div class="scorebox"><span>領地 <b>${s.terr}</b></span><span>資源 <b>${s.res}</b></span><span>夥伴 <b>${s.partner}</b></span>${S.variant === 'legends' ? `<span>劇本 <b>${s.scen}</b></span>` : ''}<span>目前 <b>${s.total}</b> 分</span></div>
  </div>`;
}

function clickStorage(k) {
  const pr = S.prompt; if (!pr) return;
  UI.sel = UI.sel || [];
  if (UI.sel.includes(k)) UI.sel = UI.sel.filter(x => x !== k);
  else if (UI.sel.length < 2) UI.sel.push(k);
  else UI.sel = [UI.sel[1], k];
  UI.c1 = UI.c2 = null;
  render();
}
function clickCell(r, c) {
  const pr = S.prompt; if (!pr) return;
  if (pr.type === 'expand') {
    if (UI.c1 && UI.c1[0] === r && UI.c1[1] === c) { UI.c1 = UI.c2 = null; }
    else if (UI.c1 == null) UI.c1 = [r, c];
    else if (UI.c2 == null) UI.c2 = [r, c];
    render();
  } else if (pr.type === 'cowboy') {
    if (UI.from && UI.from[0] === r && UI.from[1] === c) { UI.from = null; render(); return; }
    if (!UI.from) { UI.from = [r, c]; render(); return; }
    answer([UI.from[0], UI.from[1], r, c]);
  } else if (pr.type === 'bonusCell') answer([r, c]);
}

function renderBar() {
  const bar = $('#bar'), inn = $('#barIn'), pr = S.prompt;
  bar.hidden = false;
  if (S.over && (!pr || pr.type !== 'end')) {
    inn.innerHTML = `<div class="t">遊戲結束</div><div class="btns"><button class="btn" id="bShow">看結果</button><button class="btn alt" id="bAgain">再玩一次</button></div>`;
    $('#bShow').onclick = () => { S.prompt = { type: 'end', rows: S.result }; renderSheet(); };
    $('#bAgain').onclick = () => { S = null; render(); };
    return;
  }
  const who = pr && pr.p != null ? `<b>${esc(nm(pr.p))}</b>` : '';
  let html = '';
  if (pr && pr.type === 'pick') {
    html = `<div class="t">${who}：${pr.col === 'A' ? '把牧場主放到第一排的一塊地上' : '選一塊下一輪要拿的地'}（點發光的地塊）</div>
      <div class="hint">數字越小，下一輪越早行動；數字大的地通常比較好。${S.n === 3 ? '3 人時沒人選的那塊會被移除。' : ''}</div>`;
  } else if (pr && pr.type === 'expand') {
    const pl = P(pr.p), sel = UI.sel || [];
    const canDone = !pr.over && !(pr.final && allMoves(pl).length);
    if (sel.length < 2) {
      html = `<div class="t">${who}：${pr.final ? '最後擴建，能放的骨牌都要放' : '要擴建牧場嗎？'}點儲存區的 <b>兩塊地</b> 組成骨牌</div>
        <div class="hint">${pr.over ? '儲存區滿了，這回合一定要放一張骨牌。' : '骨牌要接在橋上（藍框格子），或至少有一塊和旁邊同地形相連。'}</div>
        <div class="btns"><button class="btn" id="bDone" ${canDone ? '' : 'disabled'}>${pr.final ? '完成' : '不擴建，選下一塊地'}</button></div>`;
    } else {
      const a = pl.storage[sel[0]], b = pl.storage[sel[1]];
      const any = movesFor(pl, a, b).length;
      if (!any) html = `<div class="t">這兩塊（${TYPES[a.t]}＋${TYPES[b.t]}）沒地方可以放，換別的組合試試。</div><div class="btns"><button class="btn alt" id="bReset">重選</button><button class="btn alt" id="bSwap">對調</button></div>`;
      else if (!UI.c1) html = `<div class="t">點牧場上發光的格子，放第 1 塊（${TYPES[a.t]}）</div><div class="btns"><button class="btn alt" id="bSwap">對調兩塊</button><button class="btn alt" id="bReset">重選</button></div>`;
      else if (!UI.c2) html = `<div class="t">再點旁邊發光的格子，放第 2 塊（${TYPES[b.t]}）</div><div class="btns"><button class="btn alt" id="bReset">重選</button></div>`;
      else html = `<div class="t">放在這裡嗎？（${TYPES[a.t]}＋${TYPES[b.t]}）</div><div class="btns"><button class="btn" id="bPlace">確定放置</button><button class="btn alt" id="bReset">重選位置</button></div>`;
    }
  } else if (pr && pr.type === 'discard') {
    const sel = UI.sel || [];
    html = `<div class="t">${who}：儲存區滿了又放不下骨牌，必須丟掉 <b>2 塊</b>（點選兩塊）</div><div class="btns"><button class="btn" id="bDiscard" ${sel.length === 2 ? '' : 'disabled'}>丟掉這兩塊</button></div>`;
  } else if (pr && pr.type === 'cowboy') {
    html = `<div class="t">${who} 的牛仔：還能移動 <b>${pr.left}</b> 步。先點一頭牛（黃框），再點旁邊的地塊（藍框）。</div>
      <div class="hint">不能進玉米田。結束時每塊地只算 1 頭牛，多的牛可以趕到沒牛的地。</div><div class="btns"><button class="btn alt" id="bCbDone">不移了</button></div>`;
  } else if (pr && pr.type === 'bonusCell') {
    html = `<div class="t">${who}：點發光的格子放上地形獎勵板塊（${TYPES[pr.plot.t]}，有圓圈）</div><div class="btns"><button class="btn alt" id="bSkip">放棄</button></div>`;
  } else {
    html = `<div class="t">${S.active != null ? esc(nm(S.active)) + ' 行動中…' : '…'}</div><div class="hint">${esc(S.log[0] || '')}</div>`;
  }
  inn.innerHTML = html;
  const on = (id, f) => { const b = $('#' + id); if (b) b.onclick = f; };
  on('bDone', () => answer('done'));
  on('bReset', () => { UI.c1 = UI.c2 = null; if (!UI.c1 && !UI.c2 && UI.sel && UI.sel.length === 2 && !movesFor(P(pr.p), P(pr.p).storage[UI.sel[0]], P(pr.p).storage[UI.sel[1]]).length) UI.sel = []; render(); });
  on('bSwap', () => { UI.sel = [UI.sel[1], UI.sel[0]]; UI.c1 = UI.c2 = null; render(); });
  on('bPlace', () => { const pl = P(pr.p); answer({ a: pl.storage[UI.sel[0]], b: pl.storage[UI.sel[1]], r1: UI.c1[0], c1: UI.c1[1], r2: UI.c2[0], c2: UI.c2[1] }); });
  on('bDiscard', () => { const pl = P(pr.p); answer(UI.sel.map(k => pl.storage[k].id)); });
  on('bCbDone', () => answer(null));
  on('bSkip', () => answer(null));
}

// ---------------- sheets ----------------
function closeSheet() { const m = $('#modal'); if (m) m.remove(); }
function openSheet(html, keep) { closeSheet(); const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal'; if (keep) m.dataset.keep = '1'; m.innerHTML = `<div class="sheet">${html}</div>`; document.body.appendChild(m); return m; }
function renderSheet() {
  const pr = S && S.prompt, open = $('#modal');
  const sheetTypes = { recruit: sheetRecruit, thief: sheetThief, desp: sheetDesp, bonus: sheetBonus, end: sheetEnd };
  if (!pr || !sheetTypes[pr.type]) { if (open && !open.dataset.keep) closeSheet(); return; }
  if (open && open.dataset.for === pr.type) return;
  const m = sheetTypes[pr.type](pr); if (m) m.dataset.for = pr.type;
}
function sheetRecruit(pr) {
  const m = openSheet(`<h2>到酒館招募夥伴</h2>
    <p class="small muted">選一位夥伴放到圓圈地塊上。可以用「專家面」，或翻成「牛仔」。每位夥伴都會保護所在領地的牛，偷牛賊偷不走。</p>
    ${S.saloon.map(t => `<div class="opt">${tokHTML(t.spec)}<div class="txt"><b>${ROLE[t.spec].n}</b><br>${ROLE[t.spec].d}</div>
      <div class="btns"><button class="btn dark" data-id="${t.id}" data-side="spec">選${ROLE[t.spec].s}</button><button class="btn ghost" data-id="${t.id}" data-side="cowboy">翻成牛仔</button></div></div>`).join('')}
    <p class="small muted">牛仔：${ROLE.cowboy.d}</p>`);
  m.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { closeSheet(); answer({ id: +b.dataset.id, side: b.dataset.side }); });
  return m;
}
function sheetThief(pr) {
  const i = pr.p;
  const m = openSheet(`<h2>偷牛賊：偷誰的牛？</h2><p class="small muted">只能偷沒有夥伴保護的領地。偷來的牛放在偷牛賊這塊地上。</p>
    ${pr.ts.map((t, k) => `<button class="target" data-k="${k}"><span class="mini">${plotHTML(t.p)}</span><span><b>${esc(nm(t.j))}</b> 的${TYPES[t.p.t]}（這塊有 ${t.p.cowsOn} 頭）<br><span class="small muted">對方大約少 ${Math.round(stealValue(i, t, null))} 分</span></span></button>`).join('')}
    <button class="btn ghost" id="no">不偷</button>`);
  m.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { closeSheet(); answer(+b.dataset.k); });
  $('#no', m).onclick = () => { closeSheet(); answer(null); };
  return m;
}
function sheetDesp(pr) {
  const pl = P(pr.p); let mine = null, theirs = null;
  const others = S.players.map((q, j) => j).filter(j => j !== pr.p && P(j).storage.length);
  const m = openSheet(`<h2>亡命徒：交換地塊</h2><p class="small muted">先選你儲存區的一塊，再選別人儲存區的一塊。</p>
    <b class="small">你的儲存區</b><div class="storage" id="mine">${pl.storage.map((p, k) => `<button class="sslot pick" data-m="${k}">${plotHTML(p)}</button>`).join('')}</div>
    ${others.map(j => `<b class="small">${esc(nm(j))} 的儲存區</b><div class="storage">${P(j).storage.map((p, k) => `<button class="sslot pick" data-j="${j}" data-t="${k}">${plotHTML(p)}</button>`).join('')}</div>`).join('')}
    <div class="row"><button class="btn dark" id="ok" disabled>交換</button><button class="btn ghost" id="no">不交換</button></div>`);
  const upd = () => { m.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', +b.dataset.m === mine)); m.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', theirs && +b.dataset.j === theirs.j && +b.dataset.t === theirs.k)); $('#ok', m).disabled = mine == null || !theirs; };
  m.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mine = +b.dataset.m; upd(); });
  m.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { theirs = { j: +b.dataset.j, k: +b.dataset.t }; upd(); });
  $('#ok', m).onclick = () => { closeSheet(); answer({ mine, j: theirs.j, theirs: theirs.k }); };
  $('#no', m).onclick = () => { closeSheet(); answer(null); };
  return m;
}
function sheetBonus(pr) {

    ${S.bonus.map((t, k) => `<div class="row">${[0, 1].map(s => `<button class="sslot pick" data-k="${k}" data-s="${s}" style="width:64px;height:64px">${plotHTML(fake(t[s]))}</button><span class="small">${TYPES[t[s]]}</span>`).join('')}</div>`).join('')}`);

}

    ${rows.map(r => `<details><summary><b>${esc(nm(r.i))}</b> 的計分細節</summary><p class="small">${r.s.terrList.join('<br>') || '沒有有牛的領地'}<br>金塊 ${r.s.nug}、河狸 ${r.s.bea}、玉米 ${r.s.corn}<br>
      夥伴：淘金客 ×${r.s.gd}、捕獸人 ×${r.s.tr}、農夫 ×${r.s.fa} → +${r.s.partner}<br>最大領地 ${r.s.largest} 塊、牛 ${r.s.cows} 頭（平手時比這兩項）</p></details>`).join('')}
    <div class="row"><button class="btn dark" id="again">再玩一次</button><button class="btn ghost" id="close">看牧場</button></div>`);
  $('#again', m).onclick = () => { closeSheet(); S = null; render(); };

}
function confirmQuit() {
  const m = openSheet(`<h2>重新開始？</h2><p>這一局的進度會消失。</p><div class="row"><button class="btn dark" id="y">重新開始</button><button class="btn ghost" id="n">繼續玩</button></div>`, true);

const fakePlot = (o) => ({ t: 'M', cow: 0, skull: false, circle: false, nug: 0, bea: 0, corn: 0, cowsOn: 0, partner: null, ...o });

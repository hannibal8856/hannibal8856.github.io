const COLORS = ['#c0392b', '#2e86c1', '#d4a017', '#27ae60'];

// ---------- state & flow helpers ----------
let S = null, resolver = null, UI = {}, setupCfg = null;
const P = (i) => S.players[i];

const booksOpen = () => ['o', 'g', 'b', 'r', ...(S.round >= 2 ? ['y'] : []), ...(S.round >= 3 ? ['p'] : []), 'k'];
const chipHTML = (ch, cls = '') => `<span class="chip ${cls}" style="background:${COL[ch.c].f};color:${COL[ch.c].t}">${ch.v}</span>`;

function newGame(cfg) {

}
async function run() { try { await runInner(); } catch (e) { if (e !== 'stop') throw e; } }

async function runInner() {
  for (let r = 1; r <= 9; r++) {
    S.round = r; S.mod = {}; S.results = null;
    log(`—— 第 ${r} 輪 ——`);
    if (r === 2) log('人參藥典（黃色）上市了！');
    if (r === 3) log('鬼魂陰氣藥典（紫色）上市了！');
    if (r === 6) { S.players.forEach(p => { takeSupply('w', 1); p.bag.push(chip('w', 1)); }); log('第 6 輪：每人的布袋多放 1 個白色 1 級藥材。'); }
    // fortune card
    S.phase = 'card'; S.card = S.deck.pop();
    log(`占卜牌「${S.card.n}」：${S.card.d}`);
    await applyCard(S.card);
    // rats
    const lead = Math.max(...S.players.map(p => p.vp));
    S.players.forEach(p => { let t = r >= 2 ? ratTails(p.vp, lead) : 0; if (S.mod.rats) t *= 2; p.rats = t; });
    // brewing
    S.phase = 'brew';
    S.players.forEach(p => { p.pot.forEach(c => p.bag.push({ c: c.c, v: c.v })); p.pot = []; p.last = null; p.startPos = Math.min(MAXS - 1, p.drop + p.rats); p.white = 0; p.boom = false; p.done = false; p.canFlask = false; p.newIdx = -1; p.shield = 0; p.shielded = false; });

function ratTails(mine, lead) { let t = 0; for (let x = mine + 1; x <= lead; x++) if (x % 3 === 0) t++; return t; }

async function applyCard(card) {

    case 'donate':
      for (let k = 0; k < S.n; k++) {
        const i = (S.start + k) % S.n, p = P(i), canW = p.bag.some(c => c.c === 'w' && c.v === 1);

    case 'pumpkin': ps.forEach(p => giveChip(p, 'o', 1)); break;
    case 'steady': S.mod.steady = true; break;
    case 'rats': S.mod.rats = true; break;
    case 'poor': lowest(p => p.rubies).forEach(p => { p.rubies++; log(`${p.name} 得 1 顆寶石`); }); break;
    case 'behind': lowest(p => p.vp).forEach(p => { p.drop = Math.min(30, p.drop + 1); log(`${p.name} 的水滴前進 1 格`); }); break;
    case 'green': ps.forEach(p => giveChip(p, 'g', 1)); break;
    case 'clean': ps.forEach(p => removeWhite1(p)); break;

    case 'brave': S.mod.brave = true; break;

// ---------- brewing ----------
function drawFromBag(p) { const i = rint(p.bag.length); return p.bag.splice(i, 1)[0]; }

  if (ch.c === 'w' && ch.v === 1 && S.sets.r === 4 && p.pot.some(x => x.c === 'r')) d = 2;

  if (ch.c === 'b' && RUBY.has(pos)) {

    if (S.sets.b === 4) { p.vp += ch.v; p.rewarded = true; if (p.human) toast(`烏鴉頭骨放在寶石格：+${ch.v} 分`); }

// one draw incl. bonuses; human=true asks for choices
async function drawOne(i, human) {

    const a = await ask({ type: 'brew', p: i });
    if (a === 'stop') { p.done = true; break; }
    if (a === 'flask' && p.canFlask) { const c = unplaceLast(p); p.flask = false; p.canFlask = false; p.newIdx = -1; log(`${p.name} 用藥水瓶把 ${COL[c.c].n} ${c.v} 級放回袋中`); continue; }

// ---------- scoring ----------
async function scoring() {

      const rolls = S.mod.dice ? 2 : 1;
      for (let k = 0; k < rolls; k++) { const f = DIE[rint(6)]; applyDie(p, f); R[ps.indexOf(p)].notes.push('獎勵骰：' + f.n); }
    });
  }

  for (let q = 0; q < S.n; q++) {
    const i = (S.start + q) % S.n, p = P(i), N = R[i].notes;
    const g2 = p.pot.slice(-2).filter(x => x.c === 'g');

    }

    }

    }

      if (n > 0) {

        if (n === 1) { giveChip(p, 'k', 1); p.vp += 1; p.rubies += 1; }

    if (!kc[i]) return;

  const m = openSheet(`<h2>🏆 ${S.winners.map(nm).map(esc).join('、')} 獲勝！</h2><p class="small muted">九輪結束，分數最高的人成為奎德林堡最優秀的名醫。平手時，最後一輪大釜裡藥材較多的人獲勝。</p>
    <table class="res"><tr><th>郎中</th><th>分數</th><th>最後一輪藥材數</th></tr>${order.map(i => `<tr><td>${esc(nm(i))}</td><td>${P(i).vp}</td><td>${P(i).pot.length}</td></tr>`).join('')}</table>
    <div class="row"><button class="btn" id="again">再玩一次</button><button class="btn alt" id="close">看大釜</button></div>`, { keep: true });
  $('#again', m).onclick = () => { closeSheet(); S = null; render(); }; $('#close', m).onclick = () => { closeSheet(); S.prompt = null; render(); }; return m;
}
function showBuySheet() {
  const pr = S.prompt; if (!pr || pr.type !== 'buy') return;
  const draw = () => {
    const sel = UI.buy || [], cost = sel.reduce((a, b) => a + price(b.c)[b.v], 0), left = pr.coins - cost;
    const books = booksOpen().map(c => {
      const desc = bookText(c);
      return `<div class="book"><div class="bh">${miniHTML(c, '')} ${COL[c].n}${SETC.includes(c) ? `<span class="small muted">第 ${S.sets[c]} 組</span>` : ''}</div><div class="bd">${desc}</div><div class="row">${Object.keys(price(c)).map(Number).map(v => {
        const on = sel.some(b => b.c === c && b.v === v), sup = S.supply[key(c, v)] || 0, pr2 = price(c)[v];
        const can = on || (sup > 0 && pr2 <= left && sel.length < 2 && !sel.some(b => b.c === c));
        return `<button class="lv ${on ? 'on' : ''}" data-c="${c}" data-v="${v}" ${can ? '' : 'disabled'}>${miniHTML(c, v)} ${v} 級・${pr2} 金${sup <= 3 ? `<span class="small muted">（剩 ${sup}）</span>` : ''}</button>`; }).join('')}</div></div>`; }).join('');
    const m = openSheet(`<h2>購買藥材</h2><p>金幣 <b>${pr.coins}</b>，已選 ${sel.map(b => `${COL[b.c].n}${b.v}`).join('、') || '無'}，剩 <b>${left}</b>。最多 2 個、顏色不同，沒用完的金幣作廢。</p>${books}
      <div class="row sticky"><button class="btn" id="ok">${sel.length ? `確定購買（${cost} 金）` : '不買'}</button><span class="small muted">剩 ${left} 金</span></div>`);
    m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const c = b.dataset.c, v = +b.dataset.v; const s = UI.buy || []; UI.buy = s.some(x => x.c === c && x.v === v) ? s.filter(x => !(x.c === c && x.v === v)) : [...s, { c, v }]; draw(); });
    $('#ok', m).onclick = () => answer((UI.buy || []).slice());
  };
  draw();
}
function showBooks() {
  const all = ['o', 'g', 'b', 'r', 'y', 'p', 'k'], sets = curSets();
  const m = openSheet(`<h2>📖 本局藥典</h2>${all.map(c => `<div class="book"><div class="bh">${miniHTML(c, '')} ${COL[c].n}${SETC.includes(c) ? `<span class="small muted">第 ${sets[c]} 組</span>` : ''}${c === 'y' ? '<span class="small muted">（第 2 輪上市）</span>' : c === 'p' ? '<span class="small muted">（第 3 輪上市）</span>' : ''}</div><div class="bd">${bookText(c, sets, S ? S.n : setupCfg.n)}</div><div class="small">價格：${Object.entries(price(c, sets)).map(([v, pp]) => `${v} 級 ${pp} 金`).join('、')}</div></div>`).join('')}
    <div class="book"><div class="bh">${miniHTML('w', '')} 白色（不能購買）</div><div class="bd">大釜中白色等級總和超過 7 就爆炸（剛好 7 不會）。</div></div><button class="btn" id="ok">關閉</button>`, { keep: true });
  $('#ok', m).onclick = () => { closeSheet(); if (S) { const pr = S.prompt; if (pr && pr.type === 'buy') showBuySheet(); else renderSheet(); } };
}
function confirmQuit() {
  const m = openSheet(`<h2>重新開始？</h2><p>這一局的進度會消失。</p><div class="row"><button class="btn bad" id="y">重新開始</button><button class="btn alt" id="n">繼續玩</button></div>`, { keep: true });
  $('#y', m).onclick = () => { closeSheet(); resolver = null; if (S) S.gid = -1; S = null; render(); };
  $('#n', m).onclick = () => { closeSheet(); if (S) renderSheet(); };
}
const RULES = () => `<div class="rules" style="display:flex;flex-direction:column;gap:8px">
  <h2>怎麼玩</h2>
  <p>你是江湖郎中，每輪從布袋抽藥材調製藥水。抽越多，藥水越好，但<b>白色藥材的等級總和超過 7 就爆炸</b>。共 9 輪，分數最高的人獲勝。</p>
  <h3>每輪流程</h3>
  <ol><li><b>占卜牌</b>：翻一張，效果適用所有人。</li>
    <li><b>老鼠</b>（第 2 輪起）：落後的玩家，計分板上和第一名之間每有 1 條老鼠尾巴，起點就往前 1 格。</li>
    <li><b>製藥</b>：所有人同時進行。抽出的藥材從水滴（或老鼠）開始，依等級往前放（1 級放下一格，2 級隔一格…）。隨時可以停止。爆炸就立刻停止。</li>
    <li><b>藥水瓶</b>：每輪一次，可以把剛抽出的藥材放回袋中（造成爆炸的白色不行）。用過要花 2 寶石裝滿。</li>
    <li><b>計分</b>：最後一個藥材前一格是你的計分格。
      <ul><li>A 獎勵骰：沒爆炸、計分格最遠的人擲骰。</li><li>B 藥材行動：綠、紫、黑色的效果。</li><li>C 計分格有寶石就得 1 顆。</li><li>D 得分、E 用計分格的金幣買 1～2 個不同顏色的藥材。<b>爆炸的人 D、E 二選一。</b></li><li>F 每 2 顆寶石：水滴前進 1 格，或裝滿藥水瓶。</li></ul></li></ol>
  <h3>特別的輪</h3><ul><li>第 2 輪人參（黃）上市、第 3 輪鬼魂陰氣（紫）上市。</li><li>第 6 輪開始時每人布袋多 1 個白色 1 級。</li><li>第 9 輪不買藥材：每 5 金幣或 2 寶石換 1 分。</li></ul>
  <h3>起始布袋</h3><p>白色 1 級 ×4、白色 2 級 ×2、白色 3 級 ×1、南瓜 ×1、綠色 1 級 ×1，寶石 1 顆。</p>
  <h3>這個電腦版</h3><ul>
    <li>非官方練習版，依繁體中文說明書和藥典圖鑑製作。綠、藍、紅、黃、紫藥典各有第 1～4 組，開局可以選一整組或每色自選（說明書建議第一次玩第 1 組，之後第 3 組、第 4 組）。</li>
    <li><b>自己補的地方</b>：24 張占卜牌的內容（照片看不到，這裡設計了 12 種各 2 張）；大釜每格的金幣／分數／寶石位置，依說明書的例子推算（例如 10 格 2 分、15 格 3 分、19 格 5 分、23 格 7 分，最後一格 35 金幣 15 分）；計分板上每 3 格 1 條老鼠尾巴。</li>
    <li>藥材數量照說明書的配件表，買完就沒了。</li></ul></div>`;
function showRules() { const m = openSheet(RULES() + '<button class="btn" id="ok">知道了</button>', { keep: true }); $('#ok', m).onclick = () => { closeSheet(); if (S) renderSheet(); }; }

// ---------- setup ----------
const BOTNAMES = ['電腦 魯卡斯', '電腦 妮娜', '電腦 瑪莉'];
function renderSetup() {
  $('#bar').hidden = true; $('#app').style.paddingBottom = '';
  if (!setupCfg) setupCfg = { n: 3, sets: { g: 1, b: 1, r: 1, y: 1, p: 1 }, preset: 1, seats: [{ name: '你', human: true }, ...BOTNAMES.map(n => ({ name: n, human: false }))] };
  const c = setupCfg;
  $('#app').innerHTML = `
  <div class="top"><h1>藥鍋郎中<small>郎中闖江湖規則</small></h1><button class="pill" id="rulesBtn">規則</button></div>
  <p style="margin:0;color:var(--muted);line-height:1.6">從布袋抽藥材調製藥水——再抽一個，還是見好就收？白色櫻桃炸彈太多，整鍋藥就爆了！</p>
  <div class="setup">
    <div><h3>人數</h3><div class="seg">${[2, 3, 4].map(n => `<button data-n="${n}" class="${c.n === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><h3>座位</h3>
      ${c.seats.slice(0, c.n).map((s, i) => `<div class="seatrow"><span class="dot" style="background:${COLORS[i]}"></span><input id="nm${i}" value="${esc(s.name)}" maxlength="8" aria-label="名字">
        <div class="seg"><button data-h="${i}" class="${s.human ? 'on' : ''}">真人</button><button data-c="${i}" class="${s.human ? '' : 'on'}">電腦</button></div></div>`).join('')}
      <span class="small muted">好幾個真人可以輪流用同一支手機，每人輪流製藥。</span></div>
    <div style="display:flex;flex-direction:column;gap:8px"><h3>藥典組合</h3>
      <div class="seg">${[1, 2, 3, 4].map(k => `<button data-ps="${k}" class="${c.preset === k ? 'on' : ''}">第 ${k} 組</button>`).join('')}<button data-ps="0" class="${c.preset === 0 ? 'on' : ''}">自選</button></div>
      <span class="small muted">說明書建議：第一次玩第 1 組，接著第 3 組，最後第 4 組。南瓜和骷髏巨蛾每局都一樣。</span>
      ${c.preset === 0 ? SETC.map(col => `<div class="seatrow">${miniHTML(col, '')}<span style="width:5.5em">${COL[col].n}</span><div class="seg">${[1, 2, 3, 4].map(k => `<button data-sc="${col}" data-sk="${k}" class="${c.sets[col] === k ? 'on' : ''}">${k}</button>`).join('')}</div></div>`).join('') : ''}
      <button class="btn alt" id="setBooks" style="align-self:flex-start">看這組藥典的效果</button></div>
    <button class="btn big" id="start" style="align-self:flex-start">開始製藥</button>
  </div>
  <div class="setup">${RULES()}</div>`;
  const save = () => c.seats.slice(0, c.n).forEach((s, i) => { s.name = $('#nm' + i).value.trim() || `郎中${i + 1}`; });
  $('#rulesBtn').onclick = showRules;
  document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { save(); c.n = +b.dataset.n; renderSetup(); });
  document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { save(); const s = c.seats[+b.dataset.h]; s.human = true; if (s.name.startsWith('電腦')) s.name = `郎中${+b.dataset.h + 1}`; renderSetup(); });
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { save(); const s = c.seats[+b.dataset.c]; s.human = false; if (!s.name.startsWith('電腦')) s.name = BOTNAMES[(+b.dataset.c) % 3] || '電腦'; renderSetup(); });
  document.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => { save(); const k = +b.dataset.ps; c.preset = k; if (k) SETC.forEach(col => c.sets[col] = k); renderSetup(); });
  document.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => { save(); c.sets[b.dataset.sc] = +b.dataset.sk; renderSetup(); });
  $('#setBooks').onclick = showBooks;
  $('#start').onclick = () => { save(); const seats = c.seats.slice(0, c.n).map(s => ({ ...s })); if (!seats.some(s => s.human)) seats[0].human = true; newGame({ seats, sets: c.sets }); render(); run(); };
}
window.__q = () => S;
window.__qSpeed = (v) => { SPEED = v; };
window.__qBots = (n, sets) => { newGame({ seats: Array.from({ length: n }, (_, i) => ({ name: '電腦' + (i + 1), human: false })), sets }); run(); };
window.__qApi = { answer, get P() { return S && S.prompt; } };
render();
})();
</script>
</html>

// ---------- online play (PeerJS: the host's browser runs the game, others get only what they may see) ----------
const NET = { role: null, code: '', peer: null, conns: [], host: null, waits: {}, pid: 0, chat: [], unread: 0, chatOpen: false, lobby: null, myName: '', status: '', err: '', dismissed: {}, answered: 0, lastView: null, roleKey: '' };
const PEER_PREFIX = 'hannibal-fart-';
const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const EMOS = ['😂', '😡', '🤔', '😱', '👍', '🙏', '😏', '🤫', '💨', '🤢', '👃', '😇'];
const qs = new URLSearchParams(location.search);
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
function peerOpts() { const h = qs.get('peerhost'); if (!h) return { debug: 0 }; const [host, port] = h.split(':'); return { host, port: +port, path: '/', secure: false, debug: 0 }; }
let peerLib = null;
function loadPeer() {
  if (window.Peer) return Promise.resolve(window.Peer);
  if (peerLib) return peerLib;
  const srcs = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
  peerLib = new Promise((res, rej) => {
    let i = 0;
    const next = () => {
      if (i >= srcs.length) { peerLib = null; rej(new Error('load')); return; }
      const s = document.createElement('script'); s.src = srcs[i++];
      s.onload = () => window.Peer ? res(window.Peer) : next();
      s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
  return peerLib;
}
function send(c, o) { try { if (c && c.open) c.send(o); } catch {} }
function bcast(o) { NET.conns.forEach(r => send(r.c, o)); }
const newCode = () => Array.from({ length: 4 }, () => CODE_CH[rint(CODE_CH.length)]).join('');

function netReset() {
  if (NET.peer) { try { NET.peer.destroy(); } catch {} }
  Object.assign(NET, { role: null, code: '', peer: null, conns: [], host: null, waits: {}, chat: [], unread: 0, chatOpen: false, lobby: null, status: '', dismissed: {}, answered: 0, lastView: null, roleKey: '' });
  renderChat();
}
function netFail(msg) {
  const wasClient = NET.role === 'client';
  netReset(); NET.err = msg;
  if (wasClient || !S || S.online) { S = null; resolver = null; }
  closeSheet(); render();
}
function netLeave() {
  if (NET.role === 'host') bcast({ t: 'bye', reason: '房主關閉了房間。' });
  const p = NET.peer; NET.peer = null;
  setTimeout(() => { try { p && p.destroy(); } catch {} }, 300);

}
function backToLobbyOrSetup() {
  if (S) S.gid = Math.random();
  resolver = null; S = null;
  if (NET.role === 'host') { NET.waits = {}; NET.conns.forEach(r => r.seat = -1); }

// ----- host -----
async function hostRoom(name) {
  NET.role = 'host'; NET.myName = name; NET.err = ''; NET.status = '正在建立房間…'; NET.lobby = { n: 6 };
  render();
  let Peer; try { Peer = await loadPeer(); } catch { return netFail('連線元件載入失敗，請確認網路後再試一次。'); }
  if (NET.role !== 'host') return;
  for (let tries = 0; tries < 6 && !NET.peer; tries++) {
    const code = newCode();
    const r = await new Promise(res => {
      const p = new Peer(PEER_PREFIX + code, peerOpts());
      let done = false;
      p.on('open', () => { done = true; res({ p, code }); });
      p.on('error', e => { if (!done) { done = true; try { p.destroy(); } catch {} res({ err: e }); } else hostPeerError(e); });
      setTimeout(() => { if (!done) { done = true; try { p.destroy(); } catch {} res({ err: { type: 'timeout' } }); } }, 15000);
    });
    if (NET.role !== 'host') { if (r.p) r.p.destroy(); return; }
    if (r.p) { NET.peer = r.p; NET.code = r.code; break; }
    if (r.err && r.err.type !== 'unavailable-id') return netFail('無法建立房間（' + (r.err.type || '網路錯誤') + '），請確認網路後再試一次。');
  }
  if (!NET.peer) return netFail('無法建立房間，請再試一次。');
  NET.peer.on('connection', hostConn);
  NET.peer.on('disconnected', () => { try { NET.peer && NET.peer.reconnect(); } catch {} });
  NET.status = ''; sysChat(`房間 ${NET.code} 建好了`); render();
}
function hostPeerError(e) { if (e && e.type === 'network') sysChat('連線伺服器暫時斷線，已經在房間裡的人不受影響。'); }
function hostConn(c) {
  const rec = { c, name: '', seat: -1, last: Date.now() };
  c.on('data', d => { rec.last = Date.now(); hostRecv(rec, d); });
  c.on('close', () => hostDrop(rec));
  c.on('error', () => hostDrop(rec));
}
function hostRecv(rec, d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'hello' && !rec.name) {
    const name = String(d.name || '').trim().slice(0, 8) || '玩家';
    if (S) {
      const j = S.players.findIndex((p, k) => k !== S.me && (p.off || p.remote) && p.baseName === name);
      const old = NET.conns.find(r => r.seat === j && j >= 0);
      if (old) { NET.conns.splice(NET.conns.indexOf(old), 1); try { old.c.close(); } catch {} }
      if (j < 0) { send(rec.c, { t: 'bye', reason: '這局已經開始了，等下一局再加入吧。（斷線的人用原本的名字可以接回座位）' }); return; }
      const p = P(j); p.off = false; p.remote = true; p.human = true; p.name = p.baseName;
      rec.name = name; rec.seat = j; NET.conns.push(rec);
      sysChat(`${name} 重新連線，接回座位`); render(); return;
    }
    const max = 10;
    if (1 + NET.conns.length >= max) { send(rec.c, { t: 'bye', reason: '房間已滿。' }); return; }
    let nm2 = name, k = 2; const taken = () => [NET.myName, ...NET.conns.map(r => r.name)];
    while (taken().includes(nm2)) nm2 = name.slice(0, 6) + k++;
    rec.name = nm2; NET.conns.push(rec);
    sysChat(`${nm2} 加入了房間`); render(); return;
  }
  if (!rec.name) return;
  if (d.t === 'pong') return;
  if (d.t === 'chat') { const text = String(d.text || '').trim().slice(0, 120); if (text) addChat(rec.name, text); return; }
  if (d.t === 'emo') { if (EMOS.includes(d.e)) addEmo(rec.name, d.e); return; }
  if (d.t === 'ans' && S && rec.seat >= 0) {
    const w = NET.waits[d.pid]; if (!w || w.seat !== rec.seat) return;
    if (!validAns(w.pr, d.v)) { console.warn('invalid answer', JSON.stringify(d.v)); delete NET.waits[d.pid]; const pr = { ...w.pr, pid: ++NET.pid }; NET.waits[pr.pid] = { ...w, pr }; S.rprompts[rec.seat] = pr; syncSoon(); return; }
    delete NET.waits[d.pid]; S.rprompts[rec.seat] = null; w.r(d.v);
  }
}
function hostDrop(rec) {
  const i = NET.conns.indexOf(rec); if (i < 0) return;
  NET.conns.splice(i, 1);
  if (!rec.name) return;
  const inGame = S && rec.seat >= 0 && !S.over;
  sysChat(`${rec.name} 離線了${inGame ? '，先由電腦代打' : ''}`);
  if (S && rec.seat >= 0) {
    const p = P(rec.seat); p.off = true; p.remote = false; p.human = false; p.name = p.baseName + '（離線）';
    for (const [pid, w] of Object.entries(NET.waits)) if (w.seat === rec.seat) { delete NET.waits[pid]; S.rprompts[rec.seat] = null; w.r(botAnswer(w.pr)); }
  }
  render();
}
// heartbeat: WebRTC can take a long time to notice a closed phone, so ping everyone
setInterval(() => {
  if (NET.role === 'host') {
    const now = Date.now();
    NET.conns.slice().forEach(r => { if (now - r.last > 12000) { try { r.c.close(); } catch {} hostDrop(r); } });
    bcast({ t: 'ping' });
  } else if (NET.role === 'client' && NET.host && NET.host.open) {
    if (Date.now() - (NET.hostLast || Date.now()) > 15000) netFail('和房主的連線中斷了。用同一個名字重新加入可以接回座位。');
  }
}, 3000);


let syncT = null;
function syncSoon() { if (NET.role !== 'host' || syncT) return; syncT = setTimeout(() => { syncT = null; doSync(); }, 40); }
function doSync() {
  if (NET.role !== 'host') return;
  if (!S) { bcast({ t: 'lobby', code: NET.code, players: [NET.myName, ...NET.conns.map(r => r.name)], n: lobbyN() }); return; }
  NET.conns.forEach(r => { if (r.seat >= 0) send(r.c, { t: 'view', v: viewFor(r.seat) }); });
}

function lobbyN() { const h = 1 + NET.conns.length; return Math.min(10, Math.max(5, NET.lobby.n, h)); }
function startOnline() {
  const n = lobbyN();
  if (1 + NET.conns.length > n) return;
  const seats = [{ name: NET.myName, human: true }, ...NET.conns.map(r => ({ name: r.name, human: true, remote: true }))];
  NET.conns.forEach((r, i) => r.seat = i + 1);
  let b = 0; while (seats.length < n) seats.push({ name: BOTNAMES[b++], human: false });
  NET.waits = {};
  newGame({ seats });
  S.online = true; S.me = 0; S.rprompts = {};
  sysChat(`電梯出發！${n} 位乘客`);
  render(); run();
}

// ----- client -----
async function joinRoom(code, name) {
  NET.role = 'client'; NET.myName = name; NET.code = code; NET.err = ''; NET.status = '正在連線到房間 ' + code + '…';
  render();
  let Peer; try { Peer = await loadPeer(); } catch { return netFail('連線元件載入失敗，請確認網路後再試一次。'); }
  if (NET.role !== 'client') return;
  const p = new Peer(undefined, peerOpts()); NET.peer = p;
  p.on('error', e => {
    if (NET.role !== 'client') return;
    if (e.type === 'peer-unavailable') netFail(`找不到房間 ${code}，請確認房號，或請房主重新開房。`);
    else if (!NET.host || !NET.host.open) netFail('連線失敗（' + (e.type || '網路錯誤') + '），請再試一次。');
  });
  p.on('open', () => {
    const c = p.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' }); NET.host = c;
    c.on('open', () => { NET.hostLast = Date.now(); send(c, { t: 'hello', name }); NET.status = '已連線，等待房主…'; render(); });
    c.on('data', clientRecv);
    c.on('close', () => { if (NET.role === 'client') netFail(S && !S.over ? '和房主的連線中斷了。用同一個名字重新加入可以接回座位。' : '房間已經關閉了。'); });
  });
  setTimeout(() => { if (NET.role === 'client' && NET.code === code && !NET.lobby && !S) netFail('連線逾時。請確認房號，或請房主重新開房。'); }, 20000);
}
function clientRecv(d) {
  if (!d || typeof d !== 'object') return;
  NET.hostLast = Date.now();
  if (d.t === 'ping') { send(NET.host, { t: 'pong' }); return; }
  if (d.t === 'lobby') { NET.lobby = d; NET.status = ''; if (S) { S = null; NET.dismissed = {}; NET.answered = 0; NET.roleKey = ''; closeSheet(); } render(); }
  else if (d.t === 'view') applyView(d.v);
  else if (d.t === 'chat') addChat(d.from, d.text, d.sys);
  else if (d.t === 'emo') addEmo(d.from, d.e);
  else if (d.t === 'flash') showFlash(d.e, d.text);
  else if (d.t === 'bye') { const r = d.reason; netFail(r); }
}
function applyView(v) {
  NET.lastView = v;
  const prevPid = S && S.prompt && S.prompt.pid;
  S = { online: true, client: true, me: v.me, gid: v.gk, view: v, prompt: null, rprompts: {} };
  if (v.prompt && v.prompt.pid !== NET.answered) S.prompt = v.prompt;
  if (!(S.prompt && S.prompt.pid && S.prompt.pid === prevPid)) UI = {};
  render();
}
function clientAnswer(v) {
  const pr = S && S.prompt; if (!pr) return;
  S.prompt = null; UI = {};
  if (pr.local) { if (pr.type === 'role') NET.roleKey = pr.key; else if (pr.key) NET.dismissed[pr.key] = true; if (NET.lastView) applyView(NET.lastView); else render(); return; }
  NET.answered = pr.pid; send(NET.host, { t: 'ans', pid: pr.pid, v }); render();
}

// ----- chat & emotes -----
function chatBtnHTML() { return `<button class="pill chatbtn" id="chatBtn" aria-label="聊天">💬 聊天${NET.unread ? `<span class="badge">${NET.unread}</span>` : ''}</button>`; }
function bindChatBtn() { const b = $('#chatBtn'); if (b) b.onclick = () => { NET.chatOpen = !NET.chatOpen; NET.unread = 0; updateBadge(); renderChat(); }; }
function updateBadge() { const b = $('#chatBtn'); if (b) b.innerHTML = `💬 聊天${NET.unread ? `<span class="badge">${NET.unread}</span>` : ''}`; }
function addChat(from, text, sys) {
  NET.chat.push({ from, text, sys: !!sys }); if (NET.chat.length > 120) NET.chat.shift();
  if (NET.role === 'host') bcast({ t: 'chat', from, text, sys: !!sys });
  if (!NET.chatOpen && !sys) { NET.unread++; updateBadge(); }
  renderChat();
}
function sysChat(text) { addChat('', text, true); }
function addEmo(from, e) {
  if (NET.role === 'host') bcast({ t: 'emo', from, e });
  NET.chat.push({ from, text: e, emo: true }); if (NET.chat.length > 120) NET.chat.shift();
  renderChat();
  const old = $('#bubble'); if (old) old.remove();
  const b = document.createElement('div'); b.className = 'bubble'; b.id = 'bubble';
  b.innerHTML = `<span class="e">${e}</span>${esc(from)}`;
  document.body.appendChild(b); setTimeout(() => { if (b.isConnected) b.remove(); }, 2300);
}
function sendChat(text) {
  text = text.trim().slice(0, 120); if (!text) return;
  if (NET.role === 'host') addChat(NET.myName, text); else send(NET.host, { t: 'chat', text });
}
function sendEmo(e) { if (NET.role === 'host') addEmo(NET.myName, e); else send(NET.host, { t: 'emo', e }); }
function renderChat() {
  let el = $('#chat');
  if (!NET.chatOpen || !NET.role) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div'); el.className = 'chat'; el.id = 'chat';
    el.innerHTML = `<div class="cin"><div class="chd"><h3 style="font-size:1.05rem">💬 聊天</h3><button class="pill" id="chatX">關閉</button></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="emos">${EMOS.map(e => `<button data-emo="${e}" aria-label="送出 ${e}">${e}</button>`).join('')}</div>
      <form id="chatF"><input id="chatI" maxlength="120" placeholder="說點什麼…（例如：不是我放的！）" autocomplete="off"><button class="btn" type="submit">送出</button></form></div>`;
    document.body.appendChild(el);
    $('#chatX', el).onclick = () => { NET.chatOpen = false; renderChat(); };
    el.querySelectorAll('[data-emo]').forEach(b => b.onclick = () => sendEmo(b.dataset.emo));
    $('#chatF', el).onsubmit = (ev) => { ev.preventDefault(); const i = $('#chatI', el); sendChat(i.value); i.value = ''; i.focus(); };
  }
  const box = $('#msgs', el);
  box.innerHTML = NET.chat.map(m => m.sys ? `<div class="sys">— ${esc(m.text)} —</div>` : `<div><b>${esc(m.from)}</b>：${m.emo ? `<span style="font-size:1.3rem">${m.text}</span>` : esc(m.text)}</div>`).join('') || '<div class="sys">還沒有訊息</div>';
  box.scrollTop = box.scrollHeight;
}

// ----- setup & lobby screens -----
function playSegHTML() {
  const p = setupCfg.play;
  return `<div class="setup" style="gap:8px"><h3>怎麼玩</h3><div class="seg"><button data-play="local" class="${p === 'local' ? 'on' : ''}">這支手機</button><button data-play="host" class="${p === 'host' ? 'on' : ''}">線上開房</button><button data-play="join" class="${p === 'join' ? 'on' : ''}">加入房間</button></div>
    <span class="small muted">${p === 'local' ? '你和電腦一起搭電梯。' : p === 'host' ? '你開一個房間，朋友用自己的手機輸入房號加入，空位由電腦補。' : '輸入朋友給你的 4 碼房號。'}</span>
    ${NET.err ? `<div class="err">${esc(NET.err)}</div>` : ''}</div>`;
}
function bindPlaySeg(save) { document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => { if (save) save(); setupCfg.play = b.dataset.play; NET.err = ''; renderSetup(); }); }
function renderNetSetup() {
  const c = setupCfg, host = c.play === 'host';
  const name = c.netName ?? store.get('fart-name');
  $('#app').innerHTML = `
  <div class="top"><h1>電梯有屁<small>屁者先知規則</small></h1><button class="pill" id="rulesBtn">規則</button></div>
  <p style="margin:0;color:var(--muted);line-height:1.6">電梯裡有人偷放屁！和朋友各用自己的手機，押牌、發言、投票，把屁者找出來。</p>
  ${playSegHTML()}
  <div class="setup">
    <div style="display:flex;flex-direction:column;gap:6px"><h3>你的名字</h3><input class="netin" id="nmI" maxlength="8" value="${esc(name)}" placeholder="最多 8 個字"></div>
    ${host ? '<p class="small muted" style="margin:0">人數進房後再設定，空位由電腦補。</p>'
      : `<div style="display:flex;flex-direction:column;gap:6px"><h3>房號</h3><input class="netin" id="codeI" maxlength="4" value="${esc(c.code || '')}" placeholder="例如 K7QF" style="text-transform:uppercase;letter-spacing:.3em;font-size:1.3rem;max-width:200px" autocapitalize="characters"></div>`}
    <button class="btn" id="go" style="align-self:flex-start;font-size:1.05rem">${host ? '建立房間' : '加入房間'}</button>
    <span class="small muted">需要網路。房主的手機負責發身分和計算，遊戲中請房主不要關掉這個網頁。</span>
  </div>`;
  $('#rulesBtn').onclick = showRules;
  const keep = () => { c.netName = $('#nmI').value; const ci = $('#codeI'); if (ci) c.code = ci.value; };
  bindPlaySeg(keep);
  $('#go').onclick = () => {
    const nm2 = $('#nmI').value.trim().slice(0, 8);
    if (!nm2) { $('#nmI').focus(); return; }
    store.set('fart-name', nm2); c.netName = nm2;
    if (host) hostRoom(nm2);
    else { const code = ($('#codeI').value || '').trim().toUpperCase(); if (code.length !== 4) { $('#codeI').focus(); return; } c.code = code; joinRoom(code, nm2); }
  };
}
function renderLobby() {
  const host = NET.role === 'host', L = NET.lobby;
  let body;
  if (NET.status || !L || (host && !NET.code)) body = `<p>${esc(NET.status || '連線中…')}</p>`;
  else {
    const players = host ? [NET.myName, ...NET.conns.map(r => r.name)] : L.players;
    const n = host ? lobbyN() : L.n, C = CONFIG[n];
    const ns = []; for (let k = Math.max(5, players.length); k <= 10; k++) ns.push(k);
    const nf = C.ids.filter(isF).length;
    body = `<div style="text-align:center"><span class="small muted">房號</span><div class="code">${esc(NET.code)}</div>
      ${host ? `<div class="row" style="justify-content:center"><button class="btn alt" id="share">分享邀請連結</button></div><p class="small muted" style="margin:6px 0 0">朋友打開遊戲 → 加入房間 → 輸入房號。</p>` : ''}</div>
    <div style="display:flex;flex-direction:column;gap:6px"><h3>乘客（${players.length} 位真人）</h3>
      <div class="plist">${players.map((p, i) => `<div><span>${esc(p)}${p === NET.myName ? '（你）' : ''}</span><span class="small muted">${i === 0 ? '房主' : '已加入'}</span></div>`).join('')}
      ${n > players.length ? `<div><span class="muted">電腦 × ${n - players.length}</span><span class="small muted">補空位</span></div>` : ''}</div></div>
    ${host ? `<div><h3>總人數</h3>${players.length > 10 ? '<p class="err">最多 10 人。</p>' : `<div class="seg">${ns.map(k => `<button data-ln="${k}" class="${n === k ? 'on' : ''}">${k}</button>`).join('')}</div>`}</div>` : ''}
    <p class="small muted" style="margin:0">${n} 人局：${C.ids.filter(x => x === 'pass').length} 名乘客 vs ${nf} 名屁者${C.ids.includes('loud') ? '（含響屁者）' : ''}${n >= 7 ? '，屁者互相認識' : '，屁者互不認識'}。屁牌 ${C.small} 小 ${C.big} 大，無屁 4 張。</p>
    ${host ? `<button class="btn" id="startOn" style="align-self:flex-start;font-size:1.05rem" ${players.length > 10 ? 'disabled' : ''}>電梯出發</button>` : '<p class="small muted" style="margin:0">等房主開始…</p>'}`;
  }
  $('#app').innerHTML = `
  <div class="top"><h1>電梯有屁<small>線上房間</small></h1><div style="display:flex;gap:6px">${chatBtnHTML()}<button class="pill" id="rulesBtn">規則</button><button class="pill" id="leave">離開</button></div></div>
  <div class="setup">${body}</div>`;
  $('#rulesBtn').onclick = showRules;
  bindChatBtn();
  $('#leave').onclick = netLeave;
  document.querySelectorAll('[data-ln]').forEach(b => b.onclick = () => { NET.lobby.n = +b.dataset.ln; render(); });
  const so = $('#startOn'); if (so) so.onclick = startOnline;
  const sh = $('#share'); if (sh) sh.onclick = async () => {
    const link = location.href.split('?')[0].split('#')[0] + '?room=' + NET.code;
    const text = `來玩電梯有屁！房號 ${NET.code}`;
    try { if (navigator.share) { await navigator.share({ title: '電梯有屁', text, url: link }); return; } } catch { return; }
    try { await navigator.clipboard.writeText(text + ' ' + link); sh.textContent = '已複製連結'; } catch { sh.textContent = '房號：' + NET.code; }
  };
  syncSoon();
}


// tests
window.__fart = { S: () => S, speed: (v) => { SLEEP = v; }, bots: (n) => { const seats = Array.from({ length: n }, (_, i) => ({ name: BOTNAMES[i] || '電腦' + i, human: false })); newGame({ seats }); S.online = false; S.me = 0; render(); return run(); }, answer: (v) => answer(v), view: () => V() };
render();
})();
</script>

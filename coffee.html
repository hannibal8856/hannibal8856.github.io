<style>

/* harvest mini game */
.field { position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 14px; overflow: hidden;

@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rint = (n) => Math.floor(Math.random() * n);

const AREAS = {
  farm: { n: '咖啡莊園', slots: 3, d: '採收咖啡漿果（3 秒內動手抓），也可以把不要的漿果放回莊園清倉。' },
  academy: { n: '農業知識學院', slots: 3, d: '抽農業知識卡。出高分要用的「風味品種」只有這裡有。' },
  expo: { n: '咖啡博覽會', slots: 5, d: '抽果實加工處理設備卡，再拿一張綜合攤位牌（出杯加分）。' },
  cafe: { n: '咖啡廳', slots: 4, d: '選一張麻布袋計分卡，交出漿果出杯得分。' },
};
const ORDER = ['farm', 'academy', 'expo', 'cafe'];
const SO = ['H', 'N', 'W'];
const M = { W: '水洗', N: '日曬', H: '蜜處理' };
const GC = [null, '#8dbb47', '#c4bd2e', '#e7962c', '#d23f2c', '#981b2f', '#4a1530'];
const GN = [null, '青綠', '黃綠', '橙黃', '紅', '深紅', '紫黑'];
const PCOL = ['#c8382c', '#2f5596', '#e0a92e', '#2e7058', '#9a8d86', '#6b5244'];
const TOOLS = ['手沖壺', '法式濾壓壺', '摩卡壺', '愛樂壓', '虹吸壺'];
const CONDN = { any: '不限天氣', notRain: '下雨以外的天氣', sun: '只限晴天', notSun: '陰天或下雨' };
const skyOk = (cond, sky) => cond === 'any' || (cond === 'notRain' && sky !== '雨') || (cond === 'sun' && sky === '晴') || (cond === 'notSun' && sky !== '晴');

const WEATHER = [
  { n: '晴天／陽光充足', sky: '晴', h: 0, ok: ['N', 'H'] },
  { n: '晴天／乾燥季風', sky: '晴', h: 1, ok: ['N'], dice: true },
  { n: '晴天／溫和微風', sky: '晴', h: 1, ok: ['W', 'N', 'H'] },
  { n: '晴天／秋高氣爽', sky: '晴', h: 0, ok: ['W', 'N'] },
  { n: '晴天／寒流過後', sky: '晴', h: -1, ok: ['N', 'H'] },
  { n: '陰天／水源充沛', sky: '陰', h: 0, ok: ['W', 'H'], dice: true },
  { n: '陰天／霧氣籠罩', sky: '陰', h: 0, ok: ['W', 'H'] },
  { n: '陰天／早晚溫差大', sky: '陰', h: 1, ok: ['W', 'N', 'H'] },
  { n: '陰天／山區濕冷', sky: '陰', h: -1, ok: ['W'] },
  { n: '下雨／午後雷陣雨', sky: '雨', h: 0, ok: ['W', 'H'], dice: true },
  { n: '下雨／梅雨季', sky: '雨', h: -1, ok: ['W'] },
  { n: '下雨／颱風來襲', sky: '雨', h: -1, ok: ['W'], dice: true },
];
const HN = { '-1': '欠收（少 1 顆）', '0': '正常', '1': '豐收（多 1 顆）' };

let uid = 1;
const card = (o) => ({ id: uid++, isNew: false, m: [], ...o });
function academyDeck() {
  const d = [];
  ['藝伎 Geisha', '鐵比卡 Typica', '波旁 Bourbon', '卡杜拉 Caturra', 'SL34', '帕卡馬拉 Pacamara', '黃波旁', '瑰夏', '卡杜艾 Catuai', '肯特 Kent']
    .forEach(n => d.push(card({ kind: 'flavor', name: '風味品種：' + n, text: '出杯時使用。達到 AA 級國際競標豆必備（看計分卡 +7 或 +12 分）。' })));
  for (let i = 0; i < 4; i++) d.push(card({ kind: 'shade', name: '遮蔭栽培', text: '出杯時使用：不用管計分卡上的天氣條件。' }));

  for (let i = 0; i < 3; i++) d.push(card({ kind: 'select', name: '篩選採收', text: '輪到你時使用：把倉庫裡最低等級的 1 顆漿果，換成莊園裡 1 顆 5～6 級漿果。' }));
  return shuffle(d);
}
function expoDeck() {

  add('cons', '去皮機', ['W', 'H'], '消耗卡：出杯時使用，水洗／蜜處理加分設備。', 4);
  add('cons', '發酵水槽', ['W'], '消耗卡：出杯時使用，水洗加分設備。', 4);
  add('cons', '非洲棚架', ['N'], '消耗卡：出杯時使用，日曬加分設備。', 4);

  add('perm', '水洗處理槽', ['W'], '常駐卡：用點數總和 10 以上的漿果建設，之後永久當水洗設備。', 2);
  add('perm', '機械乾燥機', ['N'], '常駐卡：用點數總和 10 以上的漿果建設，之後永久當日曬設備。', 2);
  return shuffle(d);

function boothDeck() {
  const d = [];
  [['電子秤', 1, 5], ['拉花鋼杯', 1, 4], ['溫度計', 2, 4], ['濃度儀', 2, 3], ['磨豆機', 2, 2], ['杯測證書', 3, 2]]
    .forEach(([n, v, k]) => { for (let i = 0; i < k; i++) d.push(card({ kind: 'bonus', name: n, v, text: `出杯時使用：本次出杯 +${v} 分。` })); });
  return shuffle(d);
}
function simpleDeck(list) { const d = []; list.forEach(([n, v, k]) => { for (let i = 0; i < k; i++) d.push({ name: n, v }); }); return shuffle(d); }
function sackDeck(m) {
  const conds = { W: ['any', 'notSun', 'notRain', 'any'], N: ['sun', 'notRain', 'any', 'sun'], H: ['notRain', 'any', 'notRain', 'notSun'] }[m];
  const fvs = [7, 12, 7, 12, 7, 7];
  const d = [];
  for (let i = 0; i < 12; i++) {
    d.push({ id: uid++, m, cond: conds[(i + Math.floor(i / 4)) % 4], thr: 9, g: 4, C: 1, fv: fvs[i % 6] });
  }
  return shuffle(d);
}

let S = null, resolver = null, setupCfg = null;

function log(t) { S.log.unshift(t); if (S.log.length > 60) S.log.pop(); }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2700); }
const P = (i) => S.players[i];
const nm = (i) => P(i).name;

function drawPool() { if (!S.pool.length) return null; return S.pool.splice(rint(S.pool.length), 1)[0]; }
function drawDeck(k) {
  const d = S.decks[k];
  if (!d.length) return null;
  return d.pop();
}
function toBottom(c) {
  const k = c.kind === 'bonus' ? 'booth' : (['cons', 'perm'].includes(c.kind) ? 'expo' : 'academy');
  c.isNew = false; S.decks[k].unshift(c);
}
function drawCycle(k) { const c = S.decks[k].pop(); S.decks[k].unshift(c); return c; }

function addScore(i, pts) {
  const p = P(i), from = p.score, to = from + pts;
  p.score = to;
  for (let sq = from + 1; sq <= to; sq++) {
    if (S.track[sq]) { p.tools.push(S.track[sq]); log(`${p.name} 的分數經過第 ${sq} 格，拿到沖煮器具「${S.track[sq]}」`); delete S.track[sq]; }
  }
}

// ---------------- serving ----------------
function evalServe(i, m, idxs, bonusIds) {
  const p = P(i), sack = S.sacks[m][S.sacks[m].length - 1];
  if (!sack) return null;
  const ch = idxs.map(x => p.cherries[x]);
  const sum = ch.reduce((a, b) => a + b, 0);
  const usable = p.hand.filter(c => !c.isNew);
  const use = [], checks = [], lines = [];
  let wOk = skyOk(sack.cond, S.weather.sky), shade = false;
  if (!wOk) { const c = usable.find(c => c.kind === 'shade'); if (c) { use.push(c); wOk = true; shade = true; } }
  checks.push({ ok: wOk, t: `天氣條件：${CONDN[sack.cond]}（本回合是${S.weather.sky}天）${shade ? '→ 用「遮蔭栽培」過關' : ''}` });
  let mOk = S.weather.ok.includes(sack.m), mk = false;
  if (!mOk) { const c = usable.find(c => c.kind === 'mknow'); if (c) { use.push(c); mOk = true; mk = true; } }
  checks.push({ ok: mOk, t: `天候卡適合「${M[sack.m]}」${mk ? '→ 用「處理法知識」過關' : ''}` });
  const sOk = sum > sack.thr;
  checks.push({ ok: sOk, t: `交出的漿果點數總和 ${sum}，要大於 ${sack.thr}` });
  const beanOk = S.beans > 0;
  if (!beanOk) checks.push({ ok: false, t: '咖啡廳已經沒有熟豆了' });
  let tier = 'C', pts = sack.C;
  const allHigh = ch.length > 0 && ch.every(x => x >= 4);
  const perms = p.perms.filter(c => c.m.includes(sack.m)).length;
  const cons = usable.filter(c => c.kind === 'cons' && c.m.includes(sack.m));
  if (!allHigh) lines.push(ch.length ? '有漿果低於 4 級 → C 級商業豆' : '還沒選漿果');
  else {
    const eq = Math.min(2, perms + cons.length);
    if (eq === 0) lines.push(`漿果都在 4 級以上，但沒有「${M[sack.m]}」設備 → 只能算 C 級商業豆`);
    else {
      const usedCons = cons.slice(0, Math.max(0, eq - perms));
      use.push(...usedCons);
      tier = 'B'; pts = sack.g + (eq >= 2 ? 6 : 3);
      lines.push(`漿果都在 4 級以上 +${sack.g}`);
      lines.push(`${M[sack.m]}設備 ${eq} 項 +${eq >= 2 ? 6 : 3}` + (perms ? `（常駐 ${Math.min(perms, 2)}）` : '') + (usedCons.length ? `（消耗：${usedCons.map(c => c.name).join('、')}）` : ''));
      if (eq >= 2) {
        const f = usable.find(c => c.kind === 'flavor');
        if (f) { use.push(f); tier = 'AA'; pts = sack.g + 6 + sack.fv; lines.push(`${f.name} +${sack.fv}`); }
        else lines.push(`再加一張「風味品種」就能升級 AA（+${sack.fv}）`);
      } else lines.push('再多 1 項設備可以 +6');
    }
  }
  const bonus = usable.filter(c => c.kind === 'bonus' && bonusIds.includes(c.id));
  const bonusPts = bonus.reduce((a, c) => a + c.v, 0);
  const tierName = { C: 'C 級商業豆', B: 'B 級精選豆', AA: 'AA 級國際競標豆' }[tier];
  return { ok: wOk && mOk && sOk && beanOk && ch.length > 0, checks, tier, tierName, pts, sum, use, bonus, bonusPts, lines, sack };
}

function doServe(i, m, idxs, bonusIds) {
  const p = P(i), ev = evalServe(i, m, idxs, bonusIds);
  const sorted = [...idxs].sort((a, b) => b - a);
  sorted.forEach(x => S.pool.push(p.cherries.splice(x, 1)[0]));
  [...ev.use, ...ev.bonus].forEach(c => { p.hand.splice(p.hand.indexOf(c), 1); toBottom(c); });
  const bar = drawCycle('barista'), roast = drawCycle('roast');
  const total = ev.pts + bar.v + roast.v + ev.bonusPts;
  S.sacks[m].pop();
  S.beans--; p.beans++; p.served[m]++;
  addScore(i, total);
  const parts = [`${ev.tierName} ${ev.pts}`, `${bar.name} +${bar.v}`, `${roast.name} +${roast.v}`, ...ev.bonus.map(c => `${c.name} +${c.v}`)];
  log(`${p.name} 出杯「${M[m]}」：${parts.join('、')}，共 ${total} 分`);
  return { total, parts, ev };
}

// ---------------- prompts ----------------
function ask(prompt) { S.prompt = prompt; render(); return new Promise(r => { resolver = r; }); }
function answer(v) { const r = resolver; resolver = null; S.prompt = null; if (r) r(v); }

// ---------------- game flow ----------------
function newState(cfg) {
  const n = cfg.seats.length;
  S = {
    players: cfg.seats.map((s, i) => ({ name: s.name, human: s.human, color: PCOL[i], score: 0, cherries: [], hand: [], perms: [], tools: [], served: { W: 0, N: 0, H: 0 }, beans: 0, forced: false })),
    dealer: 0, round: 0, beans: cfg.beans, weather: null, weatherDeck: shuffle(WEATHER.slice()),
    pool: [], decks: {}, sacks: { W: sackDeck('W'), N: sackDeck('N'), H: sackDeck('H') },
    queues: { farm: [], academy: [], expo: [], cafe: [] }, track: {}, log: [], prompt: null, view: cfg.seats.findIndex(s => s.human), sel: [], active: null, over: false, gid: Math.random(),
  };
  if (S.view < 0) S.view = 0;
  [[1, 10], [2, 11], [3, 11], [4, 12], [5, 11], [6, 9]].forEach(([g, k]) => { for (let j = 0; j < k; j++) S.pool.push(g); });
  S.decks = { academy: academyDeck(), expo: expoDeck(), booth: boothDeck(),
    barista: simpleDeck([['實習咖啡師', 1, 6], ['新進咖啡師', 2, 5], ['資深咖啡師', 3, 4], ['冠軍咖啡師', 5, 1]]),
    roast: simpleDeck([['手網烘焙', 1, 6], ['直火烘豆機', 2, 5], ['半熱風烘豆機', 2, 3], ['熱風烘豆機', 3, 2]]) };
  const sq = shuffle(Array.from({ length: 56 }, (_, k) => k + 5)).slice(0, 10).sort((a, b) => a - b);
  sq.forEach((s, k) => S.track[s] = TOOLS[k % 5]);
  log(`遊戲開始！${n} 位玩家，咖啡廳有 ${cfg.beans} 顆熟豆（= 可以出 ${cfg.beans} 杯）。`);
}

async function run() {
  try { await runInner(); } catch (e) { if (e !== 'stop') throw e; }
}
async function runInner() {
  const gid = S.gid;
  const wait = async (ms) => { await sleep(ms); if (!(S && S.gid === gid)) throw 'stop'; };
  const askG = async (pr) => { const v = await ask(pr); if (!(S && S.gid === gid)) throw 'stop'; return v; };
  // setup harvest
  log('準備：大家一起到莊園搶摘漿果（3 秒）');
  for (let i = 0; i < S.players.length; i++) {
    
    S.active = i;
    const got = P(i).human ? await askG({ type: 'harvest', p: i, first: true }) : botGrab(i);
    
    P(i).cherries.push(...got);
    log(`${nm(i)} 摘到 ${got.length} 顆漿果`);
    render(); if (!P(i).human) await wait(500);
  }
  while (true) {
    
    S.round++;
    S.weather = S.weatherDeck.pop();
    if (!S.weatherDeck.length) S.weatherDeck = shuffle(WEATHER.slice());
    let diceMsg = '';
    if (S.weather.dice) { const d = rint(6) + 1; const lost = Math.min(d, S.beans); S.beans -= lost; diceMsg = `天候卡有骰子圖示：擲出 ${d}，咖啡廳移除 ${lost} 顆熟豆。`; }
    log(`第 ${S.round} 回合，莊家是 ${nm(S.dealer)}。天候：${S.weather.n}。${diceMsg}`);
    S.active = null;
    if (S.players.some(p => p.human)) await askG({ type: 'weather', dice: diceMsg });
    else { render(); await wait(700); }
    
    // placement
    S.queues = { farm: [], academy: [], expo: [], cafe: [] };
    for (let k = 0; k < S.players.length; k++) {
      const i = (S.dealer + k) % S.players.length;
      S.active = i;
      P(i).forced = P(i).cherries.length > 6;
      let a;
      if (P(i).human) { S.view = i; a = await askG({ type: 'place', p: i }); }
      else { render(); await wait(550); a = botPlace(i); }
      
      S.queues[a].push(i);
      log(`${nm(i)} 把咖啡杯放到「${AREAS[a].n}」`);
      render();
    }
    // resolution
    for (const a of ORDER) {
      const q = S.queues[a];
      if (!q.length) continue;
      if (a === 'academy' || a === 'expo') {
        S.sel = [];
        for (let k = 0; k < q.length + 1; k++) { const c = drawDeck(a); if (c) S.sel.push(c); }
      }
      for (const i of q) {
        
        S.active = i;
        if (P(i).human) { S.view = i; await humanTurn(i, a); }
        else { render(); await wait(650); await botTurn(i, a); }
        
        render();
      }
      if (a === 'academy' || a === 'expo') { S.sel.forEach(c => S.decks[a].unshift(c)); S.sel = []; }
    }
    // round end
    S.players.forEach(p => p.hand.forEach(c => c.isNew = false));
    S.dealer = (S.dealer + 1) % S.players.length;
    S.active = null;
    if (S.beans <= 0) break;
    render();
  }
  endGame();
}

function canPlace(i, a) {
  if (S.queues[a].length >= AREAS[a].slots) return false;
  if (P(i).forced && a !== 'farm' && S.queues.farm.length < AREAS.farm.slots) return false;
  return true;
}

async function humanTurn(i, a) {
  S.turn = { p: i, a, acted: false };
  while (true) {
    const cmd = await ask({ type: 'turn', p: i, a });
    if (cmd === 'end') break;
    if (cmd === 'act') {
      const done = await humanAction(i, a);
      if (done) S.turn.acted = true;
    } else if (cmd && cmd.use) await useCard(i, cmd.use, true);
  }
  if (!S.turn.acted) log(`${nm(i)} 這回合 pass`);
  S.turn = null;
}

async function humanAction(i, a) {
  const p = P(i);
  if (a === 'farm') {
    const got = await ask({ type: 'harvest', p: i });
    const msg = applyHarvest(i, got);
    await ask({ type: 'return', p: i, msg });
    return true;
  }
  if (a === 'academy' || a === 'expo') {
    if (!S.sel.length) { toast('牌庫沒有牌了'); return true; }
    const id = await ask({ type: 'pick', p: i, a });
    if (id == null) return false;
    takePick(i, a, id);
    return true;
  }
  if (a === 'cafe') {
    const res = await ask({ type: 'serve', p: i });
    if (!res) return false;
    const r = doServe(i, res.m, res.idxs, res.bonus);
    await ask({ type: 'served', r });
    return true;
  }
}

function applyHarvest(i, got) {
  const p = P(i), h = S.weather.h;
  let msg = `摘到 ${got.length} 顆。`;
  if (h === 1) { const c = drawPool(); if (c) { got.push(c); msg += `天候豐收，多拿 1 顆（${c} 級）。`; } }
  if (h === -1 && got.length) { const k = rint(got.length); const c = got.splice(k, 1)[0]; S.pool.push(c); msg += `天候欠收，少 1 顆（${c} 級放回莊園）。`; }
  p.cherries.push(...got);
  log(`${p.name} 在莊園採收：${msg}`);
  return msg;
}

function takePick(i, a, id) {
  const p = P(i), k = S.sel.findIndex(c => c.id === id);
  const c = S.sel.splice(k, 1)[0];
  c.isNew = true; p.hand.push(c);
  let extra = '';
  if (a === 'expo') { const b = drawDeck('booth'); if (b) { b.isNew = true; p.hand.push(b); extra = `，另外拿到綜合攤位牌「${b.name}」`; } }
  log(`${p.name} 在${AREAS[a].n}拿了「${c.name}」${extra}（下回合才能用）`);
}

async function useCard(i, id, human) {
  const p = P(i), c = p.hand.find(c => c.id === id);
  if (!c || c.isNew) return;
  if (c.kind === 'compost') {
    const got = [drawPool(), drawPool()].filter(x => x != null);
    p.cherries.push(...got);
    p.hand.splice(p.hand.indexOf(c), 1); toBottom(c);
    log(`${p.name} 使用「有機堆肥」，多拿 ${got.length} 顆漿果（${got.join('、')} 級）` + (p.cherries.length > 6 ? '。倉庫超過 6 顆，下回合必須去莊園清倉' : ''));
  } else if (c.kind === 'select') {
    const hiIdx = S.pool.findIndex(g => g >= 5);
    if (!p.cherries.length || hiIdx < 0) { if (human) toast('現在沒辦法使用'); return; }
    const lo = p.cherries.indexOf(Math.min(...p.cherries));
    const old = p.cherries[lo]; const nw = S.pool.splice(hiIdx, 1)[0];
    p.cherries[lo] = nw; S.pool.push(old);
    p.hand.splice(p.hand.indexOf(c), 1); toBottom(c);
    log(`${p.name} 使用「篩選採收」，${old} 級漿果換成 ${nw} 級`);
  } else if (c.kind === 'perm') {
    let idxs;
    if (human) { idxs = await ask({ type: 'build', p: i, card: c }); if (!idxs) return; }
    else idxs = botPayIdxs(i, 10);
    if (!idxs) return;
    [...idxs].sort((a, b) => b - a).forEach(x => S.pool.push(p.cherries.splice(x, 1)[0]));
    p.hand.splice(p.hand.indexOf(c), 1); p.perms.push(c);
    log(`${p.name} 用漿果建設了常駐設備「${c.name}」（${c.m.map(x => M[x]).join('／')}）`);
  }
  render();
}

// ---------------- bots ----------------
function botGrab(i) {
  const k = 3 + rint(3), got = [];
  for (let j = 0; j < k; j++) {
    // peek at 3 random cherries, take the ripest-looking one
    const cand = [rint(S.pool.length), rint(S.pool.length), rint(S.pool.length)].filter((v, x, arr) => arr.indexOf(v) === x);
    if (!S.pool.length) break;
    let best = cand[0]; cand.forEach(x => { if (S.pool[x] > S.pool[best]) best = x; });
    got.push(S.pool.splice(best, 1)[0]);
  }
  return got.slice(0, 6);
}
function botBestServe(i) {
  const p = P(i), n = p.cherries.length;
  if (!n || S.beans <= 0) return null;
  const bonusIds = p.hand.filter(c => c.kind === 'bonus' && !c.isNew).map(c => c.id);
  let best = null;
  for (const m of ['W', 'N', 'H']) {
    if (!S.sacks[m].length) continue;
    for (let mask = 1; mask < (1 << Math.min(n, 9)); mask++) {
      const idxs = []; for (let b = 0; b < n; b++) if (mask & (1 << b)) idxs.push(b);
      const ev = evalServe(i, m, idxs, bonusIds);
      if (!ev || !ev.ok) continue;
      const val = ev.pts + ev.bonusPts - 0.25 * ev.sum - 0.4 * ev.use.length;
      if (!best || val > best.val) best = { m, idxs, bonus: bonusIds, val, ev };
    }
  }
  return best;
}
function botPayIdxs(i, need) {
  const p = P(i);
  const order = p.cherries.map((g, x) => [g, x]).sort((a, b) => a[0] - b[0]);
  let sum = 0; const idxs = [];
  for (const [g, x] of order) { if (sum >= need) break; idxs.push(x); sum += g; }
  return sum >= need ? idxs : null;
}
function botPlace(i) {
  const p = P(i);
  const opts = ORDER.filter(a => canPlace(i, a));
  if (opts.length === 1) return opts[0];
  const best = botBestServe(i);
  if (best && opts.includes('cafe') && (best.ev.pts >= 7 || p.cherries.length >= 5 || S.beans <= 3)) return 'cafe';
  const high = p.cherries.filter(g => g >= 4).reduce((a, b) => a + b, 0);
  if ((p.cherries.length < 3 || high < 10) && opts.includes('farm') && p.cherries.length < 6) return 'farm';
  const eqCount = p.hand.filter(c => c.kind === 'cons').length + p.perms.length;
  const hasFlavor = p.hand.some(c => c.kind === 'flavor');
  if (eqCount < 2 && opts.includes('expo')) return 'expo';
  if (!hasFlavor && opts.includes('academy')) return 'academy';
  if (best && opts.includes('cafe')) return 'cafe';
  return opts[rint(opts.length)];
}
async function botTurn(i, a) {
  const p = P(i);
  for (const c of p.hand.filter(c => !c.isNew)) {
    if (c.kind === 'compost' && p.cherries.length <= 3) await useCard(i, c.id, false);
    else if (c.kind === 'select' && p.cherries.some(g => g <= 2)) await useCard(i, c.id, false);
    else if (c.kind === 'perm' && p.cherries.length >= 5 && !p.perms.some(x => x.m[0] === c.m[0])) await useCard(i, c.id, false);
  }
  if (a === 'farm') {
    const got = botGrab(i);
    applyHarvest(i, got);
    while (p.cherries.length > 6) { const lo = p.cherries.indexOf(Math.min(...p.cherries)); S.pool.push(p.cherries.splice(lo, 1)[0]); }
    // also toss grade-1 cherries if storage is crowded
    if (p.cherries.length >= 5) { const k = p.cherries.indexOf(1); if (k >= 0) S.pool.push(p.cherries.splice(k, 1)[0]); }
  } else if (a === 'academy' || a === 'expo') {
    if (!S.sel.length) return;
    const hasFlavor = p.hand.some(c => c.kind === 'flavor');
    const score = (c) => ({ flavor: hasFlavor ? 1 : 5, cons: 3, perm: p.perms.length ? 1.5 : 2.6, shade: 2, mknow: 2, compost: 1.8, select: 1.8 }[c.kind] || 1) + Math.random() * 0.5;
    const best = S.sel.slice().sort((x, y) => score(y) - score(x))[0];
    takePick(i, a, best.id);
  } else if (a === 'cafe') {
    const best = botBestServe(i);
    if (best) doServe(i, best.m, best.idxs, best.bonus);
    else log(`${p.name} 在咖啡廳湊不出條件，這回合沒出杯`);
  }
}

// ---------------- end ----------------
function extras(i) {
  const p = P(i), out = [];
  const sets = Math.min(p.served.W, p.served.N, p.served.H);
  if (sets) out.push(['三種處理法都出過杯', sets * 5]);
  for (const m of ['W', 'N', 'H']) {
    const mx = Math.max(...S.players.map(q => q.served[m]));
    if (p.served[m] >= 3 && p.served[m] === mx) out.push([`${M[m]}出 3 杯以上且全場最多`, 10]);
  }
  const hi = p.cherries.filter(g => g >= 5).length;
  if (hi) out.push([`手上 5～6 級漿果 ${hi} 顆`, hi]);
  if (p.perms.length) out.push([`購買常駐設備 ${p.perms.length} 項`, p.perms.length * 3]);
  const cnt = {}; p.hand.filter(c => c.kind === 'cons').forEach(c => cnt[c.m[0]] = (cnt[c.m[0]] || 0) + 1);
  const pairs = Object.values(cnt).reduce((a, k) => a + Math.floor(k / 2), 0);
  if (pairs) out.push([`未用的同處理法設備卡 ${pairs} 組`, pairs * 2]);
  const kinds = new Set(p.tools).size;
  if (kinds) out.push([`沖煮器具 ${kinds} 種`, kinds * 5]);
  return out;
}
function endGame() {
  S.over = true; S.active = null;
  const rows = S.players.map((p, i) => { const ex = extras(i); return { i, ex, base: p.score, total: p.score + ex.reduce((a, e) => a + e[1], 0) }; });
  const top = Math.max(...rows.map(r => r.total));
  log(`遊戲結束！${rows.filter(r => r.total === top).map(r => nm(r.i)).join('、')} 獲勝`);
  ask({ type: 'end', rows, top });
}

function hintFor(i) {
  const p = P(i);
  if (p.forced) return '你的倉庫超過 6 顆，這回合只能去咖啡莊園清倉。';
  const best = botBestServe(i);
  if (best) return `提示：你現在可以出杯（${M[best.m]}，${best.ev.tierName} ${best.ev.pts} 分），可以去咖啡廳。`;
  if (p.cherries.length < 3) return '提示：漿果不多，先去咖啡莊園採收。';
  const eq = p.hand.filter(c => c.kind === 'cons').length + p.perms.length;
  if (eq === 0) return '提示：想拿 B 級以上的分數，需要加工設備（咖啡博覽會）。';
  if (!p.hand.some(c => c.kind === 'flavor')) return '提示：有 2 項設備 + 風味品種（農業知識學院）就能做 AA 級 22 分。';
  return '提示：看看咖啡廳三張計分卡，需要什麼條件。';
}

function sheetHarvest(pr) {
  const p = P(pr.p);
  const sample = [];
  const n = Math.min(22, S.pool.length);
  for (let k = 0; k < n; k++) sample.push(S.pool.splice(rint(S.pool.length), 1)[0]);
  const cols = 6, rows = Math.ceil(n / cols);
  const pos = shuffle(Array.from({ length: cols * rows }, (_, k) => k)).slice(0, n);
  const m = openSheet(`<h2>${esc(p.name)}：採收咖啡漿果</h2>
    <p>按「開始」後 <b>3 秒</b>內點漿果，一次拿一顆，最多 6 顆。顏色越深越成熟、等級越高。</p>
    <div class="ripe">成熟度：${[1, 2, 3, 4, 5, 6].map(g => cherryHTML(g, true) + g + '級').join(' ')}</div>
    <div class="timer"><i id="tbar"></i></div>
    <div class="field" id="field">
      ${Array.from({ length: 9 }, () => `<span class="leaf" style="left:${rint(90)}%;top:${rint(90)}%;transform:rotate(${rint(180)}deg)"></span>`).join('')}
      ${sample.map((g, k) => { const c = pos[k] % cols, r = Math.floor(pos[k] / cols);
        return `<button class="cherry" data-k="${k}" disabled style="background:${GC[g]};left:calc(${(c + 0.5) * 100 / cols}% - 17px + ${rint(16) - 8}px);top:calc(${(r + 0.5) * 100 / rows}% - 17px + ${rint(14) - 7}px)" aria-label="漿果"></button>`; }).join('')}
    </div>
    <div class="grabbed" id="grabbed"></div>
    <div class="row"><button class="btn dark" id="go">開始！</button></div>`);
  m.dataset.keep = '1';
  const got = [];
  let done = false, t0 = 0, raf = 0;
  const finish = () => {
    if (done) return; done = true; cancelAnimationFrame(raf);
    m.querySelectorAll('.field .cherry').forEach(b => b.disabled = true);
    sample.forEach((g, k) => { if (!got.some(x => x.k === k)) S.pool.push(g); });
    $('#tbar', m).style.transform = 'scaleX(0)';
    const btn = $('#go', m);
    btn.textContent = `收進倉庫（${got.length} 顆）`; btn.disabled = false;
    btn.onclick = () => { closeSheet(); answer(got.map(x => x.g)); };
  };
  m.querySelectorAll('.field .cherry').forEach(b => b.onclick = () => {
    if (done) return;
    const k = +b.dataset.k; b.classList.add('got');
    got.push({ k, g: sample[k] });
    $('#grabbed', m).insertAdjacentHTML('beforeend', cherryHTML(sample[k]));
    if (got.length >= 6) finish();
  });
  $('#go', m).onclick = () => {
    $('#go', m).disabled = true; $('#go', m).textContent = '採收中…';
    m.querySelectorAll('.field .cherry').forEach(b => b.disabled = false);
    t0 = performance.now();
    const tick = (now) => { const f = Math.max(0, 1 - (now - t0) / 3000); $('#tbar', m).style.transform = `scaleX(${f})`; if (f <= 0) finish(); else raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
  };
  return m;
}

function sheetReturn(pr) {
  const p = P(pr.p);
  const sel = new Set();
  const m = openSheet(`<h2>清倉</h2><p>${esc(pr.msg)}</p><p class="small muted">倉庫最多放 6 顆。可以點選不要的漿果放回莊園（例如還沒成熟的青綠果）。</p>
    <div class="storage" id="st"></div><p class="small" id="info"></p><div class="row"><button class="btn dark" id="ok"></button></div>`);
  const draw = () => {
    $('#st', m).innerHTML = p.cherries.map((g, k) => `<button class="tapcherry ${sel.has(k) ? 'sel' : ''}" data-k="${k}">${cherryHTML(g)}</button>`).join('');
    m.querySelectorAll('.tapcherry').forEach(b => b.onclick = () => { const k = +b.dataset.k; sel.has(k) ? sel.delete(k) : sel.add(k); draw(); });
    const left = p.cherries.length - sel.size;
    $('#info', m).innerHTML = left > 6 ? `<span class="bad">還要放回 ${left - 6} 顆</span>` : `留下 ${left} 顆`;
    const ok = $('#ok', m); ok.disabled = left > 6; ok.textContent = sel.size ? `放回 ${sel.size} 顆，完成` : '不用清倉，完成';
  };
  draw();
  $('#ok', m).onclick = () => {
    [...sel].sort((a, b) => b - a).forEach(k => S.pool.push(p.cherries.splice(k, 1)[0]));
    if (sel.size) log(`${p.name} 清倉，放回 ${sel.size} 顆漿果`);
    closeSheet(); answer(true);
  };
  return m;
}

  const isExpo = pr.a === 'expo';
  const m = openSheet(`<h2>${AREAS[pr.a].n}：選一張牌</h2>
    <p class="small muted">選牌區有 ${S.sel.length} 張（排隊人數 + 1）。照排隊順序每人選一張，剩下的放回牌庫。${isExpo ? '選完再從上方拿一張綜合攤位牌。' : ''}拿到的牌下回合才能用。</p>
    <div class="cards">${S.sel.map(c => cardHTML(c, 'pick')).join('')}</div>
    <div class="row"><button class="btn ghost" id="cancel">先不選，回去</button></div>`);
  m.querySelectorAll('.gcard.pickable').forEach(el => el.onclick = () => { closeSheet(); answer(+el.dataset.id); });
  $('#cancel', m).onclick = () => { closeSheet(); answer(null); };
  return m;
}

function sheetServe(pr) {
  const i = pr.p, p = P(i);
  let m0 = SO.find(m => S.sacks[m].length && S.weather.ok.includes(m)) || SO.find(m => S.sacks[m].length);
  const sel = new Set();
  const bonusAvail = p.hand.filter(c => c.kind === 'bonus' && !c.isNew);
  const bon = new Set(bonusAvail.map(c => c.id));
  const m = openSheet(`<h2>咖啡廳：出杯</h2>
    <p class="small muted">1. 選一張麻布袋計分卡　2. 點選要交出的漿果　3. 確認條件都打勾</p>
    <div class="sackpick" id="sp"></div>
    <div class="storage" id="st"></div>
    <div class="checks" id="ck"></div>
    ${bonusAvail.length ? `<div class="sec"><b class="small">綜合攤位牌（出杯加分）</b>${bonusAvail.map(c => `<label class="toggle"><input type="checkbox" data-b="${c.id}" checked> ${c.name} +${c.v}</label>`).join('')}</div>` : ''}
    <div class="breakdown" id="bd"></div>
    <div class="row"><button class="btn dark" id="ok">出杯！</button><button class="btn ghost" id="cancel">先不出杯</button></div>`);
  const draw = () => {
    $('#sp', m).innerHTML = SO.map(k => { const s = S.sacks[k][S.sacks[k].length - 1];
      return `<button class="sack ${k === m0 ? 'sel' : ''} ${s ? '' : 'empty'}" data-m="${k}" ${s ? '' : 'disabled'}>${sackHTML(s, k)}</button>`; }).join('');
    m.querySelectorAll('#sp .sack').forEach(b => b.onclick = () => { m0 = b.dataset.m; draw(); });
    $('#st', m).innerHTML = p.cherries.map((g, k) => `<button class="tapcherry ${sel.has(k) ? 'sel' : ''}" data-k="${k}">${cherryHTML(g)}</button>`).join('') || '<span class="muted small">倉庫沒有漿果</span>';
    m.querySelectorAll('#st .tapcherry').forEach(b => b.onclick = () => { const k = +b.dataset.k; sel.has(k) ? sel.delete(k) : sel.add(k); draw(); });
    const ev = m0 ? evalServe(i, m0, [...sel], [...bon]) : null;
    if (!ev) { $('#ck', m).innerHTML = '<span class="bad">沒有計分卡了</span>'; $('#ok', m).disabled = true; $('#bd', m).innerHTML = ''; return; }
    $('#ck', m).innerHTML = ev.checks.map(c => `<div class="${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✗'} <span style="color:var(--ink);font-weight:400">${c.t}</span></div>`).join('');
    $('#bd', m).innerHTML = `<div class="big">${ev.tierName}：${ev.pts} 分</div>${ev.lines.map(l => `<div>· ${esc(l)}</div>`).join('')}
      ${ev.bonusPts ? `<div>· 綜合攤位牌 +${ev.bonusPts}</div>` : ''}<div>· 出杯時再從咖啡師、烘焙器具牌庫各翻一張加分</div>
      ${ev.use.length ? `<div class="muted small">會用掉：${ev.use.map(c => c.name).join('、')}</div>` : ''}`;
    $('#ok', m).disabled = !ev.ok;
  };
  m.querySelectorAll('[data-b]').forEach(cb => cb.onchange = () => { const id = +cb.dataset.b; cb.checked ? bon.add(id) : bon.delete(id); draw(); });
  draw();
  $('#ok', m).onclick = () => { closeSheet(); answer({ m: m0, idxs: [...sel], bonus: [...bon] }); };
  $('#cancel', m).onclick = () => { closeSheet(); answer(null); };
  return m;
}

function sheetServed(pr) {
  const r = pr.r;
  const m = openSheet(`<h2>出杯成功！+${r.total} 分</h2>
    <div class="breakdown">${r.parts.map(x => `<div>· ${esc(x)}</div>`).join('')}<div class="big">合計 ${r.total} 分</div></div>
    <p class="small muted">從咖啡廳拿一顆熟豆放到你的「客人區」。麻布袋計分卡被拿走後，翻開下一張。</p>
    <button class="btn dark" id="ok">好</button>`);
  $('#ok', m).onclick = () => { closeSheet(); answer(true); };
  return m;
}

function sheetBuild(pr) {
  const p = P(pr.p), c = pr.card, sel = new Set();
  const m = openSheet(`<h2>建設「${c.name}」</h2><p class="small">${c.text}</p><p class="small muted">選要付出的漿果，點數總和要 10 以上。付出的漿果放回莊園。</p>
    <div class="storage" id="st"></div><p id="info" class="small"></p>
    <div class="row"><button class="btn dark" id="ok">建設</button><button class="btn ghost" id="cancel">取消</button></div>`);
  const draw = () => {
    $('#st', m).innerHTML = p.cherries.map((g, k) => `<button class="tapcherry ${sel.has(k) ? 'sel' : ''}" data-k="${k}">${cherryHTML(g)}</button>`).join('');
    m.querySelectorAll('.tapcherry').forEach(b => b.onclick = () => { const k = +b.dataset.k; sel.has(k) ? sel.delete(k) : sel.add(k); draw(); });
    const sum = [...sel].reduce((a, k) => a + p.cherries[k], 0);
    $('#info', m).innerHTML = `已選總和 ${sum} ${sum >= 10 ? '<span class="ok">✓</span>' : '<span class="bad">（不到 10）</span>'}`;
    $('#ok', m).disabled = sum < 10;
  };
  draw();
  $('#ok', m).onclick = () => { closeSheet(); answer([...sel]); };
  $('#cancel', m).onclick = () => { closeSheet(); answer(null); };
  return m;
}

function sheetEnd(pr) {
  S.endPrompt = pr;
  const winners = pr.rows.filter(r => r.total === pr.top).map(r => nm(r.i)).join('、');
  const m = openSheet(`<h2>遊戲結束：${esc(winners)} 獲勝！</h2>
    <p class="small muted">咖啡廳的熟豆用完了，這一回合做完後結算。</p>
    ${pr.rows.map(r => `<div class="breakdown"><b>${esc(nm(r.i))}</b>：出杯得分 ${r.base}
      ${r.ex.map(e => `<div>· ${esc(e[0])} +${e[1]}</div>`).join('') || '<div class="muted">· 沒有額外加分</div>'}
      <div class="big">總分 ${r.total}</div></div>`).join('')}
    <div class="row"><button class="btn dark" id="again">再玩一次</button><button class="btn ghost" id="close">看盤面</button></div>`);
  $('#again', m).onclick = () => { closeSheet(); S = null; render(); };
  $('#close', m).onclick = () => { closeSheet(); S.prompt = null; render(); };
  return m;
}

function confirmQuit() {
  const m = openSheet(`<h2>重新開始？</h2><p>這一局的進度會消失。</p><div class="row"><button class="btn dark" id="y">重新開始</button><button class="btn ghost" id="n">繼續玩</button></div>`);
  m.dataset.keep = '1';
  $('#y', m).onclick = () => { closeSheet(); if (S) S.gid = -1; resolver = null; S = null; render(); };
  $('#n', m).onclick = () => { closeSheet(); renderSheet(); };
}

const RULES = `<div class="rules sec">
  <h2>怎麼玩（白話版）</h2>
  <p>你經營一間咖啡廳，要從種咖啡一路做到端出一杯咖啡：<b>採收漿果 → 學農業知識、買加工設備 → 在咖啡廳出杯得分</b>。咖啡廳的熟豆（= 能出的杯數）用完時，做完那一回合遊戲結束，總分最高的人贏。</p>
  <h3>每一回合</h3>
  <ol>
    <li><b>翻天候卡</b>：決定這回合的天氣（晴／陰／雨）、收成（豐收多 1 顆、欠收少 1 顆）、適合哪些處理法。有骰子圖示就擲骰，咖啡廳少掉那麼多顆熟豆。</li>
    <li><b>放咖啡杯</b>：從莊家開始，每人把自己的咖啡杯放到一個區域排隊（每區格子有限）。</li>
    <li><b>執行</b>：照「莊園 → 學院 → 博覽會 → 咖啡廳」的順序，同一區照排隊順序輪流。輪到你時可以：用手牌、執行區域動作，或 pass。</li>
    <li>莊家換下一位，下一回合。</li>
  </ol>
  <h3>四個區域</h3>
  <ul>
    <li><b>咖啡莊園</b>：3 秒內用手抓漿果（一次一顆）。漿果分 1～6 級，顏色越深越熟。倉庫最多 6 顆，也可以把不要的放回去（清倉）。</li>
    <li><b>農業知識學院</b>：翻開「排隊人數 + 1」張牌，照順序每人選一張。<b>風味品種</b>只有這裡有。</li>
    <li><b>咖啡博覽會</b>：一樣翻開「排隊人數 + 1」張加工設備卡選一張，另外再拿一張綜合攤位牌。設備分「消耗卡」（出杯時用掉）和「常駐卡」（付點數 10 以上的漿果建設，永久使用）。</li>
    <li><b>咖啡廳</b>：選一張麻布袋計分卡出杯。</li>
  </ul>
  <p>學院和博覽會拿到的牌<b>下回合才能用</b>。</p>
  <h3>出杯怎麼算分（最重要）</h3>
  <ol>
    <li>必要條件：天候卡上有這張計分卡的處理法圖案（日曬☀／水洗💧／蜜處理🍯）、天氣符合計分卡、交出的漿果<b>點數總和大於 9</b>。</li>
    <li>等級：<br>C 級商業豆：條件達到就有（約 1 分）。<br>B 級精選豆：漿果<b>全部 4 級以上</b> + 該處理法設備 1 項（7 分）或 2 項（10 分）。<br>AA 級國際競標豆：4 級以上 + 2 項設備 + 風味品種（看計分卡，17 或 22 分）。</li>
    <li>再加：從咖啡師牌庫、烘焙器具牌庫各翻一張的分數，加上你想用的綜合攤位牌。</li>
    <li>說明書範例：B 級 10 + 咖啡師 2 + 烘焙器具 1 + 攤位牌 2 = 15 分。</li>
    <li>個人圖板範例：天氣適合蜜處理，用 4 級豆 ×3 顆，已建置設備 ×2 張，沒有風味品種 → 4 + 6 = 10 分。</li>
  </ol>
  <h3>結束時的額外加分</h3>
  <ol>
    <li>三種處理法都出過杯：每組 +5</li>
    <li>同一種處理法出 3 杯以上且全場最多：+10</li>
    <li>手上 5、6 級的漿果：每顆 +1</li>
    <li>買了常駐設備：每項 +3</li>
    <li>手上沒用的同處理法設備卡：每 2 張 +2</li>
    <li>收集到的沖煮器具：每種 +5（沖煮器具放在計分軌上，分數經過那格就拿走）</li>
  </ol>
  <h3>這個電腦版的補充</h3>
  <ul>
    <li>說明書沒寫清楚的地方，這裡這樣處理：區域執行順序固定為 莊園 → 學院 → 博覽會 → 咖啡廳（簡易版）。</li>
    <li>計分卡、天候卡、知識卡、設備卡的內容是照說明書的範例自己設計的，實體卡片可能不完全一樣。</li>
    <li>沖煮器具隨機放在計分軌第 5～60 格（實體遊戲是大家輪流自己選格子）。用過的卡直接放回牌庫底部。</li>
    <li>畫面上的區域位置照實體底板排：上面咖啡廳，左邊咖啡博覽會，右邊咖啡莊園和農業知識學院。三個麻布袋順序是 蜜處理、日曬、水洗。</li>
    <li>所有人的資訊都公開，方便一起學。</li>
  </ul>
</div>`;
function showRules() {
  const m = openSheet(RULES + '<button class="btn dark" id="ok">知道了</button>');
  m.dataset.keep = '1';
  $('#ok', m).onclick = () => { closeSheet(); renderSheet(); };
}

// ---------------- setup ----------------
function renderSetup() {
  $('#bar').hidden = true;
  if (!setupCfg) setupCfg = { n: 3, seats: [{ name: '你', human: true }, { name: '電腦 阿豆', human: false }, { name: '電腦 小莓', human: false }, { name: '電腦 老農', human: false }, { name: '電腦 阿焙', human: false }, { name: '電腦 小拿', human: false }], beans: null };
  const c = setupCfg;
  const beans = c.beans ?? c.n * 4;
  $('#app').innerHTML = `
  <div class="topbar"><h1>從種子到杯子</h1><button class="pill" id="rulesBtn">規則</button></div>
  <p style="margin:0;color:var(--soft2);line-height:1.5">咖啡供應鏈桌遊的電腦版。從莊園採收漿果、學農業知識、買加工設備，最後在咖啡廳端出一杯好咖啡得分。</p>
  <div class="panel setup">
    <div class="sec"><h3>玩家人數</h3><div class="seg">${[2, 3, 4, 5, 6].map(n => `<button data-n="${n}" class="${c.n === n ? 'on' : ''}">${n} 人</button>`).join('')}</div></div>
    <div class="sec"><h3>座位</h3>
      ${c.seats.slice(0, c.n).map((s, i) => `<div class="seatrow"><span class="cup" style="background:${PCOL[i]}"></span>
        <input id="nm${i}" value="${esc(s.name)}" maxlength="8" aria-label="名字">
        <div class="seg"><button data-h="${i}" class="${s.human ? 'on' : ''}">真人</button><button data-c="${i}" class="${s.human ? '' : 'on'}">電腦</button></div></div>`).join('')}
      <span class="small muted">好幾個真人可以輪流用同一支手機玩。</span></div>
    <div class="sec"><h3>咖啡廳熟豆（= 這局總共能出幾杯）</h3>
      <div class="row" style="display:flex;gap:8px;align-items:center"><button class="btn ghost" id="bm">－</button><b style="font-size:1.2rem;min-width:2em;text-align:center">${beans}</b><button class="btn ghost" id="bp">＋</button><span class="small muted">說明書建議：人數 × 4</span></div></div>
    <button class="btn dark" id="start" style="align-self:flex-start;font-size:1.05rem">開始遊戲</button>
  </div>
  <div class="panel">${RULES}</div>`;
  const save = () => c.seats.slice(0, c.n).forEach((s, i) => { s.name = $('#nm' + i).value.trim() || `玩家${i + 1}`; });
  $('#rulesBtn').onclick = showRules;
  document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { save(); c.n = +b.dataset.n; c.beans = null; renderSetup(); });
  document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { save(); const s = c.seats[+b.dataset.h]; s.human = true; if (s.name.startsWith('電腦')) s.name = `玩家${+b.dataset.h + 1}`; renderSetup(); });
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { save(); const s = c.seats[+b.dataset.c]; s.human = false; if (!s.name.startsWith('電腦')) s.name = '電腦 ' + ['', '阿豆', '小莓', '老農', '阿焙', '小拿'][+b.dataset.c] || '阿豆'; renderSetup(); });
  $('#bm').onclick = () => { save(); c.beans = Math.max(c.n * 2, beans - 1); renderSetup(); };
  $('#bp').onclick = () => { save(); c.beans = Math.min(c.n * 8, beans + 1); renderSetup(); };
  $('#start').onclick = () => {
    save();
    newState({ seats: c.seats.slice(0, c.n).map(s => ({ ...s })), beans });
    render();
    run();
  };
}

window.__coffee = () => S;
render();
})();
</script>

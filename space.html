<style>

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%); background: rgba(6,24,40,.92); border: 1px solid var(--cyan); color: var(--ink); border-radius: 10px; padding: 8px 16px; font-weight: 700; z-index: 30; pointer-events: none; animation: tst 2.6s forwards; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }

@media (prefers-reduced-motion: reduce) { .toast { animation-duration: .01s; } }

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
  const fmt = n => Math.round(n).toLocaleString('en-US');
  const ang = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };

  // ---------- 遊戲資料 ----------
  // 船級: 尺寸 (畫面像素), 船體, 護盾, 速度, 轉向, 貨艙, 砲塔數, 單發傷害, 射速 (每秒), 射程, 挖礦速度 (每秒), 價格, 需要的聲望 (完成任務數)
  const SHIPS = [
    { name: '護衛艦', en: 'Corvette', size: 22, hull: 100, shield: 60, speed: 300, turn: 3.6, cargo: 20, guns: 1, dmg: 8, rate: 3, range: 420, mine: .45, price: 0, rep: 0, col: '#9fc6e6' },
    { name: '驅逐艦', en: 'Destroyer', size: 34, hull: 280, shield: 160, speed: 285, turn: 3.0, cargo: 40, guns: 2, dmg: 11, rate: 3, range: 470, mine: .75, price: 6000, rep: 3, col: '#a9d3b6' },
    { name: '巡洋艦', en: 'Cruiser', size: 50, hull: 650, shield: 380, speed: 265, turn: 2.4, cargo: 75, guns: 3, dmg: 15, rate: 3, range: 520, mine: 1.2, price: 20000, rep: 8, col: '#d7c99a' },
    { name: '戰鬥巡洋艦', en: 'Battlecruiser', size: 70, hull: 1300, shield: 760, speed: 255, turn: 1.9, cargo: 120, guns: 4, dmg: 20, rate: 3, range: 580, mine: 1.7, price: 52000, rep: 14, col: '#c9b0e0' },
    { name: '戰艦', en: 'Battleship', size: 94, hull: 2600, shield: 1500, speed: 240, turn: 1.5, cargo: 180, guns: 6, dmg: 26, rate: 3, range: 650, mine: 2.4, price: 110000, rep: 22, col: '#e6a98f' },
  ];
  // 改裝: 每級 +15%, 5 級; 價格 = 基本 × 船級係數 × 級數
  const UPG = [
    { k: 'weapon', name: '武器', icon: '🔫', desc: '傷害 +15%', base: 400 },
    { k: 'shield', name: '護盾', icon: '🛡', desc: '護盾 +15%、回充更快', base: 350 },
    { k: 'armor', name: '裝甲', icon: '🧱', desc: '船體 +15%', base: 350 },
    { k: 'cargo', name: '貨艙', icon: '📦', desc: '貨艙 +15%', base: 300 },
    { k: 'engine', name: '引擎', icon: '🚀', desc: '速度 +8%', base: 300 },
    { k: 'mining', name: '採礦雷射', icon: '⛏', desc: '挖礦速度 +20%', base: 250 },
  ];
  // 貨物: 基本價格
  const GOODS = [
    { k: 'ore', name: '礦石', base: 22 }, { k: 'crystal', name: '晶體', base: 95 },
    { k: 'food', name: '糧食', base: 40 }, { k: 'parts', name: '零件', base: 120 }, { k: 'meds', name: '醫藥', base: 210 }, { k: 'lux', name: '奢侈品', base: 380 },
  ];
  // 星系: 名稱, 危險度 (0~4), 站名, 各貨物價格倍率 (<1 便宜好買, >1 貴好賣), 小行星數量, 晶體比例, 位置 (星圖)
  const SYS = [
    { name: '新港', danger: 0, station: '新港站', px: { ore: 1.0, crystal: 1.0, food: .75, parts: 1.15, meds: 1.1, lux: 1.25 }, rocks: 26, crystal: .08, mx: 90, my: 150, color: '#3b7bd8' },
    { name: '礦脈帶', danger: 1, station: '礦業前哨', px: { ore: .8, crystal: .85, food: 1.3, parts: 1.25, meds: 1.2, lux: 1.1 }, rocks: 46, crystal: .25, mx: 220, my: 60, color: '#b98a4a' },
    { name: '商業星', danger: 1, station: '自由貿易港', px: { ore: 1.2, crystal: 1.3, food: 1.05, parts: .78, meds: .85, lux: .8 }, rocks: 16, crystal: .1, mx: 230, my: 230, color: '#3fc48a' },
    { name: '邊境', danger: 2, station: '邊境要塞', px: { ore: 1.15, crystal: 1.2, food: 1.35, parts: 1.3, meds: 1.45, lux: 1.0 }, rocks: 34, crystal: .3, mx: 360, my: 150, color: '#c85a3a' },
    { name: '黑霧星雲', danger: 3, station: null, px: null, rocks: 30, crystal: .45, mx: 480, my: 150, color: '#7a3ac8' },
  ];
  const LINKS = [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4], [1, 2]];
  // 海盜
  const PIR = [
    { name: '海盜快艇', size: 18, hull: 45, dmg: 5, rate: 1.3, speed: 290, range: 380, bounty: 140, col: '#c0503a' },
    { name: '海盜砲艇', size: 26, hull: 140, dmg: 9, rate: 1.3, speed: 265, range: 420, bounty: 380, col: '#b8462e' },
    { name: '海盜巡防艦', size: 40, hull: 480, dmg: 15, rate: 1.5, speed: 245, range: 480, bounty: 1150, col: '#a63c2a' },
    { name: '海盜驅逐艦', size: 58, hull: 1300, dmg: 24, rate: 1.8, speed: 225, range: 540, bounty: 2900, col: '#962e22' },
    { name: '海盜旗艦「赤牙」', size: 130, hull: 40000, dmg: 40, rate: 4, speed: 150, range: 640, bounty: 40000, col: '#7e1c14', boss: true },

  const WORLD = 5200;   // 每個星系是 5200 × 5200 的正方形 (中心 0, 0)

  // ---------- 狀態 ----------
  let S = null;        // 存檔的部分
  let W = null;        // 目前星系的物件 (不存檔)
  function newSave() {
    return { credits: 800, rep: 0, kills: 0, cls: 0, up: { weapon: 0, shield: 0, armor: 0, cargo: 0, engine: 0, mining: 0 }, cargo: {}, sys: 0, x: 0, y: 260, hull: null, shield: null,
      missions: [], offers: {}, bossDead: false, time: 0, won: false, prices: {}, lastStation: 0, seed: Math.random() * 1e9 | 0 };
  }
  const st = () => {
    const b = SHIPS[S.cls], u = S.up, m = k => 1 + .15 * u[k];
    return { ...b, hull: b.hull * m('armor'), shield: b.shield * m('shield'), cargo: Math.round(b.cargo * m('cargo')), dmg: b.dmg * m('weapon'), speed: b.speed * (1 + .08 * u.engine), mine: b.mine * (1 + .2 * u.mining), regen: (b.shield * m('shield')) * (.06 + .015 * u.shield) };
  };
  const cargoUsed = () => Object.values(S.cargo).reduce((a, b) => a + b, 0) + S.missions.filter(m => m.type === 'deliver').reduce((a, m) => a + m.n, 0);

  // ---------- 畫面 ----------
  const cv = $('cv'), g = cv.getContext('2d');
  let VW = 0, VH = 0, DPR = 1;
  function resize() { DPR = Math.min(2.5, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; }
  addEventListener('resize', resize); resize();
  // 背景星空 (三層視差)
  const stars = [0, 1, 2].map(l => Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), r: (l + 1) * .5 + Math.random() * .6, a: .3 + Math.random() * .6 })));

  function gunPos(k, i, s) {
    const n = SHIPS[k].guns;
    if (n === 1) return [s * .3, 0];
    const row = i % 2 ? 1 : -1, col = Math.floor(i / 2), cols = Math.ceil(n / 2);
    return [s * (.45 - col * 1.0 / cols), row * s * .22];
  }
  function shade(hex, f) {

    if (!S.time) setTimeout(() => toast('先在附近挖礦（靠近小行星），再回太空站賣掉！'), 600);
  }
  $('newBtn').addEventListener('click', () => { ac(); if (load() && !confirm('開始新遊戲會蓋掉之前的存檔，確定嗎？')) return; start(newSave()); });
  $('contBtn').addEventListener('click', () => { ac(); const s = load(); if (s) start(s); });
  $('contBtn').hidden = !load();
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  requestAnimationFrame(frame);
  window.__sc = { get S() { return S; }, get W() { return W; }, get pl() { return pl; }, SHIPS, PIR, SYS, dock, jump, update, st, cargoUsed, killPirate, start, newSave };
})();
</script>
</html>

<style>

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; overflow: hidden; background: #02050b; color: var(--ink); font-family: var(--f-ui); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }

.bigBtn.gold { background: linear-gradient(#ffe08a, #f0a92a); box-shadow: 0 0 18px rgba(255,201,74,.6); color: #3a2400; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%); background: rgba(6,24,40,.92); border: 1px solid var(--cyan); color: var(--ink); border-radius: 10px; padding: 8px 16px; font-weight: 700; z-index: 30; pointer-events: none; animation: tst 2.6s forwards; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }

.title { font-family: var(--f-num); font-size: 30px; letter-spacing: .12em; text-align: center; color: var(--cyan); text-shadow: 0 0 18px rgba(63,224,255,.6); }
.howto { display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); line-height: 1.6; }

@media (max-width: 560px) { .tabs button { font-size: 12.5px; } .shipCard { grid-template-columns: 72px 1fr; } .shipCard canvas { width: 72px; height: 45px; } .shipCard .btns { grid-column: 1 / -1; justify-content: stretch; } .stat { min-width: 128px; } #mini { width: 92px; height: 92px; } }
@media (prefers-reduced-motion: reduce) { .toast { animation-duration: .01s; } }

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
  const fmt = n => Math.round(n).toLocaleString('en-US');
  const ang = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };

  // ---------- 遊戲資料 ----------
  // 船級: 尺寸 (畫面像素), 船體, 護盾, 速度, 轉向, 貨艙, 砲塔數, 單發傷害, 射速 (每秒), 射程, 挖礦速度 (每秒), 價格, 需要的聲望 (完成任務數)
  const SHIPS = [
    { name: '護衛艦', en: 'Corvette', size: 22, hull: 100, shield: 60, speed: 300, turn: 3.6, cargo: 20, guns: 1, dmg: 8, rate: 3, range: 420, mine: .45, price: 0, rep: 0, col: '#9fc6e6' },
    { name: '驅逐艦', en: 'Destroyer', size: 34, hull: 280, shield: 160, speed: 285, turn: 3.0, cargo: 40, guns: 2, dmg: 11, rate: 3, range: 470, mine: .75, price: 6000, rep: 3, col: '#a9d3b6' },
    { name: '巡洋艦', en: 'Cruiser', size: 50, hull: 650, shield: 380, speed: 265, turn: 2.4, cargo: 75, guns: 3, dmg: 15, rate: 3, range: 520, mine: 1.2, price: 20000, rep: 8, col: '#d7c99a' },
    { name: '戰鬥巡洋艦', en: 'Battlecruiser', size: 70, hull: 1300, shield: 760, speed: 255, turn: 1.9, cargo: 120, guns: 4, dmg: 20, rate: 3, range: 580, mine: 1.7, price: 52000, rep: 14, col: '#c9b0e0' },
    { name: '戰艦', en: 'Battleship', size: 94, hull: 2600, shield: 1500, speed: 240, turn: 1.5, cargo: 180, guns: 6, dmg: 26, rate: 3, range: 650, mine: 2.4, price: 110000, rep: 22, col: '#e6a98f' },
  ];
  // 改裝: 每級 +15%, 5 級; 價格 = 基本 × 船級係數 × 級數
  const UPG = [
    { k: 'weapon', name: '武器', icon: '🔫', desc: '傷害 +15%', base: 400 },
    { k: 'shield', name: '護盾', icon: '🛡', desc: '護盾 +15%、回充更快', base: 350 },
    { k: 'armor', name: '裝甲', icon: '🧱', desc: '船體 +15%', base: 350 },
    { k: 'cargo', name: '貨艙', icon: '📦', desc: '貨艙 +15%', base: 300 },
    { k: 'engine', name: '引擎', icon: '🚀', desc: '速度 +8%', base: 300 },
    { k: 'mining', name: '採礦雷射', icon: '⛏', desc: '挖礦速度 +20%', base: 250 },
  ];
  // 貨物: 基本價格
  const GOODS = [
    { k: 'ore', name: '礦石', base: 22 }, { k: 'crystal', name: '晶體', base: 95 },
    { k: 'food', name: '糧食', base: 40 }, { k: 'parts', name: '零件', base: 120 }, { k: 'meds', name: '醫藥', base: 210 }, { k: 'lux', name: '奢侈品', base: 380 },
  ];
  // 星系: 名稱, 危險度 (0~4), 站名, 各貨物價格倍率 (<1 便宜好買, >1 貴好賣), 小行星數量, 晶體比例, 位置 (星圖)
  const SYS = [
    { name: '新港', danger: 0, station: '新港站', px: { ore: 1.0, crystal: 1.0, food: .75, parts: 1.15, meds: 1.1, lux: 1.25 }, rocks: 26, crystal: .08, mx: 90, my: 150, color: '#3b7bd8' },
    { name: '礦脈帶', danger: 1, station: '礦業前哨', px: { ore: .8, crystal: .85, food: 1.3, parts: 1.25, meds: 1.2, lux: 1.1 }, rocks: 46, crystal: .25, mx: 220, my: 60, color: '#b98a4a' },
    { name: '商業星', danger: 1, station: '自由貿易港', px: { ore: 1.2, crystal: 1.3, food: 1.05, parts: .78, meds: .85, lux: .8 }, rocks: 16, crystal: .1, mx: 230, my: 230, color: '#3fc48a' },
    { name: '邊境', danger: 2, station: '邊境要塞', px: { ore: 1.15, crystal: 1.2, food: 1.35, parts: 1.3, meds: 1.45, lux: 1.0 }, rocks: 34, crystal: .3, mx: 360, my: 150, color: '#c85a3a' },
    { name: '黑霧星雲', danger: 3, station: null, px: null, rocks: 30, crystal: .45, mx: 480, my: 150, color: '#7a3ac8' },
  ];
  const LINKS = [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4], [1, 2]];
  // 海盜
  const PIR = [
    { name: '海盜快艇', size: 18, hull: 45, dmg: 5, rate: 1.3, speed: 290, range: 380, bounty: 140, col: '#c0503a' },
    { name: '海盜砲艇', size: 26, hull: 140, dmg: 9, rate: 1.3, speed: 265, range: 420, bounty: 380, col: '#b8462e' },
    { name: '海盜巡防艦', size: 40, hull: 480, dmg: 15, rate: 1.5, speed: 245, range: 480, bounty: 1150, col: '#a63c2a' },
    { name: '海盜驅逐艦', size: 58, hull: 1300, dmg: 24, rate: 1.8, speed: 225, range: 540, bounty: 2900, col: '#962e22' },
    { name: '海盜旗艦「赤牙」', size: 130, hull: 40000, dmg: 40, rate: 4, speed: 150, range: 640, bounty: 40000, col: '#7e1c14', boss: true },
  ];
  const WORLD = 5200;   // 每個星系是 5200 × 5200 的正方形 (中心 0, 0)

  // ---------- 狀態 ----------
  let S = null;        // 存檔的部分
  let W = null;        // 目前星系的物件 (不存檔)
  function newSave() {
    return { credits: 800, rep: 0, kills: 0, cls: 0, up: { weapon: 0, shield: 0, armor: 0, cargo: 0, engine: 0, mining: 0 }, cargo: {}, sys: 0, x: 0, y: 260, hull: null, shield: null,
      missions: [], offers: {}, bossDead: false, time: 0, won: false, prices: {}, lastStation: 0, seed: Math.random() * 1e9 | 0 };
  }
  const st = () => {
    const b = SHIPS[S.cls], u = S.up, m = k => 1 + .15 * u[k];
    return { ...b, hull: b.hull * m('armor'), shield: b.shield * m('shield'), cargo: Math.round(b.cargo * m('cargo')), dmg: b.dmg * m('weapon'), speed: b.speed * (1 + .08 * u.engine), mine: b.mine * (1 + .2 * u.mining), regen: (b.shield * m('shield')) * (.06 + .015 * u.shield) };
  };
  const cargoUsed = () => Object.values(S.cargo).reduce((a, b) => a + b, 0) + S.missions.filter(m => m.type === 'deliver').reduce((a, m) => a + m.n, 0);

  // ---------- 畫面 ----------
  const cv = $('cv'), g = cv.getContext('2d');
  let VW = 0, VH = 0, DPR = 1;
  function resize() { DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; }
  addEventListener('resize', resize); resize();
  // 背景星空 (三層視差)
  const stars = [0, 1, 2].map(l => Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), r: (l + 1) * .5 + Math.random() * .6, a: .3 + Math.random() * .6 })));

  // ---------- 畫船 (程式畫的向量圖, 朝右) ----------
  function drawShip(c, cls, size, col, opt = {}) {
    // cls: 0~4 玩家船級; 'p0'~'p4' 海盜
    const s = size;
    c.save();
    const pirate = typeof cls === 'string';
    const k = pirate ? +cls[1] : cls;
    // 引擎光
    if (opt.thrust) {

    // 剿匪: 在某個有海盜的星系擊沉 N 艘
    const ks = [1, 2, 3, 3, 4].filter((x, k) => k === 0 ? false : true);
    const sysK = pick([1, 2, 3, 3, 4].filter(k => SYS[k].danger <= Math.min(3, S.cls + 1)));
    const n = 3 + Math.floor(Math.random() * 3) + S.cls;
    out.push({ type: 'kill', sys: sysK, n, done: 0, reward: Math.round(n * [0, 260, 260, 700, 1500][sysK] * (1 + S.cls * .35) / 10) * 10, id: Math.random() });
    // 運送
    const to = pick(stations), units = Math.min(Math.max(4, Math.round(st().cargo * .4)), 60), h = hops(i, to);
    out.push({ type: 'deliver', to, n: units, reward: Math.round(units * (40 + h * 45) * (1 + SYS[to].danger * .3) / 10) * 10, id: Math.random(), from: i });
    // 採礦: 交 N 個礦石到這個站
    const ore = Math.round(st().cargo * .6);
    out.push({ type: 'mine', at: i, n: ore, done: 0, reward: Math.round(ore * 45 / 10) * 10, id: Math.random() });
    return out;
  }
  function missionText(m, short) {
    if (m.type === 'kill') return `🎯 在<b>${SYS[m.sys].name}</b>擊沉海盜 ${m.done}／${m.n}` + (short ? '' : `<small>報酬 $${fmt(m.reward)}。完成後回任何太空站領錢。</small>`);
    if (m.type === 'deliver') return `📦 把 ${m.n} 箱貨物送到<b>${SYS[m.to].station}</b>（${SYS[m.to].name}）` + (short ? '' : `<small>報酬 $${fmt(m.reward)}。貨會佔 ${m.n} 格貨艙，船被擊沉就失敗。</small>`);
    if (m.type === 'mine') return `⛏ 交 ${m.n} 個礦石給<b>${SYS[m.at].station}</b>（手上 ${Math.min(S.cargo.ore || 0, m.n)}）` + (short ? '' : `<small>報酬 $${fmt(m.reward)}，比市價高。礦石在任何星系的小行星都挖得到。</small>`);
  }
  function missionProgress(kind, sys) {
    for (const m of S.missions) if (kind === 'kill' && m.type === 'kill' && m.sys === sys && m.done < m.n) { m.done++; if (m.done === m.n) toast('🎯 剿匪任務完成！回太空站領報酬'); }
  }

  // ---------- 太空站 ----------
  let tab = 'market';
  function price(k, i, sell) {
    const sy = SYS[i], G0 = GOODS.find(x => x.k === k);
    const p = (S.prices[i] && S.prices[i][k]) || 1;
    const base = G0.base * sy.px[k] * p;
    return Math.max(1, Math.round(sell ? base * .92 : base * 1.05));
  }
  function dock() {
    if (inStation) return;
    inStation = true; joy = null;
    const i = W.i; S.lastStation = i;
    // 價格每次停靠浮動 ±12%
    S.prices[i] = Object.fromEntries(GOODS.map(x => [x.k, rnd(.88, 1.12)]));
    if (!S.offers[i] || Math.random() < .5) S.offers[i] = genOffers(i);
    // 交任務
    const msgs = [];
    for (const m of [...S.missions]) {
      let done = false;
      if (m.type === 'kill' && m.done >= m.n) done = true;
      if (m.type === 'deliver' && m.to === i) done = true;
      if (m.type === 'mine' && m.at === i && (S.cargo.ore || 0) >= m.n) { S.cargo.ore -= m.n; done = true; }
      if (done) { S.credits += m.reward; S.rep++; S.missions.splice(S.missions.indexOf(m), 1); msgs.push(`任務完成 +$${fmt(m.reward)}`); }
    }
    if (msgs.length) { snd('coin'); toast(msgs.join('　') + `　聲望 ${S.rep}`, 'money'); }
    pl.vx = pl.vy = 0; save();
    tab = 'market'; renderStation(); $('stationScr').hidden = false;
  }
  $('dockBtn').addEventListener('click', () => { ac(); dock(); });
  $('undockBtn').addEventListener('click', () => { $('stationScr').hidden = true; inStation = false; pl.inv = 2; save(); });
  document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; renderStation(); } });
  $('repairBtn').addEventListener('click', () => {
    const s = st(), miss = s.hull - pl.hull, cost = Math.ceil(miss * (1 + S.cls * .5) * .8);
    if (miss < 1) return;
    if (S.credits < cost) { const part = Math.floor(S.credits / ((1 + S.cls * .5) * .8)); if (part < 1) return toast('錢不夠修理'); pl.hull += part; S.credits -= Math.ceil(part * (1 + S.cls * .5) * .8); }
    else { pl.hull = s.hull; S.credits -= cost; }
    pl.shield = s.shield; snd('coin'); renderStation(); save();
  });
  function renderStation() {
    const i = W.i, s = st();
    $('stName').textContent = SYS[i].station; $('stSys').textContent = SYS[i].name + '星系'; $('stMoney').textContent = '$' + fmt(S.credits);
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === tab)));
    const miss = s.hull - pl.hull, rc = Math.ceil(miss * (1 + S.cls * .5) * .8);
    $('repairBtn').textContent = miss >= 1 ? `修理 $${fmt(rc)}` : '船況良好';
    $('repairBtn').disabled = miss < 1;
    let h = '';
    if (tab === 'market') {
      const cu = cargoUsed();
      h += `<p>貨艙 ${cu}／${s.cargo}。<b style="color:var(--green)">綠色</b>表示這裡比平均便宜（適合買），<b style="color:var(--red)">紅色</b>表示比較貴（適合賣）。</p>`;
      for (const G0 of GOODS) {
        const buy = price(G0.k, i, false), sell = price(G0.k, i, true), have = S.cargo[G0.k] || 0, f = SYS[i].px[G0.k];
        const cls = f < .95 ? 'up' : f > 1.05 ? 'down' : '';
        const canBuy = G0.k !== 'ore' && G0.k !== 'crystal';
        h += `<div class="item"><div><b>${G0.name}</b> <span class="${cls}">${f < .95 ? '▼便宜' : f > 1.05 ? '▲高價' : ''}</span><small>買 $${fmt(buy)}　賣 $${fmt(sell)}　持有 ${have}</small></div><div class="btns">` +
          (canBuy ? `<button class="sb buy" data-buy="${G0.k}" data-n="1" type="button" ${S.credits < buy || cu >= s.cargo ? 'disabled' : ''}>買 1</button><button class="sb buy" data-buy="${G0.k}" data-n="max" type="button" ${S.credits < buy || cu >= s.cargo ? 'disabled' : ''}>買滿</button>` : '') +
          `<button class="sb sell" data-sell="${G0.k}" data-n="all" type="button" ${have ? '' : 'disabled'}>全賣</button></div></div>`;
      }
      h += `<p>💡 哪裡賣得貴可以看「星圖」。礦石和晶體只能挖或撿，不能在市場買。</p>`;
    } else if (tab === 'missions') {
      h += `<p>同時最多接 3 個任務。完成任務會增加<b>聲望</b>（目前 ${S.rep}），買大船需要聲望。</p>`;
      for (const m of S.missions) h += `<div class="item"><div>${missionText(m)}</div><div class="btns"><button class="sb" data-drop="${m.id}" type="button">放棄</button></div></div>`;
      for (const m of S.offers[i] || []) h += `<div class="item"><div>${missionText(m)}</div><div class="btns"><button class="sb buy" data-take="${m.id}" type="button" ${S.missions.length >= 3 || (m.type === 'deliver' && cargoUsed() + m.n > s.cargo) ? 'disabled' : ''}>接受</button></div></div>`;
      if (!(S.offers[i] || []).length) h += `<p>目前沒有新任務，下次停靠再來看看。</p>`;
    } else if (tab === 'refit') {
      h += `<p>改裝只對現在這艘${SHIPS[S.cls].name}有效，換新船會重新開始。每項最多 5 級。</p>`;
      for (const u of UPG) {
        const lv = S.up[u.k], cost = Math.round(u.base * (1 + S.cls * 1.6) * (lv + 1));
        h += `<div class="item"><div><b>${u.icon} ${u.name}</b><span class="lvl">${[0, 1, 2, 3, 4].map(k => `<i class="${k < lv ? 'on' : ''}"></i>`).join('')}</span><small>${u.desc}</small></div><div class="btns">` +
          (lv >= 5 ? '<span class="sb" style="opacity:.6">滿級</span>' : `<button class="sb buy" data-up="${u.k}" type="button" ${S.credits < cost ? 'disabled' : ''}>$${fmt(cost)}</button>`) + `</div></div>`;
      }
    } else if (tab === 'yard') {
      h += `<p>新船會換掉舊船（舊船折價 50% 抵用），改裝等級重新開始，貨艙裡的東西會搬過去。</p>`;
      SHIPS.forEach((b, k) => {
        const trade = Math.round(SHIPS[S.cls].price * .5), cost = Math.max(0, b.price - trade);
        const cur = k === S.cls;
        h += `<div class="shipCard ${cur ? 'cur' : ''}"><canvas data-ship="${k}" width="192" height="120"></canvas><div><b>${b.name}</b> <small style="display:inline;color:var(--muted)">${b.en}</small><small>船體 ${b.hull}・護盾 ${b.shield}・砲塔 ${b.guns}・貨艙 ${b.cargo}<br>${k === 0 ? '新手船' : `價格 $${fmt(b.price)}（舊船抵 $${fmt(trade)}）・需要聲望 ${b.rep}`}</small></div><div class="btns">` +
          (cur ? '<span class="sb">目前的船</span>' : k < S.cls ? '' : `<button class="sb buy" data-ship-buy="${k}" type="button" ${S.credits < cost || S.rep < b.rep || k !== S.cls + 1 ? 'disabled' : ''}>${S.rep < b.rep ? `聲望 ${S.rep}／${b.rep}` : k !== S.cls + 1 ? '先買上一級' : `買 $${fmt(cost)}`}</button>`) + `</div></div>`;
      });
    } else if (tab === 'map') h += galaxyHTML();
    $('pane').innerHTML = h;
    $('pane').querySelectorAll('canvas[data-ship]').forEach(c => { const k = +c.dataset.ship, x = c.getContext('2d'); x.translate(96, 60); const sz = 20 + k * 7; drawShip(x, k, sz, SHIPS[k].col, { thrust: .5 }); });
  }
  $('pane').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const i = W.i, s = st();
    if (b.dataset.buy) {
      const k = b.dataset.buy, p = price(k, i, false);
      let n = b.dataset.n === 'max' ? Math.min(Math.floor(S.credits / p), s.cargo - cargoUsed()) : 1;
      n = Math.max(0, Math.min(n, s.cargo - cargoUsed())); if (!n) return;
      S.credits -= n * p; S.cargo[k] = (S.cargo[k] || 0) + n; snd('coin');
    } else if (b.dataset.sell) {
      const k = b.dataset.sell, have = S.cargo[k] || 0, p = price(k, i, true);
      // 採礦任務需要的礦石保留
      let keep = 0; if (k === 'ore') keep = S.missions.filter(m => m.type === 'mine').reduce((a, m) => a + m.n, 0);
      const n = Math.max(0, have - keep); if (!n) { toast('這些礦石要留給採礦任務'); return; }
      S.credits += n * p; S.cargo[k] = have - n; if (!S.cargo[k]) delete S.cargo[k];
      snd('coin'); toast(`賣出 ${n} 個${GOODS.find(x => x.k === k).name} +$${fmt(n * p)}`, 'money');
    } else if (b.dataset.take) {
      const off = S.offers[i], m = off.find(x => String(x.id) === b.dataset.take); if (!m) return;
      off.splice(off.indexOf(m), 1); S.missions.push(m); toast('接下任務');
    } else if (b.dataset.drop) {
      const m = S.missions.find(x => String(x.id) === b.dataset.drop); if (m) S.missions.splice(S.missions.indexOf(m), 1);
    } else if (b.dataset.up) {
      const u = UPG.find(x => x.k === b.dataset.up), lv = S.up[u.k], cost = Math.round(u.base * (1 + S.cls * 1.6) * (lv + 1));
      if (S.credits < cost || lv >= 5) return;
      const before = st(); S.credits -= cost; S.up[u.k]++; const after = st();
      pl.hull += after.hull - before.hull; pl.shield += after.shield - before.shield; snd('coin');
    } else if (b.dataset.shipBuy) {
      const k = +b.dataset.shipBuy, cost = Math.max(0, SHIPS[k].price - Math.round(SHIPS[S.cls].price * .5));
      if (S.credits < cost || S.rep < SHIPS[k].rep) return;
      S.credits -= cost; S.cls = k; S.up = { weapon: 0, shield: 0, armor: 0, cargo: 0, engine: 0, mining: 0 };
      const s2 = st(); pl.hull = s2.hull; pl.shield = s2.shield;
      snd('coin');
      showMsg(`🚀 換到${SHIPS[k].name}！`, `船體 ${s2.hull}、護盾 ${s2.shield}、${s2.guns} 座砲塔、貨艙 ${s2.cargo}。` + (k === 4 ? '<br>現在可以去<b>黑霧星雲</b>挑戰海盜旗艦「赤牙」了！' : k === 3 ? '<br>海盜旗艦在黑霧星雲，最好換到戰艦再去。' : ''));
    }
    save(); renderStation();
  });
  function galaxyHTML() {
    let svg = `<svg class="galaxy" viewBox="0 0 560 300">`;
    for (const [a, b] of LINKS) svg += `<line x1="${SYS[a].mx}" y1="${SYS[a].my}" x2="${SYS[b].mx}" y2="${SYS[b].my}" stroke="rgba(120,200,255,.35)" stroke-width="3" stroke-dasharray="8 6"/>`;
    SYS.forEach((s, k) => {
      const here = W && W.i === k;
      svg += `<circle cx="${s.mx}" cy="${s.my}" r="${here ? 24 : 20}" fill="${s.color}" stroke="${here ? '#fff' : 'rgba(255,255,255,.4)'}" stroke-width="${here ? 4 : 2}"/>`;
      svg += `<text x="${s.mx}" y="${s.my + 42}" fill="#e8f4ff" font-size="16" font-weight="900" text-anchor="middle" font-family="Noto Sans TC, sans-serif">${s.name}</text>`;
      svg += `<text x="${s.mx}" y="${s.my + 60}" fill="${['#4be38a', '#ffc94a', '#ff8a5a', '#ff5a5a'][s.danger]}" font-size="12" text-anchor="middle" font-family="Noto Sans TC, sans-serif">${['安全', '低危險', '危險', '極危險'][s.danger]}${s.station ? '' : '・無太空站'}</text>`;
      if (here) svg += `<text x="${s.mx}" y="${s.my - 32}" fill="#fff" font-size="13" text-anchor="middle" font-family="Noto Sans TC, sans-serif">你在這裡</text>`;
    });
    svg += '</svg>';
    // 價格表
    let t = '<div class="item" style="display:block"><b>各站行情（▼便宜 ▲高價）</b><small>';
    for (const G0 of GOODS) {
      t += `${G0.name}：` + SYS.filter(s => s.station).map(s => { const f = s.px[G0.k]; return `${s.name}${f < .95 ? '<span class="up">▼</span>' : f > 1.05 ? '<span class="down">▲</span>' : '－'}`; }).join('　') + '<br>';
    }
    t += '</small></div>';
    return svg + t + `<p>跳躍門在星系邊緣，往星圖上相鄰星系的方向飛就會看到。</p>`;
  }
  $('mapBtn').addEventListener('click', () => { if (!W) return; paused = true; $('mapBody').innerHTML = galaxyHTML(); $('mapScr').hidden = false; });
  $('mapClose').addEventListener('click', () => { $('mapScr').hidden = true; paused = false; });
  $('pauseBtn').addEventListener('click', () => { if (!W) return; paused = true; save(); showMsg('暫停', `遊戲時間 ${Math.floor(S.time / 60)} 分鐘・擊沉海盜 ${S.kills} 艘・聲望 ${S.rep}<br>已自動存檔。`, () => {}); });

  // ---------- 訊息 ----------
  let msgCb = null;
  function showMsg(t, html, cb) { paused = true; $('msgTitle').textContent = t; $('msgText').innerHTML = html; $('msgScr').hidden = false; msgCb = cb || null; }
  $('msgOk').addEventListener('click', () => { $('msgScr').hidden = true; paused = false; if (msgCb) { const f = msgCb; msgCb = null; f(); } });

  // ---------- 存檔 ----------
  function save() { if (!S || !pl) return; S.x = pl.x; S.y = pl.y; S.hull = pl.dead ? null : pl.hull; S.shield = pl.dead ? null : pl.shield; S.sys = W.i; store.set('sc-save', JSON.stringify(S)); }
  function load() { try { const s = JSON.parse(store.get('sc-save')); return s && typeof s.credits === 'number' ? s : null; } catch (e) { return null; } }
  function start(s) {
    S = s; buildSystem(S.sys); makePlayer();
    $('startScr').hidden = true; $('hud').hidden = false; paused = false;
    if (!S.time) setTimeout(() => toast('先在附近挖礦（靠近小行星），再回太空站賣掉！'), 600);
  }
  $('newBtn').addEventListener('click', () => { ac(); if (load() && !confirm('開始新遊戲會蓋掉之前的存檔，確定嗎？')) return; start(newSave()); });
  $('contBtn').addEventListener('click', () => { ac(); const s = load(); if (s) start(s); });
  $('contBtn').hidden = !load();
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  requestAnimationFrame(frame);
  window.__sc = { get S() { return S; }, get W() { return W; }, get pl() { return pl; }, SHIPS, PIR, SYS, dock, jump, update, st, cargoUsed, killPirate, start, newSave };
})();
</script>
</html>

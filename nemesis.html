const DIFF = { easy: { n: '簡單', time: 16, blank: 4 }, normal: { n: '普通', time: 14, blank: 3 }, hard: { n: '困難', time: 12, blank: 2 } };

// ---------- core helpers ----------

// ---------- actions ----------
function payable(m) { return m.hand.filter(c => c.kind !== 'contam'); }

// ---------- flow ----------
function startRound() {

  S.marines.forEach(m => {
    if (!alive(m)) return;

    drawTo(m, lim);
    if (S.rooms[m.room].o2low) {
      if (m.o2 > 0) { m.o2--; log(`${m.name} 在缺氧房間：氧氣 -1（剩 ${m.o2}）`); }

    }

  S.phase = 'player'; S.acts = 0;
  S.active = S.marines.findIndex(canAct);
  log(`—— 第 ${S.round} 回合・玩家階段（剩 ${S.time} 回合）——`);
  if (S.active < 0) envPhase();

</div>`;
function showRules() { const m = openSheet(RULES + '<button class="btn" id="ok">知道了</button>', 'manual'); $('#ok', m).onclick = () => { closeSheet(); if (S) render(); }; }

function renderSetup() {
  $('#bar').hidden = true;
  if (!setupCfg) setupCfg = { classes: ['sgt', 'heavy', 'scout'], diff: 'normal' };
  const c = setupCfg;
  $('#app').innerHTML = `
  <div class="top"><h1>異形巢穴<small>復仇女神號：反擊 規則・自製版</small></h1><button class="pill" id="rulesBtn">作戰手冊</button></div>
  <p style="margin:0;line-height:1.6;color:var(--muted)">陸戰隊攻入外星秘密基地。探索房間、清剿異形、完成各自的秘密目標，然後在基地毀滅前撤離。</p>
  <div class="setup">
    <div><h3>選擇隊員（1～4 名，全部由你操控）</h3>
      <div class="classes" style="margin-top:8px">${Object.entries(CLASSES).map(([k, C]) => `<button class="cls ${c.classes.includes(k) ? 'on' : ''}" data-cls="${k}"><b style="color:${C.c}">${C.n}</b><span>${C.d}</span><span class="muted">生命 ${C.hp}・彈藥 ${C.ammo}/${C.maxAmmo}${C.armor ? '・護甲 ' + C.armor : ''}</span><span class="muted">特技：${C.sp.map(s => s[0]).join('、')}</span></button>`).join('')}</div></div>
    <div><h3>難度</h3><div class="seg" style="margin-top:6px">${Object.entries(DIFF).map(([k, d]) => `<button data-diff="${k}" class="${c.diff === k ? 'on' : ''}">${d.n}（${d.time} 回合）</button>`).join('')}</div></div>
    <button class="btn" id="start" ${c.classes.length ? '' : 'disabled'} style="align-self:flex-start">開始作戰（${c.classes.length} 名隊員）</button>
  </div>
  <div class="setup">${RULES}</div>`;
  $('#rulesBtn').onclick = showRules;
  document.querySelectorAll('[data-cls]').forEach(b => b.onclick = () => { const k = b.dataset.cls; c.classes = c.classes.includes(k) ? c.classes.filter(x => x !== k) : [...c.classes, k]; renderSetup(); });
  document.querySelectorAll('[data-diff]').forEach(b => b.onclick = () => { c.diff = b.dataset.diff; renderSetup(); });

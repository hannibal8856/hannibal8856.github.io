<style>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rint = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rint(a.length)];

// ---------- rules data (from the user's rule sheet) ----------
const EVIL_N = { 5: 2, 6: 2, 7: 3, 8: 3, 9: 3, 10: 4 };
const QUEST = { 5: [2, 3, 2, 3, 3], 6: [2, 3, 4, 3, 4], 7: [2, 3, 3, 4, 4], 8: [3, 4, 4, 5, 5], 9: [3, 4, 4, 5, 5], 10: [3, 4, 4, 5, 5] };
const DEFAULTS = { 5: ['percival', 'morgana'], 6: ['percival', 'morgana'], 7: ['percival', 'morgana', 'oberon'], 8: ['percival', 'morgana', 'mordred'], 9: ['percival', 'morgana', 'mordred'], 10: ['percival', 'morgana', 'mordred', 'oberon'] };
const needFails = (n, q) => (n >= 7 && q === 3) ? 2 : 1;
const ROLE = {
  merlin: { n: '梅林', side: 'good', d: '你看得到所有邪惡方（除了莫德雷德）。引導好人，但別太明顯，否則最後會被刺客刺殺。' },
  percival: { n: '派西維爾', side: 'good', d: '你知道誰是梅林（有莫甘娜時會看到兩個人，分不清誰是誰）。保護梅林，必要時假裝自己是梅林。' },
  loyal: { n: '亞瑟的忠臣', side: 'good', d: '沒有特殊能力的好人。靠投票、出任務結果和大家的發言推理出夥伴。' },
  assassin: { n: '刺客', side: 'evil', d: '邪惡方。如果好人完成 3 次任務，由你刺殺一人：刺中梅林，邪惡方逆轉勝。' },
  morgana: { n: '莫甘娜', side: 'evil', d: '邪惡方。在派西維爾眼中，你和梅林看起來一模一樣。' },
  mordred: { n: '莫德雷德', side: 'evil', d: '邪惡方大魔王。梅林看不到你。' },
  oberon: { n: '奧伯倫', side: 'evil', d: '邪惡方，但你不認識其他壞人，他們也不認識你（梅林看得到你）。' },
  minion: { n: '莫德雷德的爪牙', side: 'evil', d: '普通的壞人，和隊友相認後一起搞破壞。' },
};
const isEvil = (r) => !!r && ROLE[r].side === 'evil';
const SHIELD = (good) => `<svg viewBox="0 0 40 40"><path d="M20 3l14 5v10c0 9-6 16-14 19C12 34 6 27 6 18V8z" fill="${good ? '#dbe8ff' : '#ffd9d3'}" stroke="#0004" stroke-width="1.5"/>${good ? '<path d="M20 9v22M13 16h14" stroke="#1f4a8e" stroke-width="3" stroke-linecap="round"/>' : '<path d="M14 13l12 14M26 13L14 27" stroke="#7a1f14" stroke-width="3" stroke-linecap="round"/>'}</svg>`;

let S = null, resolver = null, UI = {}, setupCfg = null;
const P = (i) => S.players[i];
const nm = (i) => P(i).name;
const humans = () => S.players.filter(p => p.human).length;
function log(t) { S.say.unshift(t); if (S.say.length > 120) S.say.pop(); }
async function nap(ms) { const g = S && S.gid; await sleep(ms); if (!S || S.gid !== g) throw 'stop'; }
function ask(pr) {
  if (S.online && pr.p != null && P(pr.p).remote) { pr.pid = ++NET.pid; S.rprompts[pr.p] = pr; render(); return new Promise(r => { NET.waits[pr.pid] = { r, seat: pr.p, pr }; }); }
  if (S.online && pr.p == null && ['voteResult', 'missionResult', 'end'].includes(pr.type)) S.shared = { ...pr, key: pr.type + ':' + (++NET.pid) };
  UI = {}; S.prompt = pr; render(); return new Promise(r => { resolver = r; });
}
function answer(v) {
  if (NET.role === 'client') { closeSheet(); clientAnswer(v); return; }
  const r = resolver; resolver = null; S.prompt = null; UI = {}; closeSheet(); if (r) r(v);
}

// ---------- setup ----------
function buildRoles(n, opts) {
  const E = EVIL_N[n];
  const good = ['merlin']; if (opts.includes('percival')) good.push('percival');
  while (good.length < n - E) good.push('loyal');
  const evil = ['assassin'];
  for (const r of ['morgana', 'mordred', 'oberon']) if (opts.includes(r) && evil.length < E) evil.push(r);
  while (evil.length < E) evil.push('minion');
  return [...good, ...evil];
}
function newGame(cfg) {
  const n = cfg.seats.length;
  const roles = shuffle(buildRoles(n, cfg.opts));
  S = { n, players: cfg.seats.map((s, i) => ({ name: s.name, baseName: s.name, human: s.human, remote: !!s.remote, off: false, role: roles[i], seen: false, lady: {} })),
    roles, opts: cfg.opts, ladyOn: cfg.lady, quest: 0, results: [], hist: [[], [], [], [], []], leader: rint(n), rejects: 0,
    team: [], ladyHolder: null, ladyUsed: [], say: [], prompt: null, gid: Math.random(), over: false, winner: null, lastVotes: null };
  if (S.ladyOn) { S.ladyHolder = (S.leader - 1 + n) % n; S.ladyUsed = [S.ladyHolder]; }
  log(`新遊戲：${n} 位騎士，${EVIL_N[n]} 位邪惡方。角色：${[...new Set(roles)].map(r => ROLE[r].n).join('、')}。`);
}

// what player i saw at night: map j -> 'evil' | 'mm' (Merlin or Morgana)
function nightInfo(i) {
  if (S.client) return S.night || {};
  const me = P(i).role, out = {};
  S.players.forEach((q, j) => {
    if (j === i) return;
    if (me === 'merlin' && isEvil(q.role) && q.role !== 'mordred') out[j] = 'evil';
    if (me === 'percival' && (q.role === 'merlin' || q.role === 'morgana')) out[j] = 'mm';
    if (isEvil(me) && me !== 'oberon' && isEvil(q.role) && q.role !== 'oberon') out[j] = 'evil';
  });
  return out;
}
function nightText(i) {
  const me = P(i).role, info = nightInfo(i), ids = Object.keys(info).map(Number);
  const names = (f) => ids.filter(j => info[j] === f).map(nm).join('、');
  if (me === 'merlin') return ids.length ? `你看到的邪惡方：<b>${names('evil')}</b>${S.roles.includes('mordred') ? '<br>（莫德雷德躲在暗處，你看不到他）' : ''}` : '你沒看到任何邪惡方（莫德雷德躲起來了）。';
  if (me === 'percival') return S.roles.includes('morgana') ? `這兩人之中一位是梅林、一位是莫甘娜：<b>${names('mm')}</b>` : `梅林是：<b>${names('mm')}</b>`;
  if (me === 'oberon') return '你不認識其他邪惡方，他們也不知道你是誰。';
  if (isEvil(me)) return `你的邪惡隊友：<b>${names('evil') || '（沒有）'}</b>${S.roles.includes('oberon') ? '<br>（還有一位奧伯倫，你們互不相認）' : ''}`;
  return '你閉著眼睛，什麼都沒看到。';
}

// ---------- computer reasoning: weigh every possible "who is evil" world ----------
function combos(arr, k) { const out = []; const rec = (s, cur) => { if (cur.length === k) { out.push(cur.slice()); return; } for (let x = s; x < arr.length; x++) { cur.push(arr[x]); rec(x + 1, cur); cur.pop(); } }; rec(0, []); return out; }
function beliefs(i) {
  const n = S.n, E = EVIL_N[n], me = P(i);
  const info = nightInfo(i);
  const all = [...Array(n).keys()];
  const worlds = combos(all, E);
  const evilMe = isEvil(me.role);
  const knownEvil = Object.keys(info).filter(j => info[j] === 'evil').map(Number);
  const mm = Object.keys(info).filter(j => info[j] === 'mm').map(Number);
  const pe = Array(n).fill(0); let tot = 0;

const NET = { role: null, code: '', peer: null, conns: [], host: null, waits: {}, pid: 0, chat: [], unread: 0, chatOpen: false, lobby: null, myName: '', status: '', err: '', dismissed: {}, answered: 0, lastView: null, roleKey: '' };
const PEER_PREFIX = 'hannibal-avalon-';

let peerLib = null;
function loadPeer() {
  if (window.Peer) return Promise.resolve(window.Peer);

      s.onload = () => window.Peer ? res(window.Peer) : next();

      document.head.appendChild(s);

}

// ----- host -----
async function hostRoom(name) {
  NET.role = 'host'; NET.myName = name; NET.err = ''; NET.status = '正在建立房間…'; NET.lobby = { n: 7, opts: DEFAULTS[7].slice(), lady: true };
  render();
  let Peer; try { Peer = await loadPeer(); } catch { return netFail('連線元件載入失敗，請確認網路後再試一次。'); }
  if (NET.role !== 'host') return;
  for (let tries = 0; tries < 6 && !NET.peer; tries++) {
    const code = newCode();
    const r = await new Promise(res => {
      const p = new Peer(PEER_PREFIX + code, peerOpts());
      let done = false;
      p.on('open', () => { done = true; res({ p, code }); });
      p.on('error', e => { if (!done) { done = true; try { p.destroy(); } catch {} res({ err: e }); } else hostPeerError(e); });
      setTimeout(() => { if (!done) { done = true; try { p.destroy(); } catch {} res({ err: { type: 'timeout' } }); } }, 15000);
    });
    if (NET.role !== 'host') { if (r.p) r.p.destroy(); return; }
    if (r.p) { NET.peer = r.p; NET.code = r.code; break; }
    if (r.err && r.err.type !== 'unavailable-id') return netFail('無法建立房間（' + (r.err.type || '網路錯誤') + '），請確認網路後再試一次。');
  }
  if (!NET.peer) return netFail('無法建立房間，請再試一次。');
  NET.peer.on('connection', hostConn);
  NET.peer.on('disconnected', () => { try { NET.peer && NET.peer.reconnect(); } catch {} });
  NET.status = ''; sysChat(`房間 ${NET.code} 建好了`); render();
}

      rec.name = name; rec.seat = j; NET.conns.push(rec);
      sysChat(`${name} 重新連線，接回座位`); render(); return;
    }
    const max = 10;
    if (1 + NET.conns.length >= max) { send(rec.c, { t: 'bye', reason: '房間已滿。' }); return; }
    let nm2 = name, k = 2; const taken = () => [NET.myName, ...NET.conns.map(r => r.name)];
    while (taken().includes(nm2)) nm2 = name.slice(0, 6) + k++;
    rec.name = nm2; NET.conns.push(rec);
    sysChat(`${nm2} 加入了房間`); render(); return;
  }
  if (!rec.name) return;
  if (d.t === 'pong') return;
  if (d.t === 'chat') { const text = String(d.text || '').trim().slice(0, 120); if (text) addChat(rec.name, text); return; }
  if (d.t === 'emo') { if (EMOS.includes(d.e)) addEmo(rec.name, d.e); return; }
  if (d.t === 'ans' && S && rec.seat >= 0) {
    const w = NET.waits[d.pid]; if (!w || w.seat !== rec.seat) return;
    if (!validAns(w.pr, d.v)) { console.warn('invalid answer', JSON.stringify(d.v)); delete NET.waits[d.pid]; const pr = { ...w.pr, pid: ++NET.pid }; NET.waits[pr.pid] = { ...w, pr }; S.rprompts[rec.seat] = pr; syncSoon(); return; }
    delete NET.waits[d.pid]; S.rprompts[rec.seat] = null; w.r(d.v);
  }
}
function hostDrop(rec) {
  const i = NET.conns.indexOf(rec); if (i < 0) return;
  NET.conns.splice(i, 1);
  if (!rec.name) return;
  const inGame = S && rec.seat >= 0 && !S.over;
  sysChat(`${rec.name} 離線了${inGame ? '，先由電腦代打' : ''}`);
  if (S && rec.seat >= 0) {
    const p = P(rec.seat); p.off = true; p.remote = false; p.human = false; p.name = p.baseName + '（離線）';
    for (const [pid, w] of Object.entries(NET.waits)) if (w.seat === rec.seat) { delete NET.waits[pid]; S.rprompts[rec.seat] = null; w.r(botAnswer(w.pr)); }
  }
  render();
}
// heartbeat: WebRTC can take a long time to notice a closed phone, so ping everyone
setInterval(() => {
  if (NET.role === 'host') {
    const now = Date.now();
    NET.conns.slice().forEach(r => { if (now - r.last > 12000) { try { r.c.close(); } catch {} hostDrop(r); } });
    bcast({ t: 'ping' });
  } else if (NET.role === 'client' && NET.host && NET.host.open) {
    if (Date.now() - (NET.hostLast || Date.now()) > 15000) netFail('和房主的連線中斷了。用同一個名字重新加入可以接回座位。');
  }
}, 3000);
function botAnswer(pr) {
  const i = pr.p;
  switch (pr.type) {
    case 'team': return botTeam(i);
    case 'vote': return botVote(i, pr.team, S.leader);
    case 'mission': return botMission(i, S.team);
    case 'lady': return botLady(i);
    case 'assassin': return botAssassin(i);
    default: return true;
  }
}
function validAns(pr, v) {
  const okI = (x) => Number.isInteger(x) && x >= 0 && x < S.n;
  switch (pr.type) {
    case 'team': return Array.isArray(v) && v.length === pr.k && new Set(v).size === v.length && v.every(okI);
    case 'vote': return typeof v === 'boolean';
    case 'mission': return v === true || (v === false && isEvil(P(pr.p).role));
    case 'lady': return okI(v) && v !== pr.p && !S.ladyUsed.includes(v);
    case 'assassin': return okI(v) && !isEvil(P(v).role);
    default: return true;
  }
}
let syncT = null;
function syncSoon() { if (NET.role !== 'host' || syncT) return; syncT = setTimeout(() => { syncT = null; doSync(); }, 40); }
function doSync() {
  if (NET.role !== 'host') return;
  if (!S) { const L = NET.lobby; bcast({ t: 'lobby', code: NET.code, players: [NET.myName, ...NET.conns.map(r => r.name)], n: lobbyN(), opts: L.opts, lady: L.lady }); return; }
  NET.conns.forEach(r => { if (r.seat >= 0) send(r.c, { t: 'view', v: viewFor(r.seat) }); });
}
function viewFor(j) {
  const evilShown = S.phase === 'assassin';
  return {
    me: j, gk: S.gid, n: S.n, roles: S.roles.slice().sort(), opts: S.opts, ladyOn: S.ladyOn, quest: S.quest, results: S.results, hist: S.hist, leader: S.leader, rejects: S.rejects,
    team: S.team, ladyHolder: S.ladyHolder, ladyUsed: S.ladyUsed, say: S.say.slice(0, 60), over: S.over, winner: S.winner || null, why: S.why || '', stabbed: S.stabbed ?? null,
    phase: S.phase || '', lastVotes: S.lastVotes, done: S.done || [], night: nightInfo(j),
    players: S.players.map((p, i) => ({ name: p.name, human: p.human, remote: p.remote, off: p.off, role: i === j || S.over || (evilShown && isEvil(p.role)) ? p.role : null, lady: i === j ? p.lady : {} })),
    prompt: S.rprompts[j] || null, shared: S.shared || null,
  };
}
function lobbyN() { const h = 1 + NET.conns.length; return Math.min(10, Math.max(5, NET.lobby.n, h)); }
function startOnline() {
  const L = NET.lobby, n = lobbyN();
  if (1 + NET.conns.length > n) return;
  const seats = [{ name: NET.myName, human: true }, ...NET.conns.map(r => ({ name: r.name, human: true, remote: true }))];
  NET.conns.forEach((r, i) => r.seat = i + 1);
  let b = 0; while (seats.length < n) seats.push({ name: BOTNAMES[b++], human: false });
  NET.waits = {};
  newGame({ seats, opts: L.opts.slice(), lady: L.lady });
  S.online = true; S.me = 0; S.rprompts = {}; S.done = [];
  sysChat(`開始遊戲！${n} 位騎士`);
  render(); run();
}

// ----- client -----
async function joinRoom(code, name) {
  NET.role = 'client'; NET.myName = name; NET.code = code; NET.err = ''; NET.status = '正在連線到房間 ' + code + '…';
  render();
  let Peer; try { Peer = await loadPeer(); } catch { return netFail('連線元件載入失敗，請確認網路後再試一次。'); }
  if (NET.role !== 'client') return;
  const p = new Peer(undefined, peerOpts()); NET.peer = p;
  p.on('error', e => {
    if (NET.role !== 'client') return;
    if (e.type === 'peer-unavailable') netFail(`找不到房間 ${code}，請確認房號，或請房主重新開房。`);
    else if (!NET.host || !NET.host.open) netFail('連線失敗（' + (e.type || '網路錯誤') + '），請再試一次。');
  });
  p.on('open', () => {
    const c = p.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' }); NET.host = c;
    c.on('open', () => { NET.hostLast = Date.now(); send(c, { t: 'hello', name }); NET.status = '已連線，等待房主…'; render(); });
    c.on('data', clientRecv);
    c.on('close', () => { if (NET.role === 'client') netFail(S && !S.over ? '和房主的連線中斷了。用同一個名字重新加入可以接回座位。' : '房間已經關閉了。'); });
  });
  setTimeout(() => { if (NET.role === 'client' && NET.code === code && !NET.lobby && !S) netFail('連線逾時。請確認房號，或請房主重新開房。'); }, 20000);
}
function clientRecv(d) {
  if (!d || typeof d !== 'object') return;
  NET.hostLast = Date.now();
  if (d.t === 'ping') { send(NET.host, { t: 'pong' }); return; }
  if (d.t === 'lobby') { NET.lobby = d; NET.status = ''; if (S) { S = null; NET.dismissed = {}; NET.answered = 0; NET.roleKey = ''; closeSheet(); } render(); }
  else if (d.t === 'view') applyView(d.v);
  else if (d.t === 'chat') addChat(d.from, d.text, d.sys);
  else if (d.t === 'emo') addEmo(d.from, d.e);
  else if (d.t === 'bye') { const r = d.reason; netFail(r); }
}
function applyView(v) {
  NET.lastView = v;
  const prevPid = S && S.prompt && S.prompt.pid;
  S = { online: true, client: true, me: v.me, gid: v.gk, n: v.n, roles: v.roles, opts: v.opts, ladyOn: v.ladyOn, quest: v.quest, results: v.results, hist: v.hist, leader: v.leader, rejects: v.rejects,
    team: v.team, ladyHolder: v.ladyHolder, ladyUsed: v.ladyUsed, say: v.say, over: v.over, winner: v.winner, why: v.why, stabbed: v.stabbed, phase: v.phase, lastVotes: v.lastVotes,
    done: v.done, night: v.night, players: v.players, prompt: null, rprompts: {} };
  const rk = 'role:' + v.gk;
  if (NET.roleKey !== rk && !v.over) S.prompt = { type: 'role', p: v.me, local: true, key: rk };
  else if (v.prompt && v.prompt.pid !== NET.answered) S.prompt = v.prompt;
  else if (v.shared && !NET.dismissed[v.shared.key]) S.prompt = { ...v.shared, local: true };
  if (!(S.prompt && S.prompt.pid && S.prompt.pid === prevPid)) UI = {};
  render();
}
function clientAnswer(v) {
  const pr = S && S.prompt; if (!pr) return;
  S.prompt = null; UI = {};
  if (pr.local) { if (pr.type === 'role') NET.roleKey = pr.key; else if (pr.key) NET.dismissed[pr.key] = true; if (NET.lastView) applyView(NET.lastView); else render(); return; }
  NET.answered = pr.pid; send(NET.host, { t: 'ans', pid: pr.pid, v }); render();
}

// ----- chat & emotes -----
function chatBtnHTML() { return `<button class="pill chatbtn" id="chatBtn" aria-label="聊天">💬 聊天${NET.unread ? `<span class="badge">${NET.unread}</span>` : ''}</button>`; }
function bindChatBtn() { const b = $('#chatBtn'); if (b) b.onclick = () => { NET.chatOpen = !NET.chatOpen; NET.unread = 0; updateBadge(); renderChat(); }; }
function updateBadge() { const b = $('#chatBtn'); if (b) b.innerHTML = `💬 聊天${NET.unread ? `<span class="badge">${NET.unread}</span>` : ''}`; }
function addChat(from, text, sys) {
  NET.chat.push({ from, text, sys: !!sys }); if (NET.chat.length > 120) NET.chat.shift();
  if (NET.role === 'host') bcast({ t: 'chat', from, text, sys: !!sys });
  if (!NET.chatOpen && !sys) { NET.unread++; updateBadge(); }
  renderChat();
}
function sysChat(text) { addChat('', text, true); }
function addEmo(from, e) {
  if (NET.role === 'host') bcast({ t: 'emo', from, e });
  NET.chat.push({ from, text: e, emo: true }); if (NET.chat.length > 120) NET.chat.shift();
  renderChat();
  const old = $('#bubble'); if (old) old.remove();
  const b = document.createElement('div'); b.className = 'bubble'; b.id = 'bubble';
  b.innerHTML = `<span class="e">${e}</span>${esc(from)}`;
  document.body.appendChild(b); setTimeout(() => { if (b.isConnected) b.remove(); }, 2300);
}
function sendChat(text) {
  text = text.trim().slice(0, 120); if (!text) return;
  if (NET.role === 'host') addChat(NET.myName, text); else send(NET.host, { t: 'chat', text });
}
function sendEmo(e) { if (NET.role === 'host') addEmo(NET.myName, e); else send(NET.host, { t: 'emo', e }); }
function renderChat() {
  let el = $('#chat');
  if (!NET.chatOpen || !NET.role) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div'); el.className = 'chat'; el.id = 'chat';
    el.innerHTML = `<div class="cin"><div class="chd"><h3 style="font-size:1.05rem">💬 聊天</h3><button class="pill" id="chatX">關閉</button></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="emos">${EMOS.map(e => `<button data-emo="${e}" aria-label="送出 ${e}">${e}</button>`).join('')}</div>
      <form id="chatF"><input id="chatI" maxlength="120" placeholder="說點什麼…（例如：我真的是好人！）" autocomplete="off"><button class="btn" type="submit">送出</button></form></div>`;
    document.body.appendChild(el);
    $('#chatX', el).onclick = () => { NET.chatOpen = false; renderChat(); };
    el.querySelectorAll('[data-emo]').forEach(b => b.onclick = () => sendEmo(b.dataset.emo));
    $('#chatF', el).onsubmit = (ev) => { ev.preventDefault(); const i = $('#chatI', el); sendChat(i.value); i.value = ''; i.focus(); };
  }
  const box = $('#msgs', el);
  box.innerHTML = NET.chat.map(m => m.sys ? `<div class="sys">— ${esc(m.text)} —</div>` : `<div><b>${esc(m.from)}</b>：${m.emo ? `<span style="font-size:1.3rem">${m.text}</span>` : esc(m.text)}</div>`).join('') || '<div class="sys">還沒有訊息</div>';
  box.scrollTop = box.scrollHeight;
}

// ----- setup & lobby screens -----
function playSegHTML() {
  const p = setupCfg.play;
  return `<div class="setup" style="gap:8px"><h3>怎麼玩</h3><div class="seg"><button data-play="local" class="${p === 'local' ? 'on' : ''}">這支手機</button><button data-play="host" class="${p === 'host' ? 'on' : ''}">線上開房</button><button data-play="join" class="${p === 'join' ? 'on' : ''}">加入房間</button></div>
    <span class="small muted">${p === 'local' ? '和電腦玩，或幾個人輪流用同一支手機。' : p === 'host' ? '你開一個房間，朋友用自己的手機輸入房號加入，空位由電腦騎士補。' : '輸入朋友給你的 4 碼房號。'}</span>
    ${NET.err ? `<div class="err">${esc(NET.err)}</div>` : ''}</div>`;
}
function bindPlaySeg(save) { document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => { if (save) save(); setupCfg.play = b.dataset.play; NET.err = ''; renderSetup(); }); }
function renderNetSetup() {
  const c = setupCfg, host = c.play === 'host';
  const name = c.netName ?? store.get('avalon-name');
  $('#app').innerHTML = `
  <div class="top"><h1>圓桌騎士<small>阿瓦隆規則</small></h1><button class="pill" id="rulesBtn">規則</button></div>
  <p style="margin:0;color:var(--muted);line-height:1.6">亞瑟王的騎士裡藏著邪惡的爪牙。組隊、投票、出任務，找出誰在說謊。</p>
  ${playSegHTML()}
  <div class="setup">
    <div style="display:flex;flex-direction:column;gap:6px"><h3>你的名字</h3><input class="netin" id="nmI" maxlength="8" value="${esc(name)}" placeholder="最多 8 個字"></div>
    ${host ? '<p class="small muted" style="margin:0">人數、特殊角色和湖中女神，進房後再設定。</p>'
      : `<div style="display:flex;flex-direction:column;gap:6px"><h3>房號</h3><input class="netin" id="codeI" maxlength="4" value="${esc(c.code || '')}" placeholder="例如 K7QF" style="text-transform:uppercase;letter-spacing:.3em;font-size:1.3rem;max-width:200px" autocapitalize="characters"></div>`}
    <button class="btn" id="go" style="align-self:flex-start;font-size:1.05rem">${host ? '建立房間' : '加入房間'}</button>
    <span class="small muted">需要網路。房主的手機負責分配身分和計算，遊戲中請房主不要關掉這個網頁。</span>
  </div>`;
  $('#rulesBtn').onclick = showRules;
  const keep = () => { c.netName = $('#nmI').value; const ci = $('#codeI'); if (ci) c.code = ci.value; };
  bindPlaySeg(keep);
  $('#go').onclick = () => {
    const nm2 = $('#nmI').value.trim().slice(0, 8);
    if (!nm2) { $('#nmI').focus(); return; }
    store.set('avalon-name', nm2); c.netName = nm2;
    if (host) hostRoom(nm2);
    else { const code = ($('#codeI').value || '').trim().toUpperCase(); if (code.length !== 4) { $('#codeI').focus(); return; } c.code = code; joinRoom(code, nm2); }
  };
}
function renderLobby() {
  const host = NET.role === 'host', L = NET.lobby;
  let body;
  if (NET.status || !L || (host && !NET.code)) body = `<p>${esc(NET.status || '連線中…')}</p>`;
  else {
    const players = host ? [NET.myName, ...NET.conns.map(r => r.name)] : L.players;
    const n = host ? lobbyN() : L.n;
    const roles = buildRoles(n, L.opts), countOf = (r) => roles.filter(x => x === r).length;
    const ns = []; for (let k = Math.max(5, players.length); k <= 10; k++) ns.push(k);
    body = `<div style="text-align:center"><span class="small muted">房號</span><div class="code">${esc(NET.code)}</div>
      ${host ? `<div class="btns" style="justify-content:center"><button class="btn alt" id="share">分享邀請連結</button></div><p class="small muted" style="margin:6px 0 0">朋友打開遊戲 → 加入房間 → 輸入房號。</p>` : ''}</div>
    <div style="display:flex;flex-direction:column;gap:6px"><h3>玩家（${players.length} 位真人）</h3>
      <div class="plist">${players.map((p, i) => `<div><span>${esc(p)}${p === NET.myName ? '（你）' : ''}</span><span class="small muted">${i === 0 ? '房主' : '已加入'}</span></div>`).join('')}
      ${n > players.length ? `<div><span class="muted">電腦騎士 × ${n - players.length}</span><span class="small muted">補空位</span></div>` : ''}</div></div>
    ${host ? `<div><h3>總人數</h3>${players.length > 10 ? '<p class="err">最多 10 人。</p>' : `<div class="seg">${ns.map(k => `<button data-ln="${k}" class="${n === k ? 'on' : ''}">${k}</button>`).join('')}</div>`}
        <p class="small muted" style="margin:6px 0 0">正義 ${n - EVIL_N[n]} 人、邪惡 ${EVIL_N[n]} 人。換人數時會套用建議配置。</p></div>
      <div style="display:flex;flex-direction:column;gap:6px"><h3>特殊角色</h3>
        ${[['percival', '派西維爾（正義）'], ['morgana', '莫甘娜（邪惡）'], ['mordred', '莫德雷德（邪惡）'], ['oberon', '奧伯倫（邪惡）']].map(([k, l]) => `<label class="chk"><input type="checkbox" data-lopt="${k}" ${L.opts.includes(k) ? 'checked' : ''}> ${l}</label>`).join('')}
        <label class="chk"><input type="checkbox" id="llady" ${L.lady ? 'checked' : ''}> 湖中女神（建議 7 人以上）</label></div>` : ''}
    <p class="small muted" style="margin:0">本局角色：${Object.keys(ROLE).filter(countOf).map(r => `<span style="color:${isEvil(r) ? 'var(--evil)' : 'var(--good)'}">${ROLE[r].n}${countOf(r) > 1 ? '×' + countOf(r) : ''}</span>`).join('、')}${L.lady ? '・湖中女神' : ''}</p>
    ${host ? `<button class="btn" id="startOn" style="align-self:flex-start;font-size:1.05rem" ${players.length > 10 ? 'disabled' : ''}>入座圓桌</button>` : `<p class="small muted" style="margin:0">共 ${n} 位騎士。等房主開始…</p>`}`;
  }
  $('#app').innerHTML = `
  <div class="top"><h1>圓桌騎士<small>線上房間</small></h1><div style="display:flex;gap:6px">${chatBtnHTML()}<button class="pill" id="rulesBtn">規則</button><button class="pill" id="leave">離開</button></div></div>
  <div class="setup">${body}</div>`;
  $('#rulesBtn').onclick = showRules;
  bindChatBtn();
  $('#leave').onclick = netLeave;
  document.querySelectorAll('[data-ln]').forEach(b => b.onclick = () => { NET.lobby.n = +b.dataset.ln; NET.lobby.opts = DEFAULTS[NET.lobby.n].slice(); NET.lobby.lady = NET.lobby.n >= 7; render(); });
  document.querySelectorAll('[data-lopt]').forEach(b => b.onchange = () => { const k = b.dataset.lopt; NET.lobby.opts = b.checked ? [...NET.lobby.opts, k] : NET.lobby.opts.filter(x => x !== k); render(); });
  const ll = $('#llady'); if (ll) ll.onchange = (e) => { NET.lobby.lady = e.target.checked; render(); };
  const so = $('#startOn'); if (so) so.onclick = startOnline;
  const sh = $('#share'); if (sh) sh.onclick = async () => {
    const link = location.href.split('?')[0].split('#')[0] + '?room=' + NET.code;
    const text = `來圓桌騎士！房號 ${NET.code}`;
    try { if (navigator.share) { await navigator.share({ title: '圓桌騎士', text, url: link }); return; } } catch { return; }
    try { await navigator.clipboard.writeText(text + ' ' + link); sh.textContent = '已複製連結'; } catch { sh.textContent = '房號：' + NET.code; }
  };
  syncSoon();
}

window.__av = () => S;
window.__avNet = () => NET;
render();
})();
</script>
